<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pianificatore turni</title>
<link rel="manifest" href="app-manager.webmanifest">
<meta name="theme-color" content="#1e5631">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni Manager">
<link rel="apple-touch-icon" href="icone/manager-180.png">
<link rel="icon" href="icone/manager-192.png">
<script>
  // tema scelto su questo dispositivo: 'light', 'dark' oppure automatico (come il dispositivo)
  try { const t = localStorage.getItem('turni-tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* automatico */ }
</script>
<style>
  :root {
    --green: #1e5631; --green-soft: #d5eadb; --yellow: #ffc72c; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #d9d9de; --bg: #f4f5f2; --err: #ffd3d6; --err-ink: #b3261e; --warn: #fff0c2; --warn-ink: #8a6100;
    --ok: #dcf0e1; --rest: #1e40af; --brand: #1e5631;
    /* superfici e linee (tema chiaro); il tema scuro ridefinisce gli stessi nomi più sotto */
    --surface: #ffffff; --surface-2: #f7f8f6; --hover: #f3f4f1; --line-soft: #e8e9e5; --line-strong: #b9b9c0; --faint: #c8c8cc;
    --info-bg: #e8eefc; --info-ink: #1e40af; --ev-bg: #fff4d6; --ev-ink: #7a5200; --closed-bg: #e2e8f0; --closed-ink: #334155;
    --tip-bg: #1d1d1f; --tip-ink: #ffffff; --tip-muted: #b9b9c0;
    /* grafici: blu = sopra / pianificato, rosso = sotto (coppia divergente), griglia appena staccata dalla superficie */
    --viz-up: #2a78d6; --viz-down: #e34948; --viz-grid: #e7e8e4; --viz-ink: #1d1d1f; --viz-muted: #6b6b70; --viz-today: #eb6834;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--brand); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  header .brand .m { background: var(--yellow); color: var(--brand); border-radius: 6px; padding: 2px 8px; font-size: 18px; }
  nav { display: flex; gap: 4px; }
  nav button { background: transparent; border: 0; color: #d9eadf; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav button.active { background: var(--yellow); color: var(--brand); }
  main { padding: 16px 20px 40px; }
  h2 { margin: 4px 0 12px; font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button.btn, label.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.btn:hover, label.btn:hover { border-color: var(--line-strong); }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.danger { background: var(--err-ink); color: #fff; border-color: var(--err-ink); }
  button.link { background: none; border: 0; color: var(--green); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  button:disabled { opacity: .45; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar .week { font-size: 17px; font-weight: 700; min-width: 210px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; font: inherit; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--green-soft); color: var(--green); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .chip.err { background: var(--err); color: var(--err-ink); }
  .chip.warn { background: var(--warn); color: var(--warn-ink); }
  .chip.ok { background: var(--ok); color: var(--green); }
  .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .gridwrap { overflow: auto; max-height: calc(100vh - 190px); }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
  .grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
  .grid thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; padding: 8px 6px; font-size: 13px; }
  .grid .name { position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: left; padding: 6px 10px; min-width: 190px; font-weight: 600; white-space: nowrap; }
  .grid thead .name { z-index: 3; background: var(--surface-2); }
  .grid tr.cov td { background: var(--surface-2); font-size: 12px; }
  .grid tr.cov .name { font-weight: 500; color: var(--muted); background: var(--surface-2); }
  .grid tr.cov .c { text-align: center; font-weight: 700; padding: 4px; }
  .grid tr.cov .c.okc { color: var(--green); background: var(--ok); }
  .grid tr.cov .c.bad { color: var(--err-ink); background: var(--err); }
  .grid tr.cov .c.soft { color: var(--warn-ink); background: var(--warn); }
  td.cell { min-width: 96px; height: 50px; text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 13px; }
  td.cell:hover { outline: 2px solid var(--green); outline-offset: -2px; }
  td.cell.err { background: var(--err); }
  td.cell.warn { background: var(--warn); }
  td.cell .st { font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  td.cell.dbl { box-shadow: inset 3px 0 0 var(--yellow); }
  .rest { color: var(--rest); font-weight: 600; font-size: 12px; }
  .abs { color: var(--muted); font-weight: 700; font-size: 12px; }
  .empty { color: var(--faint); }
  td.tot { text-align: center; min-width: 80px; font-weight: 700; font-variant-numeric: tabular-nums; }
  td.tot .sub { font-weight: 400; font-size: 11px; color: var(--muted); }
  td.tot.over { background: var(--err); } td.tot.under { background: var(--warn); } td.tot.exact { background: var(--ok); }
  aside.problems { padding: 14px; max-height: calc(100vh - 190px); overflow: auto; }
  aside h3 { margin: 0 0 8px; font-size: 15px; }
  .prob { display: flex; gap: 8px; padding: 8px; border-radius: 8px; cursor: default; }
  .prob.click { cursor: pointer; } .prob.click:hover { background: var(--hover); }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
  .dot.ERROR { background: #d32f2f; } .dot.WARNING { background: #f9a825; }
  .prob .r { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  details.help { margin-bottom: 12px; padding: 10px 14px; }
  details.help summary { cursor: pointer; font-weight: 700; }
  details.help ul { margin: 8px 0 0; padding-left: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  table.list { border-collapse: collapse; width: 100%; }
  .list th, .list td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .list th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: var(--surface-2); }
  .list tr.group td { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .list tr.sel td { background: var(--err); }
  .list tr.clickable { cursor: pointer; } .list tr.clickable:hover td { background: var(--hover); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--hover); font-size: 12px; margin-right: 4px; }
  .pill.on { background: var(--green-soft); color: var(--green); font-weight: 600; }
  label.tg { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; margin: 2px 4px 2px 0; user-select: none; background: var(--surface); }
  label.tg.on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
  label.tg input { display: none; }
  .deletebar { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 12px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
  .form { display: grid; gap: 12px; }
  .form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .form label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
  input.bad { border-color: var(--err-ink); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal { background: var(--surface); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 4px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .shiftbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .reqtag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--info-bg); color: var(--info-ink); font-size: 9.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; vertical-align: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  button.ib { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: var(--green); font: 700 12px/1 -apple-system, sans-serif; cursor: pointer; padding: 0; margin-left: 4px; vertical-align: 2px; text-transform: none; letter-spacing: 0; }
  button.ib:hover { background: var(--green); color: #fff; }
  th button.ib { width: 18px; height: 18px; font-size: 11px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: #e5484d; color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 2px; }
  .evtag { display: inline-block; padding: 0 7px; border-radius: 999px; background: var(--ev-bg); color: var(--ev-ink); font-size: 11px; line-height: 18px; font-weight: 600; white-space: nowrap; }
  .evtag.closed { background: var(--closed-bg); color: var(--closed-ink); }
  .autotag { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--info-bg); color: var(--info-ink); font-size: 11px; line-height: 18px; margin-left: 4px; }
  .reqcard { padding: 14px 16px; margin-bottom: 12px; }
  .reqcard .when { font-weight: 700; font-size: 15px; }
  .card.empty { color: var(--muted); }
  .toolbar .ptabs { margin: 0; }
  .reqcard .prop { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
  /* iPhone ingrandisce da solo la pagina quando si tocca un campo con testo sotto i 16px: su telefono/tablet si usano 16px */
  @media (pointer: coarse), (max-width: 760px) { input, select, textarea { font-size: 16px !important; } }
  @media (max-width: 760px) {
    /* accessi del personale su telefono: una scheda per persona, con i pulsanti sotto */
    .card:has(> table.acc) { max-height: none !important; overflow: visible !important; position: static !important; }
    table.acc thead { display: none; }
    table.acc tr { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    table.acc td { display: inline-block; border: 0 !important; padding: 2px 8px 2px 0 !important; position: static !important; box-shadow: none !important; background: none !important; }
    table.acc td:first-child { display: block; }
    table.acc td:last-child { display: block; text-align: left !important; margin-top: 6px; }
  }
  /* ---- giornaliero: modifica trascinando (tablet) ---- */
  .sheet.editing .lrow:not(.lhead):not(.lcount) { min-height: 38px; }
  .sheet.editing .lrow:not(.lhead):not(.lcount) > div { font-size: 13px; }
  .lbar.drag { top: 4px; bottom: 4px; cursor: grab; touch-action: none; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .lbar.drag .hl, .lbar.drag .hr { position: absolute; top: 0; bottom: 0; width: 16px; cursor: ew-resize; }
  .lbar.drag .hl { left: -4px; } .lbar.drag .hr { right: -4px; }
  .lbar.drag .hl::after, .lbar.drag .hr::after { content: ''; position: absolute; top: 25%; bottom: 25%; left: 6px; width: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .lbar.dragging { opacity: .85; outline: 2px solid #111; z-index: 3; cursor: grabbing; }
  .lsec.droptarget h4 { outline: 3px solid #111; }
  .lrow.swaptarget { background: #fff3c4 !important; outline: 2px dashed #8a6100; outline-offset: -2px; }
  .dropbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 26; display: flex; gap: 6px; background: #1d1d1f; padding: 8px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .dropbar span { padding: 10px 14px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; border: 2px solid transparent; }
  .dropbar span.on { border-color: #fff; transform: scale(1.06); }
  .dragtip { position: fixed; z-index: 30; background: #111; color: #fff; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 8px; pointer-events: none; transform: translate(-50%, -130%); white-space: nowrap; }
  #toast .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; background: #1d1d1f; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 24px); font-size: 14px; }
  #toast .bar button { font: inherit; font-weight: 700; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; background: #fff; color: #111; }
  #toast .bar button.go { background: var(--yellow); }
  .sync { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .sync button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sync button.bad { background: #fde68a; color: #7c2d12; }
  .notice { padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .notice.err { background: var(--err); color: var(--err-ink); } .notice.info { background: var(--info-bg); color: var(--info-ink); } .notice.warn { background: var(--warn); color: var(--warn-ink); }
  .section { padding: 16px; margin-bottom: 16px; }
  /* ---- adattamento a schermi piccoli e finestre ridotte ---- */
  html, body { overflow-x: clip; }
  header { flex-wrap: wrap; height: auto; min-height: 56px; row-gap: 4px; padding-top: 6px; padding-bottom: 6px; }
  header .brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav button { white-space: nowrap; flex: none; }
  .sheet { min-width: 0; }
  .countwrap { overflow-x: auto; max-width: 100%; }
  .countwrap > .lsec { min-width: 640px; }
  .modal { max-width: calc(100vw - 24px); }
  .card:has(> table.list), .card > div:has(> table.list) { overflow-x: auto; }
  @media (max-width: 1180px) {
    header { gap: 4px 12px; }
    nav button { padding: 8px 10px; }
  }
  @media (max-width: 1024px) {
    .grid .name { min-width: 150px; max-width: 170px; white-space: normal; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
  }
  @media (max-width: 760px) {
    header { padding: 6px 10px; }
    header .brand { width: 100%; font-size: 14px; }
    nav { width: 100%; }
    nav button { padding: 6px 10px; font-size: 13px; }
    main { padding: 10px 10px 30px; }
    h2 { font-size: 18px; }
    .toolbar { gap: 6px; }
    .toolbar .week { min-width: 0; flex: 1 1 140px; font-size: 15px; }
    .grid .name { min-width: 112px; max-width: 128px; white-space: normal; font-size: 12px; padding: 4px 6px; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
    .grid thead th { padding: 6px 3px; font-size: 12px; }
    td.cell { min-width: 76px; height: 46px; font-size: 12px; }
    td.tot { min-width: 62px; }
    .gridwrap, aside.problems { max-height: none; }
    .modal-bg { padding: 10px; align-items: flex-start; }
    .modal { padding: 14px; max-height: calc(100vh - 20px); }
    .form .row { gap: 8px; }
    .list th, .list td { padding: 7px 8px; }
    .sheet { padding: 10px 8px; }
    .daily .dayside .card { margin-bottom: 8px; }
  }

  /* ---- lineare giornaliero ---- */
  @media screen and (max-width: 900px) {
    .sheet .lrow { grid-template-columns: 36px 130px 40px 40px minmax(0, 1fr); font-size: 11.5px; }
  }
  @media screen and (max-width: 560px) {
    .sheet .lrow { grid-template-columns: 96px 36px 36px minmax(0, 1fr); font-size: 11px; min-height: 20px; }
    .sheet .lrow > div { padding: 2px 3px; }
    .sheet .lrow .lpos { display: none; }
    .sheet .lhead .ltrack span.odd { display: none; }
    .sheet .countwrap .lrow { grid-template-columns: 96px 72px minmax(0, 1fr); }
  }
  .daily { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .daily { grid-template-columns: minmax(0, 1fr); } }
  .sheet { padding: 12px 14px; }
  .lsec { margin-top: 12px; }
  .lsec h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--green); text-align: center; background: var(--yellow); border-radius: 4px; padding: 2px; }
  .lrow { display: grid; grid-template-columns: 62px 190px 46px 46px minmax(0, 1fr); align-items: stretch; min-height: 22px; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
  .lrow > div { padding: 2px 4px; display: flex; align-items: center; }
  .lrow.click { cursor: pointer; } .lrow.click:hover { background: var(--hover); }
  .lrow .lpos { font-size: 10px; font-weight: 700; color: var(--muted); justify-content: flex-end; }
  .lrow .lname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .ltime { font-variant-numeric: tabular-nums; justify-content: center; }
  .lrow .ltrack { position: relative; padding: 0; min-height: 20px;
    background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to right, var(--line-soft) 1px, transparent 1px);
    background-size: var(--hw) 100%, calc(var(--hw) / 4) 100%; }
  .lbar { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; opacity: .9; }
  .lhead { border-bottom: 2px solid var(--line); font-weight: 700; font-size: 11px; color: var(--muted); }
  .lhead .ltrack { background: var(--surface-2); }
  .lhead .ltrack span { position: absolute; top: 3px; transform: translateX(-50%); font-size: 10px; }
  .lcount .ltrack { display: flex; background: none; }
  .lcount .ltrack span { flex: 1; text-align: center; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .lcount.total { font-weight: 800; background: var(--green-soft); }
  .st-CUCINA { background: #d84a3a; } .st-FRONT { background: #2f80c0; } .st-MCCAFE { background: #7a4a2a; }
  .st-SERVIZIO { background: #8a8a8a; } .st-HOSPITALITY { background: #6c4bb5; } .st-MANAGER { background: #1f5f46; }
  .lbar .lbl { display: none; }
  .printhead { display: none; }
  .evimp { font-size: 11px; color: var(--ev-ink); font-weight: 600; margin-top: 2px; }
  .lcount.gcrow { color: var(--green); font-weight: 600; } .lcount.evrow { color: var(--ev-ink); }
  .dayside .card { padding: 12px; margin-bottom: 12px; } .dayside h3 { margin: 0 0 6px; font-size: 14px; }
  .dayside ul { margin: 0; padding-left: 18px; } .dayside li { margin: 2px 0; }
  @media print {
    /* margine della pagina a zero: così il browser non stampa intestazione e piè di pagina (titolo, indirizzo, data, numero di pagina) */
    @page { size: A4 portrait; margin: 0; }
    header, .toolbar, .no-print, #modal { display: none !important; }
    body { background: #fff; margin: 0; } main { padding: 8mm; }
    /* lineare stampato: solo griglia, ore e aree; in testa la previsione, sotto riposi e assenze */
    .daily { display: block; } .card { border: 0; box-shadow: none; }
    .sheet { padding: 0; }

<script>
'use strict';
const T = window.Turni;
const KEY = 'turni-familyfood-v1';
// menu: gruppi di voci [vista, icona, nome]; "Persone" raccoglie in una pagina (con le schede) personale, formazione, aperture, doppi e ferie
const NAV = [[null, [['home', 'Home'], ['turni', 'Turni'], ['giornaliero', 'Giornaliero'], ['previsioni', 'Previsioni'], ['richieste', 'Richieste']]],
  ['Gestione', [['personale', 'Persone'], ['regole', 'Impostazioni']]]];
// pagine raccolte sotto una voce del menu, con le schede in alto: [voce del menu, schede]
const GROUPS = { giornaliero: [['giornaliero', 'Lineare'], ['vlh', 'VLH']], regole: [['regole', 'Regole'], ['store', 'Store']] };
const groupOf = (v) => Object.keys(GROUPS).find((g) => GROUPS[g].some(([k]) => k === v)) || null;
// intestazione di ogni pagina: titolo e una riga di spiegazione
const PAGE = {
  home: ['Home', 'Il riassunto: settimane, richieste e previsioni'],
  turni: ['Turni', 'La settimana di crew, hospitality e manager'],
  giornaliero: ['Giornaliero', 'Il lineare del giorno, con previsione e coperture'],
  vlh: ['VLH', 'Le posizioni da aprire ora per ora'],
  previsioni: ['Previsioni', 'Vendite, clienti e ore di lavoro previste · eventi e chiusure'],
  richieste: ['Richieste', 'Le richieste del personale dall\'app Turni'],
  personale: ['Persone', 'Chi lavora nel locale: ore, formazione, aperture, doppi e assenze'],
  regole: ['Impostazioni', 'Regole di crew e hospitality, orari e postazioni del locale, regole dei manager'],
};
const PEOPLE = [['personale', 'Personale'], ['formazione', 'Formazione'], ['aperture', 'Aperture e chiusure'], ['doppi', 'Doppi'], ['ferie', 'Ferie e malattie']];
const isPeople = (v) => PEOPLE.some(([k]) => k === v);
/** Tutte le sezioni: [vista, nome]. */
const VIEWS = [...NAV.flatMap(([, items]) => items).filter(([k]) => k !== 'personale' && !GROUPS[k]), ...Object.values(GROUPS).flat(), ...PEOPLE];
/** Menu laterale sul computer (finestra larga); su telefono, tablet e finestre strette resta la barra in alto. */
const sideOn = () => !compactOn() && window.innerWidth > 900;
const TIME_OPTIONS_BASE = []; for (let m = 6 * 60; m <= 23 * 60; m += 15) TIME_OPTIONS_BASE.push(m);
/** Orari dei menu dei turni: dalle 6:00 alle 23:00, allargati all'orario del locale (apertura presto, chiusura dopo mezzanotte). */
function timeOptions() {
  const c = (typeof state !== 'undefined' && state && state.config) || {};
  let lo = 360, hi = 1380;
  for (let d = 1; d <= 7; d++) { const h = (c.hours || {})[d] || {}; if (h.h24) { lo = 0; hi = Math.max(hi, 1440); } else { if (h.open != null) lo = Math.min(lo, h.open); if (h.close != null) hi = Math.max(hi, h.close); } }
  if (c.open != null) lo = Math.min(lo, c.open); if (c.close != null) hi = Math.max(hi, c.close);
  if (lo === 360 && hi === 1380) return TIME_OPTIONS_BASE;
  const out = []; for (let m = Math.floor(lo / 15) * 15; m <= hi; m += 15) out.push(m); return out;
}
/** Testo di un orario nei menu: dopo mezzanotte si aggiunge "(notte)". */
const timeLabel = (t) => (t === 1440 ? '24:00' : t > 1440 ? `${T.fmtTime(t)} (notte)` : T.fmtTime(t));

// ---------- stato (salvato nel browser) ----------
let storageOk = true;
let state = loadState();
const ui = { view: 'home', ws: T.mondayOf(T.todayDay()), day: T.todayDay(), type: 'CREW', deleteMode: false, selected: new Set(), draft: null };
// Aperta dall'app "Turni" (sezione Manager, ?s = locale) o installata: finché non si entra con la password
// dei manager non si vede niente (né menu né dati), solo la schermata di accesso, che non si può chiudere.
const APP_STORE = new URLSearchParams(location.search).get('s');
const APP_MODE = !!APP_STORE || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
ui.locked = APP_MODE && TurniCloud.configured() && !TurniCloud.loggedIn();

// Se il browser non permette di salvare (es. navigazione privata) l'app funziona lo stesso, ma senza memoria.
function loadState() {
  try { const s = JSON.parse(window.localStorage.getItem(KEY)); if (s && Array.isArray(s.employees)) return TurniData.migrate(s); } catch (e) { storageOk = false; }
  return TurniData.sampleState();
}
function saveLocal() {
  try { window.localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
}
/** Ogni modifica: salva nel browser e (se collegato) anche online, pochi secondi dopo. */
function save() { saveLocal(); cloudTouch(); }
const newId = () => state.nextId++;
const empById = (id) => state.employees.find((e) => e.id === id);
const mgrById = (id) => (state.managers || []).find((m) => m.id === id);
/** Dipendente o manager (hanno numeri diversi): serve per gli accessi all'app del personale. */
const personById = (id) => empById(id) || mgrById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeSelect = (value, onchange) =>
  `<select onchange="${onchange}">${(() => { const o = timeOptions(); return value != null && !o.includes(value) ? [...o, value].sort((a, b) => a - b) : o; })().map((t) => `<option value="${t}" ${t === value ? 'selected' : ''}>${timeLabel(t)}</option>`).join('')}</select>`;
const sortByName = (list) => [...list].sort((a, b) => T.fullName(a).localeCompare(T.fullName(b), 'it'));

// ---------- navigazione ----------
const INFO = {
  'previsioni': [`Previsioni`, `Per ogni giorno: vendite previste, clienti (GC) e <b>Ore totali</b>.<br><br><b>Ore totali</b> = le ore di lavoro del giorno come nel totale del lineare (hospitality + crew + doppi turni), <b>senza le ore manager</b>.<br><br>Il generatore toglie le ore hospitality tipiche di quel giorno (media delle 4 settimane prima) e distribuisce le ore che restano tra i crew nelle fasce; le hospitality seguono le loro fasce in Regole. I giorni senza Ore totali usano i minimi di Regole.`],
  'prev-auto': [`Previsioni automatiche`, `Vendite e GC segnati <b>auto</b> sono calcolati in automatico dallo storico delle vendite, aggiornato ogni giorno.<br><br>Il calcolo mette insieme più metodi (la previsione del sistema di cassa, la media delle ultime settimane, lo stesso periodo dell'anno scorso) e dà più peso a quelli che nelle ultime 8 settimane hanno sbagliato meno: più giorni di storico ci sono, più diventa preciso.<br><br>Le <b>Ore totali</b> segnate <b>stima</b> sono calcolate dai GC previsti, con il rapporto ore/clienti imparato dai giorni in cui le hai scritte tu (ultime 8 settimane; senza dati si usa un valore di partenza). Se cambi i GC a mano, la stima si aggiorna.<br><br>Se cambi un valore a mano, resta il tuo: gli aggiornamenti automatici non lo sovrascrivono. Più settimane correggi, più la stima delle Ore totali diventa precisa.<br><br><b>Settimane già pianificate:</b> quando una settimana ha dei turni, i suoi numeri restano fermi; si aggiornano solo le settimane ancora da fare (e la previsione del sistema di cassa, solo come confronto).<br><br><b>Per canale:</b> clicca il giorno (▸) per vedere vendite e GC divisi per canale, con le quote medie delle ultime 4 settimane per lo stesso giorno.`],
  'eventi': [`Eventi e chiusure`, `Qui segni i giorni diversi dal solito. Le previsioni di quei giorni si correggono da sole, e di conseguenza le Ore totali e i turni.<br><br><b>🔒 Chiusura totale</b> (festività, inventario): vendite, GC e ore a zero e nessun turno. Nella settimana della chiusura il riposo di ognuno (crew, hospitality e manager) va nei giorni di chiusura e le ore del contratto non si perdono: si distribuiscono sugli altri giorni aperti.<br><b>🕐 Orario ridotto</b> (es. il 24 chiude alle 20:30, o apre più tardi): quel giorno il generatore usa il nuovo orario come se fosse quello normale. La squadra di chiusura si sposta sulla nuova chiusura, nessun turno va oltre, e le previsioni calano della quota di clienti che di solito entra nelle ore perse.<br><b>🕒 Chiusura parziale</b> (manutenzione in mezzo alla giornata): le previsioni calano della quota di clienti di quelle ore; niente turni e niente minimi in quegli orari. Per aprire più tardi o chiudere prima usa "Orario ridotto".<br><b>⭐ Evento o ricorrenza</b> (promozioni, ricorrenze, feste locali): l'effetto si calcola dallo storico, guardando come sono andate le stesse giornate negli anni passati (date di confronto). Puoi anche scrivere tu la %.<br><b>🏬 Novità in zona</b> (nuovo negozio vicino, cantiere, nuova zona commerciale): indichi tu la % per il periodo; dopo qualche settimana le previsioni la imparano da sole dai dati.<br><br><b>Eventi di più giorni:</b> puoi dare una % diversa a ogni giorno con "Riempi veloce" o giorno per giorno.<br><br><b>Dove si vede l'effetto:</b> sotto vendite e GC in Previsioni, nel lineare (riquadro Previsione e righe "GC previsti" e "di cui evento" ora per ora) e in testa al lineare stampato.<br><br>Con un evento il calcolo parte dalla previsione "normale" delle ultime settimane, così l'effetto non viene contato due volte. I valori scritti a mano restano i tuoi.<br><br><b>Suggeriti dallo storico</b>: festività in cui il locale è stato chiuso negli ultimi due anni e giorni che l'anno scorso hanno avuto molti più clienti del solito.`],
  'mgr': [`Squadra manager`, `I manager hanno un calendario a parte (non entrano nelle Ore totali e nei rush dei crew).<br><br><b>Ruolo e ore</b>: ore da contratto di ognuno, su 6 giorni; i giorni in cui possono riposare si scelgono nella sezione <b>Store</b>.<br><b>Giorni ordine</b>: giorni in cui quella persona fa l'ordine: entra entro l'orario impostato nella sezione Store (o in apertura), non riposa e il giorno prima non fa la sera.<br><b>Orario flessibile</b>: giorni in cui può fare un orario a metà giornata invece di apertura o chiusura.<br><b>1 centrale</b>: una volta a settimana, nei primi giorni della settimana, un turno centrale (es. per controllare gli orari).<br><br>Ogni giorno: un manager in apertura e uno in chiusura. Nei giorni di <b>delivery</b> c'è un secondo manager in apertura. <b>Carpigiani</b> (ogni 2 settimane, qualsiasi manager): il giorno dello smontaggio due manager la sera, il giorno del rimontaggio due manager in apertura. Stacchi, durate dei turni e manager minimi al giorno: sezione <b>Store</b>. Il weekend gira tra aperture, centrali e chiusure.`],
  'hosp-rot': [`Pranzi e cene delle hospitality`, `Quanti turni di pranzo e di cena fa ognuna questa settimana e nelle 4 settimane prima (pranzo = turno che sta per lo più prima delle 16:00). Il generatore li fa a rotazione: chi ha fatto più cene fa più pranzi, e il contrario. La barra mostra la parte di pranzi.`],
  'mgr-weekend': [`Weekend dei manager`, `Quante aperture, centrali e cene ha fatto ognuno nel fine settimana nelle ultime 4 settimane (questa compresa). Il generatore le fa a rotazione, così in un mese ognuno fa almeno un'apertura, un centrale e una cena.`],
  'affiancamenti': [`Affiancamenti in apertura e chiusura`, `Qui programmi chi deve imparare ad <b>aprire</b> la cucina (MFY) o il McCafé, oppure a <b>chiudere</b> il McCafé. Per ogni persona scegli quante volte in tutto (es. 4), quante al massimo a settimana (es. 3) e, se vuoi, in quali giorni.<br><br>Quando generi i turni, il programma la mette in apertura (o in chiusura) in quella postazione <b>in più</b> rispetto alla squadra, solo nei giorni in cui c'è un formato che apre (o chiude) accanto a lei. Nel lineare questi turni hanno il segno 🎓.<br><br>Finiti gli affiancamenti, la persona diventa <b>autonoma</b>: viene segnata da sola in Aperture e chiusure e da lì in poi apre (o chiude) senza affiancamento. Puoi anche segnarla autonoma prima, con il pulsante ✅.<br><br>La chiusura della cucina non ha affiancamenti da programmare: in chiusura in cucina ci sono sempre più persone.`],
  'vlhGen': [`Turni creati in base alla VLH`, `Quando è attivo, il generatore guarda i clienti previsti ora per ora e le tabelle VLH: in ogni ora mette le persone che servono per le posizioni da aprire, area per area (MFY, OA, McCafé, sala). Restano valide squadre di apertura e chiusura, presidi delle postazioni, ore da contratto e riposi.<br><br>Se le persone non bastano, le posizioni restano <b>scoperte</b> e le trovi tra i problemi della settimana. Se nella sezione Previsioni hai scritto a mano le <b>Ore totali</b> del giorno, la VLH non le supera: toglie prima le posizioni aperte per pochi clienti (mai le prime tre). Le Ore totali stimate in automatico non fanno da limite.`],
  'formazione': [`Formazione`, `Segna in quali postazioni è formato ogni crew e ogni hospitality: il generatore mette le persone solo dove sono formate. Le postazioni del locale si impostano nella sezione Store. Chi può <b>aprire</b> si segna nella sezione <a href="#" onclick="closeModal();go('aperture');return false">Aperture</a>.`],
  'aperture': [`Aperture e chiusure`, `Segna chi è formato per <b>aprire</b> e per <b>chiudere</b> ogni postazione. Il generatore sceglie solo tra queste persone, crew o hospitality, e non sposta mai chi ha un orario fisso.`],
  'doppi': [`Doppi`, `Indica chi fa il turno doppio (un secondo turno nello stesso giorno, ore in più rispetto al contratto) e quanti giorni a settimana. In <b>Ore massime per doppio</b> puoi abbassare la durata per chi non può fare il doppio standard: il generatore e i controlli ne tengono conto.
  Il generatore mette i doppi solo a queste persone, nei rush di pranzo o cena e preferibilmente nel fine settimana. <b>Chi apre</b> quel giorno non fa il doppio.`],
  'ferie': [`Ferie e malattie`, `Inserisci ferie, malattie, infortuni e assenze. In quei giorni la persona non può avere turni (il generatore non la usa) e le ore da fare in quella settimana calano della quota giornaliera (le ore del contratto divise per i giorni lavorativi). Una malattia o un infortunio in corso si può inserire anche a settimana già fatta: i suoi turni di quei giorni diventano errori da coprire (usa 🛠 Risolvi problemi).`],
  'fasce': [`Fasce di copertura`, `Numero minimo di persone presenti per tutta la durata della fascia, giorno per giorno (0 = nessun minimo). Nei giorni con le Ore totali (sezione Previsioni), i minimi delle fasce senza postazione (rush, picchi, intermedi) vengono ricavati dalle Ore totali, tolte le ore hospitality. Contano crew e hospitality messe in una postazione crew (non quelle in sala). Con una postazione indicata contano solo i presenti in quella postazione; con "Solo formati apertura" solo chi è segnato nella sezione Aperture.<br><br>Le fasce segnate <b>"consiglio"</b> non sono obbligatorie: il generatore cerca di rispettarle, ma se mancano compaiono in <b>giallo</b> tra gli avvisi, non in rosso tra gli errori.`],
  'richieste': [`Richieste del personale`, `I dipendenti, dall'app del personale (con il loro nome utente e password), chiedono un turno compatibile con i loro impegni (es. un concerto la sera). Le richieste arrivate a voce o per messaggio le puoi inserire tu con <b>✍️ Aggiungi richiesta</b>: poi funzionano come le altre (proposte di turno, accetta o rifiuta). Per ognuna il generatore propone un turno; tu accetti, modifichi o rifiuti. <b>Niente cambia nei turni finché non accetti.</b> Le accettate vengono rispettate da "Genera turni" e dai controlli.`],
  'cfg-crewMaxWeekday': [`Max ore turno Crew in settimana`, `Durata massima di un turno normale di un crew nei giorni infrasettimanali. Ognuno può fare ogni tanto un turno più lungo: vedi "Turni lunghi a testa a settimana". Il doppio non conta: ha il suo limite.`],
  'cfg-crewMax': [`Max ore turno Crew (turni lunghi e fine settimana)`, `Durata massima di un turno di un crew nel fine settimana e dei <b>turni lunghi</b> in settimana. Il doppio non conta: ha il suo limite.`],
  'cfg-hospMax': [`Max ore turno Hospitality`, `Durata massima di un turno di un'hospitality, tutti i giorni.`],
  'cfg-minShift': [`Turno minimo`, `Un turno più corto di così viene segnalato tra gli avvisi. Il generatore non crea turni più corti.`],
  'cfg-rest11': [`Stacco tra giorni consecutivi`, `Ore minime tra la fine di un turno e l'inizio del turno del <b>giorno dopo</b>. Per esempio chi chiude la sera può non poter aprire la mattina dopo.`],
  'cfg-rest36': [`Stacco con riposo in mezzo`, `Se tra due turni c'è un <b>giorno di riposo</b>, tra la fine del primo e l'inizio del secondo servono almeno queste ore.`],
  'cfg-longpw': [`Turni lunghi a testa a settimana`, `Quanti turni più lunghi del massimo standard può fare ogni crew nei giorni infrasettimanali. Vanno <b>a rotazione</b>: il generatore li dà prima a chi ne ha fatti meno nelle 4 settimane precedenti. I turni lunghi devono coprire il picco del pranzo o della cena.`],
  'cfg-doubleMax': [`Durata massima doppio`, `Il doppio è un secondo turno nello stesso giorno (ore in più rispetto al contratto). Questa è la sua durata massima. Chi fa i doppi e quanti si decide nella sezione Doppi.`],
  'cfg-doubleGap': [`Pausa minima turno–doppio`, `Ore minime di pausa tra il turno normale e il doppio dello stesso giorno. Chi apre non fa il doppio.`],
  'cfg-closeGrace': [`Ultimi minuti non controllati prima della chiusura`, `Negli ultimi minuti prima della chiusura i minimi delle fasce non vengono controllati: in quel momento c'è solo la squadra di chiusura. La squadra di chiusura invece si controlla fino alla chiusura, e chi è in formazione non può restare da solo.`],

  const today = T.todayDay();
  let changed = false;
  for (const p of state.formazioni) {
    if (p.fine != null || T.affDone(state, p, today) < (p.volte || 1)) continue;
    const last = Math.max(...state.shifts.filter((x) => x.aff === p.id && x.day < today).map((x) => x.day));
    p.fine = last + 1;

/** Dati della settimana per i grafici: vendite (vere o previste), anno scorso, ore pianificate e previste. */
function dashData(ws) {
  const af = state.autoForecast || {}, reali = af.reali || {}, today = T.todayDay(), fc = (state.forecasts || {})[ws];
  const days = DAYS7.map((k) => {

    const planned = state.shifts.filter((x) => x.day === d).reduce((t, x) => t + (x.end - x.start) / 60, 0);

  });

}
/*
 * Grafici della Home: colonne con l'estremità arrotondata e la base dritta, che crescono dalla linea di base.
 * Ogni colonna ha la sua zona sensibile (tutta la fascia del giorno): passando il mouse, toccando o con il tasto Tab

const VW = 460, VH = 200;

function colPath(x, w, y0, y1) {

  if (h < 0.5) return '';

    : `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
}
/** Valori "puliti" per l'asse (0, 10, 20... oppure 0, 50, 100...). */
function niceTicks(max, n = 4) {
  const raw = max / n, p = 10 ** Math.floor(Math.log10(raw || 1)), step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw) || raw;
  const out = []; for (let v = 0; v <= max + 1e-9; v += step) out.push(v); return { ticks: out, top: out[out.length - 1] };
}

// riquadro dei numeri sui grafici: mouse (passaggio), dito (tocco) e tastiera (Tab). data-tip = "titolo|valore|righe..."
function vTipShow(g) {
  let tip = document.getElementById('vtip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'vtip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
  const parts = (g.getAttribute('data-tip') || '').split('|');
  tip.replaceChildren();
  parts.forEach((t, i) => { const el = document.createElement(i === 1 ? 'b' : 'div'); el.textContent = t; el.className = i === 0 ? 'tt' : i === 1 ? 'tv' : 'tl'; tip.appendChild(el); });
  tip.style.display = 'block';
  const b = g.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, b.left + b.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = Math.max(8, b.top - tip.offsetHeight - 8) + 'px';
  document.querySelectorAll('.vm.on').forEach((x) => x !== g && x.classList.remove('on')); g.classList.add('on');
}
function vTipHide() { const tip = document.getElementById('vtip'); if (tip) tip.style.display = 'none'; document.querySelectorAll('.vm.on').forEach((x) => x.classList.remove('on')); }
let vTouch = false;
document.addEventListener('pointerdown', (e) => { vTouch = e.pointerType !== 'mouse'; if (!vTouch) return; const g = e.target.closest && e.target.closest('[data-tip]'); if (!g) vTipHide(); });
document.addEventListener('click', (e) => {

  const g = e.target.closest && e.target.closest('.vm[data-tip]');
  if (g && vTouch && !g.classList.contains('on')) { e.stopPropagation(); e.preventDefault(); vTipShow(g); }
}, true);
document.addEventListener('mouseover', (e) => { if (vTouch) return; const g = e.target.closest && e.target.closest('[data-tip]'); if (g) vTipShow(g); else vTipHide(); });
document.addEventListener('focusin', (e) => { const g = e.target.closest && e.target.closest('[data-tip]'); if (g) vTipShow(g); else vTipHide(); });

  const order = (v && Array.isArray(v.order) ? v.order.filter((x) => ids.includes(x)) : []);
  ids.forEach((x) => { if (!order.includes(x)) order.push(x); }); // riquadri nuovi in fondo
  const shown = v && Array.isArray(v.shown) ? v.shown.filter((x) => ids.includes(x)) : HOME_WIDGETS.filter((w) => w[3]).map((w) => w[0]);
  return { order, shown };
}
function saveHomeLayout(l) { try { localStorage.setItem(HOME_KEY, JSON.stringify(l)); } catch (e) { /* senza memoria del browser vale solo fino alla chiusura */ } }
function homeMove(id, dir) {
  const l = homeLayout(), vis = l.order.filter((x) => l.shown.includes(x)), i = vis.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= vis.length) return;
  const a = l.order.indexOf(vis[i]), b = l.order.indexOf(vis[j]); [l.order[a], l.order[b]] = [l.order[b], l.order[a]];

function homeReset() { try { localStorage.removeItem(HOME_KEY); } catch (e) { /* niente */ } render(); }

function renderTurni() {
  if (ui.type === 'MANAGER') return renderMgrTurni();
  const ctx = T.makeCtx(state, ui.ws);
  const vs = T.validate(ctx).filter((v) => v.rule !== 'VLH'); // le posizioni VLH scoperte sono nella riga riassuntiva della tabella
  const cellV = new Map();
  vs.forEach((v) => { if (v.emp != null && v.day != null) { const k = v.emp + '|' + v.day; if (!cellV.has(k)) cellV.set(k, []); cellV.get(k).push(v); } });
  const later = ctx.employees.filter((e) => e.type === ui.type && e.startDate != null && e.startDate > ui.ws + 6);
  const emps = sortByName(ctx.employees.filter((e) => e.type === ui.type && !later.includes(e)));
  const nErr = vs.filter((v) => v.sev === 'ERROR').length, nWarn = vs.length - nErr;
  const cfg = state.config;

  const head = `<tr><th class="name">Dipendente</th>${ctx.days.map((d) => `<th><button class="link" title="Apri il lineare di questo giorno" onclick="openDaily(${d})">${T.shortDate(d)} ↗</button>${dayTags(d)}</th>`).join('')}<th>Ore</th></tr>`;
  // stessi minimi usati dai controlli (con le previsioni i rush e i picchi chiedono più persone di quelli in Regole)
  // per non allungare la tabella: le posizioni VLH sono riassunte in una riga, e delle altre fasce si vedono solo
  // quelle con un problema nella settimana (con "Mostra tutte le fasce" si vedono tutte quelle che chiedono qualcuno)
  const covAll = ctx.coverage.filter((r) => !r.vlh && (ui.type === 'HOSPITALITY') === (r.station === 'HOSPITALITY') && ctx.days.some((d) => T.reqMin(r, d)));
  const hasProblem = (r) => ctx.days.some((d) => { const need = T.reqMin(r, d); return need && T.coverageMin(ctx, d, r) < need; });
  const covList = ui.covAll ? covAll : covAll.filter(hasProblem);
  const cov = covList.map((req) => `<tr class="cov"><td class="name">${esc(req.name)}${req.soft ? ' <span class="small">· consiglio</span>' : ''} <span class="small">(${T.fmtTime(req.start)}–${T.fmtTime(req.end)})</span></td>${
    ctx.days.map((d) => { const need = T.reqMin(req, d); if (!need) return '<td class="c">—</td>'; const c = T.coverageMin(ctx, d, req); return `<td class="c ${c >= need ? 'okc' : req.soft ? 'soft' : 'bad'}" title="Presenti nel momento più scoperto / minimo richiesto${req.fromForecast ? ' (minimo calcolato dalle Ore totali previste)' : ''} (gli ultimi minuti prima della chiusura non contano)">${c}/${need}</td>`; }).join('')}<td></td></tr>`).join('');
  // riga riassuntiva della VLH: ore di posizioni scoperte per giorno (somma sulle ore)
  const vlhBands = ui.type === 'HOSPITALITY' ? [] : ctx.coverage.filter((r) => r.vlh);
  const vlhRow = !vlhBands.length ? '' : `<tr class="cov"><td class="name">VLH · ore di posizioni scoperte ${ib('vlhGen')}</td>${ctx.days.map((d) => {
    if (!ctx.vlh || !ctx.vlh[d - ctx.ws]) return '<td class="c">—</td>';
    const holes = [];
    for (const r of vlhBands) {
      const need = T.reqMin(r, d);
      if (!need) continue;
      const miss = need - T.coverageMin(ctx, d, r);
      if (miss > 0) holes.push({ h: r.start, n: miss * (r.end - r.start) / 60, txt: `${T.fmtTime(r.start)} ${r.name.replace('VLH ', '')}: ${miss}` });
    }
    const tot = Math.round(holes.reduce((t, x) => t + x.n, 0) * 2) / 2;
    return `<td class="c ${tot ? 'soft' : 'okc'}" title="${esc(tot ? 'Posizioni VLH scoperte:\n' + holes.sort((a, b) => a.h - b.h).map((x) => x.txt).join('\n') : 'Tutte le posizioni VLH coperte')}">${tot ? String(tot).replace('.', ',') : '✓'}</td>`;
  }).join('')}<td></td></tr>`;
  const hidden = covAll.length - covList.length;
  const covToggle = covAll.length ? `<tr class="cov"><td class="name" colspan="${ctx.days.length + 2}">${!covList.length && !ui.covAll ? '✅ Tutte le fasce di copertura sono a posto · ' : ''}<button class="link" onclick="ui.covAll=!ui.covAll;render()">${ui.covAll ? 'Mostra solo le fasce con problemi' : `Mostra tutte le fasce (${hidden} a posto)`}</button></td></tr>` : '';

  const rows = emps.map((e) => {
    const w = T.worked(ctx, e.id), t = T.target(ctx, e), dw = T.doubleWorked(ctx, e.id);
    return `<tr><td class="name" title="${esc(T.TYPES[e.type])} · ${T.fmtDur(e.weeklyMinutes)}/sett.${e.trainee ? ' · in formazione' : ''}">${esc(T.fullName(e))}${ctx.days.some((d) => T.isTrainee(e, d)) || ctx.shifts.some((x) => x.aff && x.employeeId === e.id && x.day >= ctx.ws && x.day <= ctx.ws + 6) ? ' 🎓' : ''}</td>${ctx.days.map((d) => cellHtml(ctx, e, d, cellV.get(e.id + '|' + d))).join('')}
      <td class="tot ${w > t ? 'over' : w < t ? 'under' : 'exact'}">${T.fmtDur(w)}<div class="sub">su ${T.fmtDur(t)}${dw ? ` · +${T.fmtDur(dw)} doppi` : ''}</div></td></tr>`;
  }).join('');

  const probs = vs.map((v, i) => {
    const click = v.emp != null && v.day != null;
    return `<div class="prob ${click ? 'click' : ''}" ${click ? `onclick="openFromProblem(${v.emp},${v.day})"` : ''}><span class="dot ${v.sev}"></span><div><div class="r">${T.RULES[v.rule]}</div>${esc(v.msg)}</div></div>`;
  }).join('') || '<p class="muted">Nessun problema: la settimana rispetta tutte le regole. 🎉</p>';

  return `
  <div class="toolbar">
    <button class="btn" onclick="moveWeek(-1)">◀</button>
    <div class="week">${T.weekLabel(ui.ws)}</div>
    <button class="btn" onclick="moveWeek(1)">▶</button>
    <button class="btn" onclick="ui.ws=T.mondayOf(T.todayDay());render()">Oggi</button>
    ${typeSeg(ctx)}
    <div class="spacer"></div>

/** Sposta il riposo della settimana su questo giorno: se ha un solo riposo lo sostituisce, se ne ha più sostituisce quello più vicino. */
function moveRest(empId, day) {

  const old = cur.filter((x) => !next.includes(x));
  state.restWeek = state.restWeek || {}; state.restWeek[ws] = { ...(state.restWeek[ws] || {}), [empId]: [...new Set(next)] };

// --- generazione ---
/**
 * Controlli prima di generare: cosa manca perché i turni seguano i clienti (VLH, previsioni, ore totali)
 * e persone senza formazioni segnate. Restituisce il riquadro di avviso, oppure '' se è tutto a posto.
 */
function genChecks(ws = ui.ws) {
  const out = [], days = [0, 1, 2, 3, 4, 5, 6].map((k) => T.forecastDay((state.forecasts || {})[ws], k) || {});
  if (state.config.vlhGen !== false && !(state.vlh && state.vlh.giorni))
    out.push(`<b>Tabelle VLH non caricate</b>: le persone vengono messe solo in base ai minimi delle fasce, non in base ai clienti previsti ora per ora. Si caricano in <b>VLH</b>.`);
  if (!days.some((d) => d.gc > 0 || d.sales > 0))
    out.push(`<b>Nessuna previsione dei clienti</b> per questa settimana: si caricano in <b>Previsioni</b> (report SmartBusiness).`);
  if (!days.some((d) => d.crewHours > 0))
    out.push(`<b>Mancano le ore totali</b> della settimana: si usano solo le ore di contratto, uguali in ogni settimana. Si scrivono in <b>Previsioni</b>; dopo 2–3 settimane scritte l'app le calcola da sola.`);
  const active = state.employees.filter((e) => e.active !== false && (e.endDate == null || e.endDate >= ws) && (e.startDate == null || e.startDate <= ws + 6));
  const noTr = (type) => active.filter((e) => e.type === type && !(e.trainings || []).some((x) => T.STATIONS[x])).length;
  const tot = (type) => active.filter((e) => e.type === type).length;
  // crew: anche solo qualcuno senza formazioni (non può andare in nessuna postazione); hospitality: solo se mancano a tutte
  const tr = [['CREW', 'crew'], ['HOSPITALITY', 'hospitality']].filter(([t]) => noTr(t) && (t === 'CREW' || noTr(t) === tot(t)))
    .map(([t, l]) => (noTr(t) === tot(t) ? `<b>tutti i ${l}</b> (${tot(t)})` : `<b>${noTr(t)} ${l}</b> su ${tot(t)}`));
  if (tr.length) out.push(`Formazioni non segnate per ${tr.join(' e ')}: senza formazioni il generatore non sa in quali postazioni metterli. Si segnano in <b>Formazione</b>.`);
  return out.length ? `<div class="notice warn" style="margin-top:12px"><b>Prima di generare, controlla:</b><ul style="margin:6px 0 0 18px;padding:0">${out.map((x) => `<li style="margin-top:4px">${x}</li>`).join('')}</ul><span class="small" style="display:block;margin-top:6px">Puoi generare lo stesso: i turni rispettano le regole, ma possono essere meno precisi.</span></div>` : '';
}
function askGenerate() {
  const trained = (st) => state.employees.filter((e) => e.active && (e.openings || []).includes(st)).length;
  // nella settimana c'è almeno un giorno con l'apertura (non aperto 24 ore)?
  const opensSomeDay = [0, 1, 2, 3, 4, 5, 6].some((k) => !T.dayHours(state.config, ui.ws + k).h24);
  const missing = opensSomeDay ? OPENINGS_().filter((st) => !trained(st)).map((st) => T.STATIONS[st].label) : [];
  const warn = (missing.length
    ? `<div class="notice warn" style="margin-top:12px">Nessuno risulta formato per l'apertura ${missing.join(' né ')}: quelle aperture non potranno essere coperte. Segnalo nella sezione <b>Aperture e chiusure</b>.</div>` : '') + genChecks();
  showModal(`
    <h3>Genera turni · ${T.weekLabel(ui.ws)}</h3>
    <p><b>Completa</b>: tiene i turni già inseriti e aggiunge quelli che mancano.<br><b>Da zero</b>: cancella tutti i turni della settimana e li ricrea.</p>
    <p class="muted small">Il generatore rispetta riposi fissi, orari fissi, ferie, massimo giornaliero, stacchi 11h/36h e ore da contratto distribuite su tutti i giorni lavorativi. Mette i doppi solo a chi li fa (sezione Doppi), nei rush e preferibilmente nel weekend.</p>
    ${warn}
    ${(state.managers || []).some((m) => m.active !== false) ? `<label class="notice info" style="display:block;margin-top:12px;cursor:pointer"><input type="checkbox" id="g-mgr" checked> Genera anche i turni dei <b>manager</b>, prima di crew e hospitality
      <span class="small" style="display:block;margin-top:4px">${(state.mgrShifts || []).some((x) => x.day >= ui.ws && x.day <= ui.ws + 6) ? 'Questa settimana ci sono già turni manager: con <b>Completa</b> restano come sono, con <b>Da zero</b> vengono rifatti.' : 'Nelle ore intermedie del pomeriggio i manager in più coprono al posto dei crew, così le ore dei crew vanno sui rush di pranzo e cena.'}</span></label>` : ''}
    <div class="actions">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="startGenerate(true)">Da zero</button>

function startGenerate(fromScratch) {
  const box = document.getElementById('g-mgr'), withMgr = !!(box && box.checked);
  showModal('<h3>⚙ Sto generando i turni…</h3><p class="muted">Provo alcune varianti e tengo la migliore. Ci vuole qualche secondo.</p><p id="gen-prog" class="small"></p>');
  setTimeout(() => runGenerate(fromScratch, withMgr), 30);
}
/**
 * Pausa tra un tentativo e l'altro: la pagina torna libera (niente "Attendi" di Chrome) e si vede a che punto è.
 */
function genPause(txt) {
  const el = document.getElementById('gen-prog'); if (el) el.textContent = txt;
  return new Promise((ok) => setTimeout(ok, 0));
}
/**
 * Turni dei manager della settimana, prima di quelli di crew e hospitality (il generatore dei crew ne tiene conto).
 * Prova alcune varianti e tiene quella con meno errori. Con "Completa" i turni manager già presenti restano.
 * Restituisce { n, err, warn } oppure { kept: true } / null.
 */
async function genMgrForWeek(fromScratch) {
  const M = MGR(), ws = ui.ws;
  if (!M || !(state.managers || []).some((m) => m.active !== false)) return null;
  const inWeek = (x) => x.day >= ws && x.day <= ws + 6;
  if (!fromScratch && (state.mgrShifts || []).some(inWeek)) return { kept: true };
  const others = (state.mgrShifts || []).filter((x) => !inWeek(x)), base = { ...state, mgrShifts: others };
  ui.mgrGen = (ui.mgrGen || 0) + 1;
  let best = null;
  for (let k = 0; k < 4; k++) {
    await genPause(`Manager: variante ${k + 1} di 4…`);
    const r = M.generate(base, ws, { seed: ui.mgrGen * 4 + k });
    const err = r.problems.filter((p) => p.sev === 'ERROR').length, sc = err * 100 + r.problems.length;
    if (!best || sc < best.sc) best = { r, err, sc };
    if (!best.sc) break;
  }
  state.mgrShifts = others.concat(best.r.shifts.map((x) => ({ ...x, id: newId() })));
  return { n: best.r.shifts.length, err: best.err, warn: best.r.problems.length - best.err };
}
async function runGenerate(fromScratch, withMgr = false) {
  // 1. prima i manager, 2. poi crew e hospitality
  const mgr = withMgr ? await genMgrForWeek(fromScratch) : null;
  if (fromScratch) state.shifts = state.shifts.filter((s) => s.day < ui.ws || s.day > ui.ws + 6);
  // prova alcune varianti e tiene la migliore (meno errori, poi meno avvisi); ogni "Genera" dà varianti nuove
  ui.genCount = (ui.genCount || 0) + 1;
  let best = null;
  for (let k = 0; k < 4; k++) {
    await genPause(`Crew e hospitality: variante ${k + 1} di 4…`);
    const res = T.generate(T.makeCtx(state, ui.ws), { seed: ui.ws * 7919 + ui.genCount * 101 + k });
    const sc = scoreWeek(state.shifts.filter((s) => s.day >= ui.ws && s.day <= ui.ws + 6).concat(res.added));
    if (!best || sc.score < best.sc.score) best = { res, sc };
    if (sc.score === 0) break;
  }
  const res = best.res;
  res.added.forEach((s) => state.shifts.push({ ...s, id: newId() }));
  save(); render();
  const notes = best.sc.err ? res.notes : [];
  const mgrLine = !mgr ? '' : mgr.kept ? '<p><b>Manager</b>: turni già presenti, lasciati come sono.</p>'
    : `<p><b>Manager</b>: creati <b>${mgr.n}</b> turni · <b style="color:${mgr.err ? 'var(--err-ink)' : 'var(--green)'}">${mgr.err} errori</b> · ${mgr.warn} avvisi${mgr.err ? ' (li trovi nella vista Manager)' : ''}.</p>`;
  showModal(`<h3>Generazione completata</h3>${mgrLine}<p>${mgr ? '<b>Crew e hospitality</b>: aggiunti' : 'Aggiunti'} <b>${res.added.length}</b> turni · <b style="color:${best.sc.err ? 'var(--err-ink)' : 'var(--green)'}">${best.sc.err} errori</b> · ${best.sc.warn} avvisi.</p>
    ${notes.length ? `<ul>${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul><p class="small muted">Prova <b>🛠 Risolvi problemi</b>: cerca altre soluzioni e ti spiega cosa non si può sistemare.</p>` : '<p>✅ Tutte le coperture e le ore sono state assegnate.</p>'}
    <div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
}
// --- risoluzione automatica ---
/** Valuta un insieme di turni per la settimana: meno errori è meglio, poi meno avvisi. */
function scoreWeek(weekShifts) {
  const tmp = { ...state, shifts: state.shifts.filter((s) => s.day < ui.ws || s.day > ui.ws + 6).concat(weekShifts) };
  const vs = T.validate(T.makeCtx(tmp, ui.ws));
  const err = vs.filter((v) => v.sev === 'ERROR').length;
  return { vs, err, warn: vs.length - err, score: err * 1000 + (vs.length - err) };
}
/** Suggerimento su cosa fare quando un problema non si può risolvere da solo. */
function hintFor(v) {
  const m = v.msg;
  if (v.rule === 'COVERAGE' && /apertura/i.test(m)) {
    const st = /McCafé/.test(m) ? 'MCCAFE' : 'CUCINA';
    const n = state.employees.filter((e) => e.active && (e.openings || []).includes(st)).length;
    return n ? `Solo ${n} ${n === 1 ? 'persona è segnata' : 'persone sono segnate'} per l'apertura ${T.STATIONS[st].label}: quel giorno non sono disponibili (riposo, ferie o chiusura la sera prima). Segnane altre in Aperture e chiusure.`
      : `Nessuno è segnato per l'apertura ${T.STATIONS[st].label}: segnalo nella sezione Aperture e chiusure.`;
  }
  if (v.rule === 'COVERAGE' && /Hospitality/.test(m)) return 'Le hospitality disponibili quel giorno non bastano: controlla riposi e ferie, oppure abbassa il minimo in Regole.';
  if (v.rule === 'COVERAGE' && /Chiusura/.test(m)) return 'Mancano persone che possono chiudere quella postazione quel giorno: segnane altre nella sezione Aperture e chiusure (o in Formazione), oppure cambia il minimo in Regole.';
  if (v.rule === 'COVERAGE') {
    const crew = state.employees.filter((e) => e.active && e.type === 'CREW' && !e.fixedShift);
    const resting = v.day != null ? crew.filter((e) => T.isRest(e, v.day)) : [];
    const avgRest = crew.length ? DAYS7.reduce((t, k) => t + crew.filter((e) => e.restDays.includes(k + 1)).length, 0) / 4 : 0; // i riposi sono da lun a gio
    const fc = (state.forecasts || {})[T.mondayOf(v.day ?? ui.ws)];
    if (resting.length > avgRest + 1) return `Quel giorno sono a riposo ${resting.length} crew (${resting.map(T.fullName).slice(0, 8).join(', ')}${resting.length > 8 ? '…' : ''}): sposta qualche riposo su un altro giorno${fc ? ', oppure rivedi le Ore totali di quel giorno' : ''}.`;
    return `Non ci sono abbastanza persone libere in quella fascia${fc ? ' per le Ore totali di quel giorno' : ''}: ${fc ? 'rivedi le Ore totali, ' : ''}abbassa il minimo in Regole o sposta un riposo.`;
  }
  if (v.rule === 'WEEKLY_HOURS' || v.rule === 'WORK_DAYS') return 'Le ore non entrano nei giorni disponibili con le regole attuali (stacchi, massimo giornaliero).';
  if (v.rule === 'TRAINEE') return 'Serve un formato nella stessa postazione: segna altre persone in Formazione.';
  return 'Va sistemato a mano cliccando la casella.';
}
/** Pausa breve tra un tentativo e l'altro: il browser resta reattivo (niente "pagina che non risponde") e si vede l'avanzamento. */
async function solveTick(i, n) { const el = document.getElementById('solveprog'); if (el) el.textContent = `Variante ${i} di ${n}…`; await new Promise((r) => setTimeout(r, 0)); }
function solveWeek() {
  showModal('<h3>🛠 Sto cercando la soluzione migliore…</h3><p class="muted">Provo a sistemare la settimana mantenendo i tuoi turni e a rigenerarla da zero in più varianti. Ci vuole qualche secondo.</p><p class="small muted" id="solveprog"></p>');
  setTimeout(async () => {
    const ws = ui.ws, other = (s) => s.day < ws || s.day > ws + 6;
    const current = state.shifts.filter((s) => !other(s));
    const before = scoreWeek(current);
    const tries = [];
    // A) ripara la settimana attuale: tiene i turni, completa e sposta quelli che servono
    let step = 0; const steps = 11;
    for (const seed of [11, 12, 13]) {
      await solveTick(++step, steps);
      const ctx = T.makeCtx(state, ws);
      const r = T.generate(ctx, { seed: ws * 31 + seed, moveAll: true });
      tries.push({ how: 'Riparata mantenendo i tuoi turni (alcuni spostati di orario)', shifts: r.all.map((x) => ({ ...x })) });
    }
    // B) rigenera da zero in più varianti
    const empty = { ...state, shifts: state.shifts.filter(other) };
    for (let k = 1; k <= 8; k++) {
      await solveTick(++step, steps);
      const r = T.generate(T.makeCtx(empty, ws), { seed: ws * 7919 + 1000 + k + (ui.genCount || 0) * 17 });
      tries.push({ how: 'Rigenerata da zero', shifts: r.added.map((x) => ({ ...x })) });
    }
    let best = null;
    for (const t of tries) { t.res = scoreWeek(t.shifts); if (!best || t.res.score < best.res.score) best = t; await new Promise((r) => setTimeout(r, 0)); }
    ui.solution = best;
    const better = best.res.score < before.score;
    const left = best.res.vs.filter((v) => v.sev === 'ERROR');
    const changed = best.shifts.length;
    showModal(`
      <h3>🛠 Risolvi problemi · ${T.weekLabel(ws)}</h3>
      <p>Adesso: <b style="color:var(--err-ink)">${before.err} errori</b> · ${before.warn} avvisi<br>
      Soluzione migliore trovata: <b style="color:${best.res.err ? 'var(--err-ink)' : 'var(--green)'}">${best.res.err} errori</b> · ${best.res.warn} avvisi
      <span class="muted small">(${best.how}, ${changed} turni)</span></p>
      ${better ? '' : '<div class="notice warn">Non ho trovato niente di meglio della settimana attuale.</div>'}
      ${left.length ? `<p><b>Cosa resta e perché</b> (non si può sistemare da solo con le regole attuali):</p>
        <ul style="max-height:260px;overflow:auto;padding-left:18px">${left.map((v) => `<li style="margin-bottom:6px">${esc(v.msg)}<br><span class="small muted">→ ${esc(hintFor(v))}</span></li>`).join('')}</ul>` : '<p>✅ Tutti gli errori risolti.</p>'}
      <div class="actions">
        <button class="btn" onclick="closeModal()">Annulla</button>
        ${better ? '<button class="btn primary" onclick="applySolution()">Applica la soluzione</button>' : ''}
      </div>`);
  }, 30);
}
function applySolution() {
  const sol = ui.solution; if (!sol) return;
  const ws = ui.ws;
  state.shifts = state.shifts.filter((s) => s.day < ws || s.day > ws + 6).concat(sol.shifts.map((x) => ({ ...x, id: newId() })));
  ui.solution = null; save(); closeModal(); render();
}

/** Risolvi problemi dei manager: prova più varianti dei turni manager della settimana e propone la migliore. */
function solveMgrWeek() {
  showModal('<h3>🛠 Sto cercando la soluzione migliore…</h3><p class="muted">Provo a rifare i turni manager della settimana in più varianti. Ci vuole qualche secondo.</p><p class="small muted" id="solveprog"></p>');
  setTimeout(async () => {
    const M = MGR(), ws = ui.ws, inWeek = (x) => x.day >= ws && x.day <= ws + 6;
    const others = (state.mgrShifts || []).filter((x) => !inWeek(x)), base = { ...state, mgrShifts: others };
    const score = (probs) => { const err = probs.filter((p) => p.sev === 'ERROR').length; return { err, warn: probs.length - err, score: err * 100 + probs.length, probs }; };
    const before = score(M.check(state, ws));
    ui.mgrGen = (ui.mgrGen || 0) + 1;
    let best = null;
    for (let k = 0; k < 12; k++) {
      await solveTick(k + 1, 12);
      const r = M.generate(base, ws, { seed: ui.mgrGen * 101 + k });
      const sc = score(M.check({ ...base, mgrShifts: others.concat(r.shifts) }, ws, r.shifts));
      if (!best || sc.score < best.sc.score) best = { shifts: r.shifts, sc };
    }
    ui.mgrSolution = best;
    const better = best.sc.score < before.score, left = best.sc.probs.filter((p) => p.sev === 'ERROR');
    showModal(`
      <h3>🛠 Risolvi problemi manager · ${T.weekLabel(ws)}</h3>
      <p>Adesso: <b style="color:${before.err ? 'var(--err-ink)' : 'var(--green)'}">${before.err} errori</b> · ${before.warn} avvisi<br>
      Soluzione migliore trovata: <b style="color:${best.sc.err ? 'var(--err-ink)' : 'var(--green)'}">${best.sc.err} errori</b> · ${best.sc.warn} avvisi
      <span class="muted small">(turni manager rifatti, ${best.shifts.length} turni)</span></p>
      ${better ? '' : '<div class="notice warn">Non ho trovato niente di meglio della settimana attuale.</div>'}

        <ul style="max-height:260px;overflow:auto;padding-left:18px">${left.map((p) => `<li style="margin-bottom:6px">${esc(p.msg)}</li>`).join('')}</ul>` : '<p>✅ Nessun errore nella soluzione proposta.</p>'}
      <div class="actions">
        <button class="btn" onclick="closeModal()">Annulla</button>
        ${better ? '<button class="btn primary" onclick="applyMgrSolution()">Applica la soluzione</button>' : ''}
      </div>`);
  }, 30);
}

// ================= GIORNALIERO (lineare) =================
function openDaily(day) { ui.day = day; go('giornaliero'); }
function moveDay(n) { ui.day += n; render(); }
function renderGiornaliero() {
  const day = ui.day, cfg = state.config;
  const ctx = T.makeCtx(state, T.mondayOf(day));
  const dh = T.dayHours(cfg, day); // orario del locale di quel giorno (anche 24h)
  const H0 = Math.max(0, Math.floor((dh.open - 30) / 60)), H1 = Math.min(31, Math.ceil((dh.close + 60) / 60));
  const hours = []; for (let h = H0; h < H1; h++) hours.push(h);
  const span = (H1 - H0) * 60, pct = (m) => (((m - H0 * 60) / span) * 100).toFixed(3) + '%';
  const hw = `calc(100% / ${hours.length})`;
  // griglia disegnata linea per linea nella posizione esatta (un motivo ripetuto si sposta di frazioni di pixel):
  // linea marcata a ogni ora, linee chiare ogni 15 minuti (4 quadratini per ora)
  const gx = (m) => (((m - H0 * 60) / span) * 100).toFixed(4);

  // in stampa la stessa griglia tutta nera (ore più spesse), così si vede bene sul foglio
  let glp = '';
  for (let m = H0 * 60; m <= H1 * 60; m += 15) glp += `<line x1='${gx(m)}%25' x2='${gx(m)}%25' y1='0' y2='100%25' stroke='%23000000' stroke-width='${m % 60 ? 1 : 2}'/>`;
  const grid = `background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100%25' height='100%25'>${gl}</svg>&quot;);background-size:100% 100%;background-repeat:no-repeat;--gridp:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100%25' height='100%25'>${glp}</svg>&quot;)`;
  const day_ = ctx.shifts.filter((s) => s.day === day && ctx.byId.has(s.employeeId));
  const typeOf = (s) => ctx.byId.get(s.employeeId).type;
  const sections = [
    ['Hospitality', day_.filter((s) => !s.doppio && typeOf(s) === 'HOSPITALITY')],
    ['Crew', day_.filter((s) => !s.doppio && typeOf(s) === 'CREW')],

  const AREAS = [...T.CREW_STATIONS.map((st) => [st, T.STATIONS[st].label]), ['HOSPITALITY', 'Hospitality']];
  const shown = byArea ? AREAS.map(([st, t]) => [t, day_.filter((s) => s.station === st), st]) : sections;
  const vs = T.validate(ctx).filter((v) => v.day === day && v.rule !== 'VLH');
  const bad = new Set(vs.filter((v) => v.emp != null).map((v) => v.emp));
  const row = (s) => {
    const e = ctx.byId.get(s.employeeId);
    const lim = T.limitOf(ctx, e.id, day);
    const tip = `${T.fullName(e)} · ${T.fmtTime(s.start)}–${T.fmtTime(s.end)} · ${T.STATIONS[s.station].label}${s.doppio ? ' · doppio' : ''}${s.aff ? ' · affiancamento (formazione)' : ''}${lim ? ` · richiesta accettata: ${lim.label}` : ''}`;
    return `<div class="lrow ${editing ? '' : 'click'}" ${editing ? `data-rsid="${s.id}"` : `onclick="openDay(${e.id},${day})"`} title="${esc(tip)}">

      <div class="ltime" data-t="a">${T.fmtTime(s.start)}</div><div class="ltime" data-t="b">${T.fmtTime(s.end)}</div>
      <div class="ltrack" style="${grid}"><div class="lbar st-${s.station}${editing ? ' drag' : ''}" ${editing ? `data-sid="${s.id}" onpointerdown="dragStart(event)"` : ''} style="left:${pct(s.start)};width:${(((s.end - s.start) / span) * 100).toFixed(3)}%"><span class="lbl">${T.STATIONS[s.station].short}</span>${editing ? '<span class="hl"></span><span class="hr"></span>' : ''}</div></div>
    </div>`;
  };
  const head = `<div class="lrow lhead"><div class="lpos">Post.</div><div class="lname">Nome</div><div class="ltime">Dalle</div><div class="ltime">Alle</div>
    <div class="ltrack" style="${grid};background-color:var(--surface-2)">${hours.map((h) => `<span class="${h % 2 ? 'odd' : ''}" style="left:${pct(h * 60)}">${h % 24}</span>`).join('')}</div></div>`;
  ui.dragGeo = { H0, span };
  // manager (calendario a parte): sempre in cima

  };
  // clienti previsti per ora (profilo orario del locale) e quanti in più/meno per l'evento
  const fd = T.forecastDay((state.forecasts || {})[T.mondayOf(day)], T.dow(day) - 1), iso = T.toIso(day);

// ================= VLH (posizionamento del turno) =================
const VLH = () => window.TurniVLH;
const VLH_SHEETS_STD = [[8, 9, 10, 11, 12, 13, 14, 15], [15, 16, 17, 18, 19, 20, 21, 22]];
/**
 * Fogli VLH del giorno (ore per foglio): di solito pranzo 8–15 e cena 15–22; se il locale apre prima delle 7:00
 * o chiude dopo le 22:30 (o è aperto 24 ore) le ore si allargano e si dividono in fogli da 8 ore.
 */
function vlhSheetsFor(day) {
  const h = T.dayHours(state.config, day);
  const a = h.h24 ? 0 : h.open <= 420 ? Math.floor(h.open / 60) : 8, b = h.h24 ? 23 : h.close > 1350 ? Math.min(29, Math.ceil(h.close / 60) - 1) : 22;
  if (a === 8 && b === 22) return VLH_SHEETS_STD;
  const out = []; for (let x = a; x <= b; x += 8) out.push(Array.from({ length: Math.min(8, b - x + 1) }, (_, i) => x + i));
  return out;
}
/** Foglio mostrato: 0 pranzo, 1 cena, 2 tutte e due. All'inizio: oggi dopo le 15 la cena, altrimenti il pranzo. */
const vlhSheet = () => { const n = vlhSheetsFor(ui.day).length; return Math.min(ui.vlhSheet ?? (ui.day === T.todayDay() && new Date().getHours() >= 15 ? 1 : 0), n); };

function vlhGC(day, h) { return T.vlhHourGC(state, day, h); }
function setVlhGC(day, h, v) {
  const iso = T.toIso(day); state.vlhGC = state.vlhGC || {};
  const o = state.vlhGC[iso] = state.vlhGC[iso] || {};
  const n = parseInt(String(v).trim(), 10);
  if (String(v).trim() === '' || isNaN(n)) delete o[h]; else o[h] = Math.max(0, n);
  if (!Object.keys(o).length) delete state.vlhGC[iso];
  save(); render();
}
function clearVlhGC(day) { if (state.vlhGC) delete state.vlhGC[T.toIso(day)]; save(); render(); }
/** Spostamenti dei nomi fatti a mano: state.vlhNomi[iso][ora] = { codice: id persona, oppure 0 = vuota }. */
const vlhFixed = (day, h) => ((state.vlhNomi || {})[T.toIso(day)] || {})[h] || {};
function setVlhFixed(day, h, changes) {
  const iso = T.toIso(day); state.vlhNomi = state.vlhNomi || {};

/**
 * Tabelle VLH: si caricano i file VLH aziendali (uno per giorno: LUN.xlsm … DOM.xlsm, foglio "Custom VLH Tables Format B").
 * Si possono caricare anche solo alcuni giorni: gli altri restano come erano. Va bene anche il vecchio file .json.

async function importVlh(input) {
  const files = [...(input.files || [])]; if (!files.length) return;
  if (files.length === 1 && /\.json$/i.test(files[0].name)) {
    try { const d = JSON.parse(await files[0].text()); if (!d.giorni) throw new Error('formato'); state.vlh = d; save(); render(); }

  showModal(`<h3>Leggo le tabelle VLH…</h3><p class="muted" id="vlh-prog">File 1 di ${files.length}</p>`);
  const lette = [], errori = [];

    try {
      const sh = await ImportaPersonale.leggiFile(await f.arrayBuffer(), (n) => /vlh tables format b|^vlh customization$/i.test(n.trim()));

function toggleSel(id) { ui.selected.has(id) ? ui.selected.delete(id) : ui.selected.add(id); render(); }
function askDelete() {
  const names = [...state.employees.filter((e) => ui.selected.has(e.id)).map(T.fullName), ...(state.managers || []).filter((m) => ui.selected.has('m' + m.id)).map((m) => (T.fullName(m) || 'Nuovo manager') + ' (manager)')];

}
function deleteSelected() {
  const ids = ui.selected;
  state.employees = state.employees.filter((e) => !ids.has(e.id));
  state.shifts = state.shifts.filter((s) => !ids.has(s.employeeId));
  state.absences = state.absences.filter((a) => !ids.has(a.employeeId));
  // manager selezionati: via anche i loro turni, le assenze e l'accesso all'app
  const mids = new Set((state.managers || []).filter((m) => ids.has('m' + m.id)).map((m) => m.id));
  if (mids.size) {
    state.managers = state.managers.filter((m) => !mids.has(m.id));
    state.mgrShifts = (state.mgrShifts || []).filter((x) => !mids.has(x.managerId));
    state.absences = state.absences.filter((a) => !mids.has(a.employeeId)); // le assenze dei manager usano lo stesso campo
  }
  ui.selected = new Set(); ui.deleteMode = false;
  save(); closeModal(); render();
}

        <div id="f-fixed-times" class="row" style="display:${e.fixedShift ? 'flex' : 'none'};gap:8px;align-items:center">

        </div>
        <div class="small muted">Lavora sempre e solo in quest'orario, in tutti i giorni che non sono di riposo. Le ore settimanali si calcolano da sole.</div>
      </div>

function saveEmployee(id) {
  const last = document.getElementById('f-last').value.trim();
  const minutes = T.parseHours(document.getElementById('f-hours').value);
  const err = document.getElementById('f-error');
  if (!last || minutes == null || minutes < 0 || minutes > 3600) { err.style.display = 'block'; err.textContent = 'Inserisci almeno il cognome e un numero di ore valido (es. 18 o 18,5).'; return; }
  const data = {
    lastName: last, firstName: document.getElementById('f-first').value.trim(),
    type: document.getElementById('f-type').value, weeklyMinutes: minutes,
    restDays: [...document.querySelectorAll('.f-rest:checked')].map((x) => +x.value),
    active: document.getElementById('f-active').checked,
    fixedShift: null,
    startDate: document.getElementById('f-start').value ? T.toDay(document.getElementById('f-start').value) : null,
    endDate: document.getElementById('f-end').value ? T.toDay(document.getElementById('f-end').value) : null,
  };
  if (data.startDate != null && data.endDate != null && data.endDate < data.startDate) { err.style.display = 'block'; err.textContent = 'L\'ultimo giorno di lavoro viene prima della data di inizio.'; return; }
  if (document.getElementById('f-fixed').checked) {
    const fs = +document.getElementById('f-fstart').value, fe = +document.getElementById('f-fend').value;
    if (fe <= fs) { err.style.display = 'block'; err.textContent = "L'orario fisso deve finire dopo l'inizio."; return; }
    data.fixedShift = { start: fs, end: fe };
  }
  if (id) { Object.assign(empById(id), data); delete empById(id).daControllare; }
  else state.employees.push({ id: newId(), trainings: [], doubleDays: 0, ...data });
  save(); closeModal(); render();
  // turni già messi dopo l'ultimo giorno di lavoro: si possono togliere subito
  const after = id && data.endDate != null ? state.shifts.filter((s) => s.employeeId === id && s.day > data.endDate) : [];
  if (after.length && confirm(`${T.fullName(empById(id))} ha ancora ${after.length} turni dopo il ${T.itDate(data.endDate)}. Li tolgo? (poi rigenera o completa quelle settimane)`)) {
    state.shifts = state.shifts.filter((s) => !after.includes(s)); save(); render();
  }
}

    <p id="a-err" class="notice err" style="display:none"></p>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveAff(${id ? `'${id}'` : 'null'})">Salva</button></div>`);
}
function saveAff(id) {
  const [tipo, station] = document.getElementById('a-tipo').value.split('|');
  const empId = +document.getElementById('a-emp').value, e = empById(empId);
  const volte = Math.round(+document.getElementById('a-volte').value), per = Math.round(+document.getElementById('a-sett').value);
  const dur = Math.round(+document.getElementById('a-dur').value * 60), daV = document.getElementById('a-da').value;
  const err = (m) => { const x = document.getElementById('a-err'); x.style.display = 'block'; x.textContent = m; };
  if (!e) return err('Scegli la persona.');
  if (!(volte >= 1) || !(per >= 1)) return err('Indica quante volte in tutto e quante al massimo a settimana.');
  if (!(e.trainings || []).includes(station)) return err(`${T.fullName(e)} non è segnato/a come formato/a in ${T.STATIONS[station].label}: segnalo prima nella tabella qui sopra.`);
  const data = { empId, tipo, station, volte, perSettimana: Math.min(per, volte), durata: dur || 240, da: daV ? T.toDay(daV) : null,
    giorni: [...document.querySelectorAll('.a-g:checked')].map((x) => +x.value) };
  state.formazioni = state.formazioni || [];
  const old = state.formazioni.find((x) => x.id === id);
  if (old) Object.assign(old, data); else state.formazioni.push({ id: 'aff' + newId(), fine: null, ...data });
  save(); closeModal(); render();
}
function affAutonomo(id) {
  const p = (state.formazioni || []).find((x) => x.id === id), e = p && empById(p.empId);
  if (!p) return;
  p.fine = T.todayDay();
  if (e) { const k = p.tipo === 'CHIUSURA' ? 'closings' : 'openings'; e[k] = [...new Set([...(e[k] || []), p.station])]; }
  save(); render();
}
function deleteAff(id) {
  state.formazioni = (state.formazioni || []).filter((x) => x.id !== id);
  // i turni già messi restano, ma non sono più affiancamenti
  for (const x of state.shifts) if (x.aff === id) delete x.aff;
  save(); render();
}
function toggleTraining(id, st) {
  const e = empById(id);
  e.trainings = e.trainings.includes(st) ? e.trainings.filter((s) => s !== st) : [...e.trainings, st];
  save(); render();
}

// postazioni con apertura / chiusura: dalle fasce di copertura del locale (Regole), non più fisse
const stationsOf = (flag) => [...new Set(state.coverage.filter((r) => r[flag] && r.station && r.station !== 'HOSPITALITY').map((r) => r.station))].filter((st) => T.STATIONS[st]);
const OPENINGS_ = () => stationsOf('opening'), CLOSINGS_ = () => stationsOf('closing');
function renderAperture() {
  const people = state.employees.filter((e) => e.active);
  const has = (e, key, st) => (e[key] || []).includes(st);
  const markedClose = (st) => people.some((e) => has(e, 'closings', st));
  const cnt = (key, st) => people.filter((e) => has(e, key, st)).length;
  const pills = OPENINGS_().map((st) => `<span class="pill on">Apertura ${T.STATIONS[st].label}: ${cnt('openings', st)}</span>`).join('') +
    CLOSINGS_().map((st) => `<span class="pill ${markedClose(st) ? 'on' : ''}" title="${markedClose(st) ? '' : 'Nessuno segnato: chiudono tutti i formati in questa postazione'}">Chiusura ${T.STATIONS[st].short === 'SALA' ? 'Sala' : T.STATIONS[st].label}: ${cnt('closings', st) || 'tutti i formati'}</span>`).join('');
  const box = (e, key, st) => `<td style="text-align:center"><input type="checkbox" style="width:18px;height:18px;cursor:pointer" ${has(e, key, st) ? 'checked' : ''} onchange="toggleQual(${e.id},'${key}','${st}')"></td>`;
  const rows = ['HOSPITALITY', 'CREW'].map((type) => {
