    const e = empById(p.empId), done = T.affDone(state, p, today);
    const planned = state.shifts.filter((x) => x.aff === p.id && x.day >= today).map((x) => x.day).sort((a, b) => a - b);
    const stato = p.fine != null ? `<span class="pill on">✅ autonomo/a dal ${T.itDate(p.fine)}</span>`
      : `${done} fatti su ${p.volte}${planned.length ? `<div class="small muted">programmati: ${planned.map((d) => T.shortDate(d)).join(', ')}</div>` : ''}`;
    return `<tr><td><b>${e ? esc(T.fullName(e)) : '<span class="muted">persona eliminata</span>'}</b></td><td>${cap(T.affLabel(p))}</td>
      <td>${stato}</td><td style="text-align:center">${p.perSettimana}</td><td>${giorni(p)}</td><td>${p.da != null ? T.itDate(p.da) : '—'}</td>
      <td style="white-space:nowrap"><button class="btn" onclick="editAff('${p.id}')" title="Modifica">✏️</button>
        ${p.fine == null ? `<button class="btn" onclick="affAutonomo('${p.id}')" title="Segna autonomo/a da oggi">✅</button>` : ''}
        <button class="btn" onclick="deleteAff('${p.id}')" title="Elimina il piano">🗑</button></td></tr>`;
  }).join('');
  return `<h3 style="margin-top:22px">Affiancamenti in apertura e chiusura ${ib('affiancamenti')}</h3>
  <div class="card">${plans.length ? `<table class="list"><thead><tr><th>Persona</th><th>Affiancamento</th><th>Avanzamento</th><th>Max a settimana</th><th>Giorni</th><th>Dal</th><th></th></tr></thead><tbody>${rows}</tbody></table>`

    <button class="btn primary" onclick="editAff(null)" style="margin-top:8px">+ Programma un affiancamento</button></div>`;
}
function editAff(id) {
  const p = (state.formazioni || []).find((x) => x.id === id) || { tipo: 'APERTURA', station: 'MCCAFE', volte: 4, perSettimana: 3, giorni: [], durata: 240, da: T.mondayOf(T.todayDay()) + 7 };
  const people = sortByName(state.employees.filter((e) => e.active));
  const tipi = T.AFF_TIPI.filter(([, st]) => T.CREW_STATIONS.includes(st));
  showModal(`<h3>${id ? 'Modifica' : 'Programma'} un affiancamento</h3>
    <label>Persona<br><select id="a-emp">${people.map((e) => `<option value="${e.id}" ${e.id === p.empId ? 'selected' : ''}>${esc(T.fullName(e))}</option>`).join('')}</select></label>
    <label style="display:block;margin-top:8px">Affiancamento<br><select id="a-tipo">${tipi.map(([t, st]) => `<option value="${t}|${st}" ${t === p.tipo && st === p.station ? 'selected' : ''}>${cap(T.affLabel({ tipo: t, station: st }))}</option>`).join('')}</select></label>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <label>Volte in tutto<br><input id="a-volte" type="number" min="1" max="30" value="${p.volte}" style="width:80px"></label>
      <label>Max a settimana<br><input id="a-sett" type="number" min="1" max="7" value="${p.perSettimana}" style="width:80px"></label>
      <label>Durata del turno (ore)<br><input id="a-dur" type="number" min="2" max="8" step="0.5" value="${(p.durata || 240) / 60}" style="width:80px"></label>
      <label>Dal<br><input id="a-da" type="date" value="${p.da != null ? T.toIso(p.da) : ''}"></label>
    </div>
    <div style="margin-top:8px">Giorni preferiti <span class="small muted">(nessuno = qualsiasi giorno)</span><br>
      ${[1, 2, 3, 4, 5, 6, 7].map((g) => `<label style="margin-right:8px"><input type="checkbox" class="a-g" value="${g}" ${(p.giorni || []).includes(g) ? 'checked' : ''}> ${T.DOW_SHORT[g]}</label>`).join('')}</div>
    <p id="a-err" class="notice err" style="display:none"></p>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="saveAff(${id ? `'${id}'` : 'null'})">Salva</button></div>`);
}
function saveAff(id) {
  const [tipo, station] = document.getElementById('a-tipo').value.split('|');
  const empId = +document.getElementById('a-emp').value, e = empById(empId);
  const volte = Math.round(+document.getElementById('a-volte').value), per = Math.round(+document.getElementById('a-sett').value);
  const dur = Math.round(+document.getElementById('a-dur').value * 60), daV = document.getElementById('a-da').value;
  const err = (m) => { const x = document.getElementById('a-err'); x.style.display = 'block'; x.textContent = m; };
  if (!e) return err('Scegli la persona.');
  if (!(volte >= 1) || !(per >= 1)) return err('Indica quante volte in tutto e quante al massimo a settimana.');
  if (!(e.trainings || []).includes(station)) return err(`${T.fullName(e)} non è segnato/a come formato/a in ${T.STATIONS[station].label}: segnalo prima nella tabella qui sopra.`);
  const data = { empId, tipo, station, volte, perSettimana: Math.min(per, volte), durata: dur || 240, da: daV ? T.toDay(daV) : null,
    giorni: [...document.querySelectorAll('.a-g:checked')].map((x) => +x.value) };
  state.formazioni = state.formazioni || [];
  const old = state.formazioni.find((x) => x.id === id);
  if (old) Object.assign(old, data); else state.formazioni.push({ id: 'aff' + newId(), fine: null, ...data });
  save(); closeModal(); render();
}
function affAutonomo(id) {
  const p = (state.formazioni || []).find((x) => x.id === id), e = p && empById(p.empId);
  if (!p) return;
  p.fine = T.todayDay();
  if (e) { const k = p.tipo === 'CHIUSURA' ? 'closings' : 'openings'; e[k] = [...new Set([...(e[k] || []), p.station])]; }
  save(); render();
}
function deleteAff(id) {
  state.formazioni = (state.formazioni || []).filter((x) => x.id !== id);
  // i turni già messi restano, ma non sono più affiancamenti
  for (const x of state.shifts) if (x.aff === id) delete x.aff;
  save(); render();
}
function toggleTraining(id, st) {
  const e = empById(id);
  e.trainings = e.trainings.includes(st) ? e.trainings.filter((s) => s !== st) : [...e.trainings, st];
  save(); render();
}

// ================= APERTURE =================
// postazioni con apertura / chiusura: dalle fasce di copertura del locale (Regole), non più fisse
const stationsOf = (flag) => [...new Set(state.coverage.filter((r) => r[flag] && r.station && r.station !== 'HOSPITALITY').map((r) => r.station))].filter((st) => T.STATIONS[st]);
const OPENINGS_ = () => stationsOf('opening'), CLOSINGS_ = () => stationsOf('closing');
function renderAperture() {
  const people = state.employees.filter((e) => e.active);
  const has = (e, key, st) => (e[key] || []).includes(st);
  const markedClose = (st) => people.some((e) => has(e, 'closings', st));
  const cnt = (key, st) => people.filter((e) => has(e, key, st)).length;
  const pills = OPENINGS_().map((st) => `<span class="pill on">Apertura ${T.STATIONS[st].label}: ${cnt('openings', st)}</span>`).join('') +
    CLOSINGS_().map((st) => `<span class="pill ${markedClose(st) ? 'on' : ''}" title="${markedClose(st) ? '' : 'Nessuno segnato: chiudono tutti i formati in questa postazione'}">Chiusura ${T.STATIONS[st].short === 'SALA' ? 'Sala' : T.STATIONS[st].label}: ${cnt('closings', st) || 'tutti i formati'}</span>`).join('');
  const box = (e, key, st) => `<td style="text-align:center"><input type="checkbox" style="width:18px;height:18px;cursor:pointer" ${has(e, key, st) ? 'checked' : ''} onchange="toggleQual(${e.id},'${key}','${st}')"></td>`;
  const rows = ['HOSPITALITY', 'CREW'].map((type) => {
    const list = sortByName(people.filter((e) => e.type === type));
    if (!list.length) return '';
    return `<tr class="group"><td colspan="6">${T.TYPES[type]} (${list.length})</td></tr>` + list.map((e) => `<tr><td><b>${esc(T.fullName(e))}</b>${e.fixedShift ? ' <span class="small muted">(orario fisso)</span>' : ''}${e.trainee ? ' 🎓' : ''}</td>
      ${OPENINGS_().map((st) => (e.type === 'HOSPITALITY' ? '<td style="text-align:center" class="small muted" title="In apertura ci sono solo i crew della squadra di apertura">—</td>' : box(e, 'openings', st))).join('')}
      ${CLOSINGS_().map((st) => box(e, 'closings', st)).join('')}</tr>`).join('');
  }).join('');
  return `
  <h2>Aperture e chiusure ${ib('aperture')}</h2>
  <div class="notice info" style="margin-bottom:10px">Per le <b>chiusure</b>: finché per una postazione non segni nessuno, possono chiudere tutti quelli formati in quella postazione (sezione Formazione). Appena ne segni almeno uno, chiudono solo quelli segnati.${state.config.hospSala !== false ? ' La <b>Sala</b> la possono chiudere sia crew sia hospitality: se non segni nessuno, possono chiuderla tutti i crew formati in Sala e tutte le hospitality.' : ''}<br>
  In <b>apertura</b> c'è solo la squadra di apertura impostata in Regole → Fasce di copertura.</div>
  <p>${pills}</p>
  <div class="card"><table class="list"><thead><tr><th>Nome</th>${OPENINGS_().map((st) => `<th style="text-align:center">Apertura<br>${T.STATIONS[st].label}</th>`).join('')}${CLOSINGS_().map((st) => `<th style="text-align:center">Chiusura<br>${st === 'SERVIZIO' ? 'Sala' : T.STATIONS[st].label}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function toggleQual(id, key, st) {
  const e = empById(id), o = e[key] || [];
  e[key] = o.includes(st) ? o.filter((x) => x !== st) : [...o, st];
  save(); render();
}
function toggleOpening(id, st) { toggleQual(id, 'openings', st); }

function renderDoppi() {

  <div class="card"><table class="list"><thead><tr><th>Dipendente</th><th>Ruolo</th><th>Giorni di doppio a settimana</th><th>Ore massime per doppio</th></tr></thead><tbody>
    ${list.map((e) => `<tr><td><b>${esc(T.fullName(e))}</b></td><td>${T.TYPES[e.type]}</td>

}

// ================= STORE: impostazioni del locale (orari, postazioni, regole) =================
// Tutto ciò che cambia da un locale all'altro sta in state.config (cifrato insieme ai dati del locale):
// un locale nuovo imposta qui le sue regole senza toccare il motore dei turni.
const DAY_TIMES = []; for (let m = 0; m <= 1440; m += 15) DAY_TIMES.push(m);
const dayTimeSel = (v, on) => `<select onchange="${on}">${DAY_TIMES.map((t) => `<option value="${t}" ${t === v ? 'selected' : ''}>${t === 1440 ? '24:00' : T.fmtTime(t)}</option>`).join('')}</select>`;
const MGR_DEF = { short: [180, 300], long: [360, 510], breakFrom: 360, breakMin: 30, rest: 720, rest36: 2160, orderBy: 690, restDays: [1, 2, 3, 4], minPerDay: 2 };
function storeStations() { if (!Array.isArray(state.config.stations) || !state.config.stations.length) state.config.stations = T.DEFAULT_STATIONS.map((x) => ({ ...x })); return state.config.stations; }
function setHour(d, k, v) {
  const c = state.config; c.hours = c.hours || {};
  const h = c.hours[d] = { open: c.open ?? 450, close: c.close ?? 1290, ...(c.hours[d] || {}), [k]: v };
  if (!h.h24 && h.close <= h.open) { alert("La chiusura deve essere dopo l'apertura."); render(); return; }
  // orario "generale" (testi, richieste): quello del lunedì
  if (d === 1 && !h.h24) { c.open = h.open; c.close = h.close; }
  save(); render();
}
function setStation(i, k, v) {
  const l = storeStations(), x = l[i];
  if (k === 'active' && !v && state.coverage.some((r) => r.station === x.id && (r.min || []).some((n) => n > 0))) {
    if (!confirm(`Ci sono fasce di copertura per ${x.label} (Regole). Spegnendo la postazione non verranno più coperte. Continuare?`)) { render(); return; }
  }
  x[k] = v; save(); render();
}
function addStation() {
  const name = (prompt('Nome della nuova postazione (es. Drive 2, Kiosk, Pulizie):') || '').trim();
  if (!name) return;
  const id = 'P' + newId();
  storeStations().push({ id, label: name, short: name.slice(0, 4).toUpperCase(), color: '#5b8c5a', active: true, custom: true });
  save(); render();
}
function delStation(i) {
  const l = storeStations(), x = l[i];
  const used = state.employees.some((e) => (e.trainings || []).includes(x.id)) || state.shifts.some((s) => s.station === x.id) || state.coverage.some((r) => r.station === x.id);
  if (used) return alert(`${x.label} è già usata (formazione, turni o fasce): puoi spegnerla, non eliminarla.`);
  if (!confirm(`Eliminare la postazione ${x.label}?`)) return;
  l.splice(i, 1); save(); render();
}
function setRule(k, v) { state.config[k] = v; save(); render(); }
function setMgrRule(k, v) { state.config.mgr = { ...MGR_DEF, ...(state.config.mgr || {}), [k]: v }; save(); render(); }
function setMgrPair(k, i, txt) {
  const v = T.parseHours(txt); if (v == null) return alert('Scrivi un numero di ore, es. 3 o 6:30.');
  const g = { ...MGR_DEF, ...(state.config.mgr || {}) }, p = [...g[k]]; p[i] = v;
  if (p[0] > p[1]) return alert('Il minimo deve essere minore del massimo.');
  setMgrRule(k, p);
}

// --- dati cifrati sul sito ---
function askEncryptedExport() {
  if (!TurniCripto.supported()) return alert('Questo browser non supporta la cifratura: usa Safari o Chrome aggiornati.');
  showModal(`<h3>🔒 Crea file cifrato per il sito</h3>
    <p class="muted">Scegli una password: servirà per aprire i dati sul sito. Non viene salvata da nessuna parte: se la perdi, va creato un nuovo file.</p>
    <div class="form"><label class="f">Password<input type="password" id="pw1" autocomplete="new-password"></label>
    <label class="f">Ripeti la password<input type="password" id="pw2" autocomplete="new-password"></label>
    <div id="pw-err" class="notice err" style="display:none"></div></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="doEncryptedExport()">Crea file</button></div>`);
}
async function doEncryptedExport() {
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value, err = document.getElementById('pw-err');
  if (a.length < 8) { err.style.display = 'block'; err.textContent = 'Usa almeno 8 caratteri.'; return; }
  if (a !== b) { err.style.display = 'block'; err.textContent = 'Le due password non coincidono.'; return; }
  const box = await TurniCripto.encrypt({ state, exportedAt: new Date().toISOString() }, a);
  const blob = new Blob([JSON.stringify(box)], { type: 'application/json' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'dati-cifrati.json';
  document.body.appendChild(link); link.click(); link.remove();
  showModal(`<h3>✅ File creato</h3><p>È stato scaricato <b>dati-cifrati.json</b> con ${state.employees.length} dipendenti e ${state.shifts.length} turni, cifrato con la tua password.</p>
    <p class="muted">Ora va pubblicato sul sito. Ricordati la password: senza, i dati non si possono aprire.</p><div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
}
/** Sul sito: se esiste dati-cifrati.json chiede la password e carica i dati. force = anche se ci sono già dati. */
async function loadFromSite(force) {
  if (!location.protocol.startsWith('http')) return;
  if (!force && state.employees.length) return;
  let box;
  try { const r = await fetch('dati-cifrati.json', { cache: 'no-store' }); if (!r.ok) { if (force) alert('Sul sito non ci sono dati pubblicati.'); return; } box = await r.json(); } catch (e) { return; }
  ui.siteBox = box;
  showModal(`<h3>🔒 Dati del locale</h3>
    <p>Sul sito ci sono i dati del locale (aggiornati al ${box.createdAt ? new Date(box.createdAt).toLocaleDateString('it-IT') : '—'}), protetti da password.</p>
    ${force && state.employees.length ? '<div class="notice warn">I dati di questo browser verranno sostituiti.</div>' : ''}
    <div class="form"><label class="f">Password<input type="password" id="pw-open" autocomplete="current-password" onkeydown="if(event.key==='Enter')openSiteData()"></label>
    <div id="pw-err" class="notice err" style="display:none"></div></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Non ora</button><button class="btn primary" onclick="openSiteData()">Apri</button></div>`);
  setTimeout(() => { const i = document.getElementById('pw-open'); if (i) i.focus(); }, 50);
}
async function openSiteData() {
  const pw = document.getElementById('pw-open').value, err = document.getElementById('pw-err');
  try {
    const data = await TurniCripto.decrypt(ui.siteBox, pw);
    state = TurniData.migrate(data.state || data); save(); closeModal(); go('turni');
  } catch (e) { err.style.display = 'block'; err.textContent = e.message === 'Password sbagliata' ? 'Password sbagliata, riprova.' : e.message; }
}

// ================= SALVATAGGIO ONLINE =================
const sync = { status: 'off', msg: '', timer: null, busy: false, seq: 0, pendingRender: false };
const modalOpen = () => !!document.getElementById('modal').innerHTML;
const fmtWhen = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) + ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); };
function setSync(status, msg) { sync.status = status; sync.msg = msg || ''; renderSync(); }
// codice del locale per tornare all'app dei dipendenti (anche dall'app installata, dove non c'è il tasto "indietro")
const storeCode = () => APP_STORE || TurniCloud.uid() || (() => { try { return localStorage.getItem('turni-locale'); } catch (e) { return null; } })();
function renderSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const back = APP_MODE && storeCode() ? `<button onclick="location.href='richieste.html?s=' + encodeURIComponent(storeCode())" title="Torna all'app dei dipendenti">← Dipendenti</button>` : '';
  if (!TurniCloud.loggedIn()) { el.innerHTML = back; return; }
  const t = TurniCloud.PROVA ? '🧪 Prova: non si salva online' : { ok: '☁️ Salvato online', saving: '⏳ Salvataggio…', offline: '⚠️ Offline: salvo appena torna la rete', error: '⚠️ Non salvato online', conflict: '⚠️ Scegli quali dati tenere' }[sync.status] || '☁️ Online';
  el.innerHTML = `${back}<button class="${/offline|error|conflict/.test(sync.status) ? 'bad' : ''}" onclick="go('regole')" title="${esc(sync.msg || 'Salvataggio online')}">${t}</button><button onclick="cloudLogout()" title="Esci dall'area manager su questo dispositivo">Esci</button>`;
}
function cloudTouch() {
  if (!TurniCloud.loggedIn()) return;
  sync.seq++; TurniCloud.setDirty(true); setSync('saving');
  clearTimeout(sync.timer); sync.timer = setTimeout(() => cloudPush(), 1500);
}
/** Invia i dati online. base: vedi TurniCloud.push (undefined = ultima versione nota). */
async function cloudPush(base) {
  if (!TurniCloud.loggedIn()) return;
  clearTimeout(sync.timer);
  if (sync.busy) { sync.timer = setTimeout(() => cloudPush(base), 800); return; }
  if (base === undefined && !TurniCloud.session().dirty) { setSync('ok'); return; }
  sync.busy = true; const seq = sync.seq; setSync('saving');
  try {
    await TurniCloud.push(state, base);
    if (seq === sync.seq) { TurniCloud.setDirty(false); setSync('ok'); }
    else sync.timer = setTimeout(() => cloudPush(), 800); // altre modifiche nel frattempo
  } catch (e) { cloudError(e); } finally { sync.busy = false; }
}
function cloudError(e) {
  if (e.code === 'OFFLINE') { setSync('offline', e.message); if (TurniCloud.session() && TurniCloud.session().dirty) sync.timer = setTimeout(() => cloudPush(), 30000); }
  else if (e.code === 'CONFLICT') cloudConflict();
  else if (e.code === 'LOGGED_OUT') { setSync('off'); if (APP_MODE) { ui.locked = true; if (APP_STORE) loadGateLogin(APP_STORE); else { ui.gateLogin = ''; render(); } return; } render(); askCloudLogin(e.message); }
  else setSync('error', e.message);
}
/** Prende i dati online se sono cambiati (salvati da un altro dispositivo). */
async function cloudPull() {
  if (!TurniCloud.loggedIn() || sync.busy) return;
  if (TurniCloud.session().dirty) return cloudPush();
  sync.busy = true;
  try {
    const r = await TurniCloud.pull();
    if (r.changed) applyRemote(r.state, r.doc.updateTime);
    else if (!r.doc) { TurniCloud.setLastUpdate(null); TurniCloud.setDirty(true); sync.busy = false; return cloudPush(null); }
    setSync('ok');
  } catch (e) { cloudError(e); } finally { sync.busy = false; }
}
function applyRemote(st, updateTime) {
  state = TurniData.migrate(st); saveLocal();
  TurniCloud.setLastUpdate(updateTime); TurniCloud.setDirty(false);
  if (modalOpen()) sync.pendingRender = true; else render();
}
async function cloudConflict() {
  setSync('conflict');
  let r;
  try { r = await TurniCloud.pull(); } catch (e) { return cloudError(e); }
  if (!r.doc) return cloudPush(null);
  if (!r.changed) return cloudPush();
  ui.conflict = r;
  showModal(`<h3>⚠️ Dati modificati anche da un altro dispositivo</h3>
    <p>Mentre lavoravi qui, online sono stati salvati altri dati (da <b>${esc(r.doc.device || 'un altro dispositivo')}</b>, ${fmtWhen(r.doc.savedAt)}). Le due versioni non si possono unire: scegli quale tenere.</p>
    <p class="small muted">Online: ${r.state.employees.length} dipendenti, ${r.state.shifts.length} turni · Questo dispositivo: ${state.employees.length} dipendenti, ${state.shifts.length} turni.</p>
    <div class="actions"><button class="btn" onclick="conflictKeepLocal()">Tieni quelli di questo dispositivo</button><button class="btn primary" onclick="conflictKeepOnline()">Tieni quelli online</button></div>`);
}
function conflictKeepOnline() { const r = ui.conflict; ui.conflict = null; closeModal(); applyRemote(r.state, r.doc.updateTime); setSync('ok'); render(); }

// ================= VLH: SPOSTARE I NOMI TRASCINANDO (tablet, dito o mouse) =================
let vdrag = null;
function vlhDragStart(ev) {
  const el = ev.currentTarget;
  ev.preventDefault(); el.setPointerCapture(ev.pointerId);
  vdrag = { el, h: +el.dataset.h, code: el.dataset.code, id: +el.dataset.id, x0: ev.clientX, y0: ev.clientY, moved: false, target: null, tip: document.createElement('div') };
  vdrag.tip.className = 'dragtip'; vdrag.tip.textContent = el.textContent; document.body.appendChild(vdrag.tip);
  el.classList.add('dragging');
  el.addEventListener('pointermove', vlhDragMove); el.addEventListener('pointerup', vlhDragEnd); el.addEventListener('pointercancel', vlhDragEnd);
}
function vlhDragMove(ev) {
  if (!vdrag) return;
  if (Math.abs(ev.clientX - vdrag.x0) > 6 || Math.abs(ev.clientY - vdrag.y0) > 6) vdrag.moved = true;
  const edge = 70;
  if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 18); else if (ev.clientY < edge) window.scrollBy(0, -18);
  document.querySelectorAll('.vslot.droptarget, .vfree.droptarget').forEach((x) => x.classList.remove('droptarget'));
  vdrag.target = null;
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const cell = under && under.closest('td.vslot, td.vfree');
  // solo nella stessa ora (stessa colonna)
  if (cell && +cell.dataset.h === vdrag.h && (cell.dataset.code || '') !== vdrag.code) { cell.classList.add('droptarget'); vdrag.target = cell; }
  const occ = vdrag.target && vdrag.target.querySelector('.who');
  vdrag.tip.textContent = vdrag.el.textContent + (occ ? ` ↔ ${occ.textContent}` : '');
  vdrag.tip.style.left = ev.clientX + 'px'; vdrag.tip.style.top = ev.clientY + 'px';
}
function vlhDragEnd() {
  if (!vdrag) return;
  const d = vdrag; vdrag = null;
  d.tip.remove(); d.el.classList.remove('dragging');
  document.querySelectorAll('.vslot.droptarget, .vfree.droptarget').forEach((x) => x.classList.remove('droptarget'));
  if (!d.moved || !d.target) return;
  const to = d.target.dataset.code || '', occ = d.target.querySelector('.who'), ch = {};
  if (!to) ch[d.code] = 0; // nella riga «Liberi»: la casella resta vuota
  else {
    ch[to] = d.id;
    // casella occupata: scambio (chi c'era va al posto di partenza, oppure tra i liberi)
    if (d.code) ch[d.code] = occ ? +occ.dataset.id : 0;
  }
  setVlhFixed(ui.day, d.h, ch);
}

// ================= GIORNALIERO: MODIFICA TRASCINANDO (tablet, dito o mouse) =================
let drag = null;
const SNAP = 15;
function dragStart(ev) {
  const bar = ev.currentTarget, sid = +bar.dataset.sid, s = state.shifts.find((x) => x.id === sid);
  if (!s) return;
  ev.preventDefault(); bar.setPointerCapture(ev.pointerId);
  const track = bar.parentElement, row = track.parentElement;
  const mode = ev.target.classList.contains('hl') ? 'left' : ev.target.classList.contains('hr') ? 'right' : 'move';
  drag = { s, bar, row, mode, x0: ev.clientX, y0: ev.clientY, a: s.start, b: s.end, st: s.station, moved: false,
    pxPerMin: track.getBoundingClientRect().width / ui.dragGeo.span, tip: document.createElement('div'), target: null, swap: null, bar2: null };
  drag.tip.className = 'dragtip'; document.body.appendChild(drag.tip);
  bar.classList.add('dragging');
  bar.addEventListener('pointermove', dragMove); bar.addEventListener('pointerup', dragEnd); bar.addEventListener('pointercancel', dragEnd);
  dragMove(ev);
}
function dragMove(ev) {
  if (!drag) return;
  const cfg = state.config, { open: OPEN, close: CLOSE } = T.dayHours(cfg, drag.s.day);
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
  const dm = Math.round(dx / drag.pxPerMin / SNAP) * SNAP, len = drag.s.end - drag.s.start;
  let a = drag.s.start, b = drag.s.end;
  if (drag.mode === 'move') { a = Math.min(Math.max(OPEN, drag.s.start + dm), CLOSE - len); b = a + len; }
  if (drag.mode === 'left') a = Math.min(Math.max(OPEN, drag.s.start + dm), drag.s.end - 30);
  if (drag.mode === 'right') b = Math.max(Math.min(CLOSE, drag.s.end + dm), drag.s.start + 30);
  drag.a = a; drag.b = b;
  const { H0, span } = ui.dragGeo;
  drag.bar.style.left = (((a - H0 * 60) / span) * 100).toFixed(3) + '%';
  drag.bar.style.width = (((b - a) / span) * 100).toFixed(3) + '%';
  const ta = drag.row.querySelector('[data-t="a"]'), tb = drag.row.querySelector('[data-t="b"]');
  if (ta) ta.textContent = T.fmtTime(a); if (tb) tb.textContent = T.fmtTime(b);
  const vertical = drag.mode === 'move' && Math.abs(dy) > 18;
  // spostandosi in verticale: niente cambio d'orario, si sceglie una persona (scambio) o un'area
  if (vertical) { drag.a = drag.s.start; drag.b = drag.s.end; a = drag.a; b = drag.b; }
  // vicino al bordo alto/basso dello schermo la pagina scorre da sola (per raggiungere le altre righe e fasce)
  if (vertical) {
    const edge = 70;
    if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 18); else if (ev.clientY < edge) window.scrollBy(0, -18);
  }
  if (vertical) {
    drag.bar.style.left = (((a - ui.dragGeo.H0 * 60) / ui.dragGeo.span) * 100).toFixed(3) + '%';
    const ta2 = drag.row.querySelector('[data-t="a"]'), tb2 = drag.row.querySelector('[data-t="b"]');
    if (ta2) ta2.textContent = T.fmtTime(a); if (tb2) tb2.textContent = T.fmtTime(b);
  }
  // in verticale: striscia delle aree in alto + righe delle altre persone (scambio) + fasce (vista per area)
  document.querySelectorAll('.lsec.droptarget, .lrow.swaptarget, .dropbar span.on').forEach((x) => x.classList.remove('droptarget', 'swaptarget', 'on'));
  drag.target = null; drag.swap = null;
  if (vertical) {
    if (!drag.bar2) drag.bar2 = areaBar(drag.s);
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const chip = el && el.closest('.dropbar span'), row = el && el.closest('.lrow[data-rsid]'), sec = el && el.closest('.lsec[data-st]');
    if (chip) { if (chip.dataset.st !== drag.s.station) { chip.classList.add('on'); drag.target = chip.dataset.st; } }
    else if (row && +row.dataset.rsid !== drag.s.id) {
      const o = state.shifts.find((x) => x.id === +row.dataset.rsid);
      if (o && o.employeeId !== drag.s.employeeId && !o.doppio && !drag.s.doppio && !empById(o.employeeId).fixedShift && !empById(drag.s.employeeId).fixedShift) { row.classList.add('swaptarget'); drag.swap = o; } // chi ha l'orario fisso non si scambia
    } else if (sec && ui.groupBy === 'area' && sec.dataset.st !== drag.s.station) { sec.classList.add('droptarget'); drag.target = sec.dataset.st; }
  } else if (drag.bar2) { drag.bar2.remove(); drag.bar2 = null; }
  drag.tip.textContent = drag.swap ? `↔ scambia con ${T.fullName(empById(drag.swap.employeeId))}` : `${T.fmtTime(a)}–${T.fmtTime(b)}${drag.target ? ' → ' + T.STATIONS[drag.target].short : ''}`;
  drag.tip.style.left = ev.clientX + 'px'; drag.tip.style.top = ev.clientY + 'px';
}
function dragEnd() {
  if (!drag) return;
  const d = drag; drag = null;
  d.tip.remove(); d.bar.classList.remove('dragging'); if (d.bar2) d.bar2.remove();
  document.querySelectorAll('.lsec.droptarget, .lrow.swaptarget').forEach((x) => x.classList.remove('droptarget', 'swaptarget'));
  const s = d.s;
  if (!d.moved) return openDay(s.employeeId, s.day); // tocco senza trascinare: apre il turno
  if (d.swap) { // scambio del turno tra due persone (ognuno prende orario e area dell'altro)
    const o = d.swap, ea = s.employeeId, eb = o.employeeId;
    s.employeeId = eb; o.employeeId = ea; save(); render();
    return swapToast(s, o);
  }
  const st = d.target || s.station;
  if (d.a === s.start && d.b === s.end && st === s.station) return render();
  const before = { start: s.start, end: s.end, station: s.station };
  s.start = d.a; s.end = d.b; s.station = st;
  save(); render();
  shiftToast(s, before);
}
/** Barra in basso dopo una modifica: annulla, e (se la settimana è pubblicata) aggiorna subito l'app del dipendente. */
function shiftToast(s, before) {
  const e = empById(s.employeeId), ws = T.mondayOf(s.day);
  const published = pubOf(ws) && state.reqCreds[s.employeeId] && TurniCloud.loggedIn();
  const txt = `${esc(T.fullName(e))}: ${T.fmtTime(before.start)}–${T.fmtTime(before.end)} → <b>${T.fmtTime(s.start)}–${T.fmtTime(s.end)}</b>${before.station !== s.station ? ` · ${T.STATIONS[s.station].short}` : ''}`;
  ui.toastUndo = () => { Object.assign(s, before); save(); render(); hideToast(); };
  ui.toastNotify = () => notifyShiftChange(s);
  document.getElementById('toast').innerHTML = `<div class="bar"><span>${txt}</span><button onclick="ui.toastUndo()">↩︎ Annulla</button>${published ? `<button class="go" onclick="ui.toastNotify()">📲 Aggiorna l'app di ${esc(e.firstName || T.fullName(e))}</button>` : ''}<button onclick="hideToast()" aria-label="chiudi">✕</button></div>`;
  clearTimeout(ui.toastTimer); ui.toastTimer = setTimeout(hideToast, 20000);
}
/** Striscia delle aree mentre si trascina in verticale: si lascia la barra sull'area voluta. */
function areaBar(s) {
  const e = empById(s.employeeId), list = e.type === 'HOSPITALITY' ? ['HOSPITALITY', ...(T.CREW_STATIONS.includes('SERVIZIO') && state.config.hospSala !== false ? ['SERVIZIO'] : [])] : [...T.CREW_STATIONS];
  const div = document.createElement('div'); div.className = 'dropbar no-print';
  div.style.top = (document.querySelector('header').getBoundingClientRect().bottom + 8) + 'px';
  div.innerHTML = list.map((st) => `<span data-st="${st}" class="st-${st}" style="${st === s.station ? 'opacity:.45' : ''}">${T.STATIONS[st].short}</span>`).join('');
  document.body.appendChild(div); return div;
}
function swapToast(s, o) {
  const ea = empById(o.employeeId), eb = empById(s.employeeId), ws = T.mondayOf(s.day);
  const published = pubOf(ws) && TurniCloud.loggedIn() && (state.reqCreds[ea.id] || state.reqCreds[eb.id]);
  ui.toastUndo = () => { const x = s.employeeId; s.employeeId = o.employeeId; o.employeeId = x; save(); render(); hideToast(); };
  ui.toastNotify = async () => { await notifyShiftChange(s); await notifyShiftChange(o); };
  document.getElementById('toast').innerHTML = `<div class="bar"><span>↔ Scambiati: <b>${esc(T.fullName(ea))}</b> ${T.fmtTime(o.start)}–${T.fmtTime(o.end)} · <b>${esc(T.fullName(eb))}</b> ${T.fmtTime(s.start)}–${T.fmtTime(s.end)}</span><button onclick="ui.toastUndo()">↩︎ Annulla</button>${published ? '<button class="go" onclick="ui.toastNotify()">📲 Aggiorna le loro app</button>' : ''}<button onclick="hideToast()" aria-label="chiudi">✕</button></div>`;
  clearTimeout(ui.toastTimer); ui.toastTimer = setTimeout(hideToast, 20000);

// ================= ORARIO PUBBLICATO PER IL PERSONALE =================
// "Pubblica settimana": si fissa una copia dell'orario della settimana (quella che vedono i dipendenti) e per ogni
// dipendente con un accesso si manda online il suo orario, cifrato con la sua chiave personale (nome utente + password).

    const days = ctx.days.map((d) => {
      const sh = T.shiftsOf(ctx, e.id, d).map((s) => ({ a: s.start, b: s.end, st: s.station, dbl: !!s.doppio, ...(BASE_ST.includes(s.station) ? {} : { n: (T.STATIONS[s.station] || {}).short || s.station }) }));

      const tag = sh.length ? '' : !T.started(e, d) ? 'Non ancora in servizio' : ab ? T.absenceInfo(ab.type).label : T.isRest(e, d) ? 'Riposo' : 'Libero';
      return { d, sh, tag, note: lim ? 'Richiesta accettata: ' + lim.label : '' };
    });
    out[e.id] = { days, hours: T.worked(ctx, e.id) + T.doubleWorked(ctx, e.id), target: T.target(ctx, e) };
  }
  // manager: i loro turni (calendario a parte), con il ruolo del giorno (apertura, chiusura, centrale…)
  const M = window.TurniManager;
  for (const m of (state.managers || []).filter((x) => x.active !== false)) {
    const mine = (state.mgrShifts || []).filter((s) => s.managerId === m.id && s.day >= ws && s.day <= ws + 6);
    if (!mine.length) continue;
    const days = ctx.days.map((d) => {
      const sh = mine.filter((s) => s.day === d).sort((a, b) => a.start - b.start).map((s) => ({ a: s.start, b: s.end, st: 'MGR', r: (M && M.ROLE_TXT[s.role]) || '' }));
      const ab = (state.absences || []).find((a) => a.employeeId === m.id && d >= a.from && d <= a.to);
      return { d, sh, tag: sh.length ? '' : ab ? T.absenceInfo(ab.type).label : 'Riposo', note: '' };
    });
    out[m.id] = { days, hours: mine.reduce((t, s) => t + (M ? M.workOf(s.end - s.start, state) : s.end - s.start), 0), target: M ? M.targetOf(state, m, ws) : 0, mgr: true };
  }

}

      await TurniCloud.setOrario(c.oid, await TurniCripto.sealWith(c.k, { nome: e.firstName || '', weeks: mine, requests: isMgr ? [] : reqs, ruolo: isMgr ? 'manager' : 'personale' }));

// link unico dell'app per il personale (uguale per tutti): ?s = codice del locale (resta anche nell'app installata)
const appLink = () => `${location.href.split('#')[0].split('?')[0].replace(/index\.html$/, '').replace(/\/?$/, '/')}richieste.html?s=${TurniCloud.uid()}`;

function newUser(e) {
  const taken = new Set(Object.entries(state.reqCreds).filter(([id]) => +id !== e.id).map(([, c]) => c.user));

async function checkInbox(notify) {
  if (inboxBusy || !TurniCloud.loggedIn() || !state.reqKeys) return 0;
  inboxBusy = true;
  try {
    const me = TurniCloud.session().email;
    if (state.loginPublished !== me) { await TurniCloud.setStoreInfo({ login: me }); state.loginPublished = me; save(); }
    // una volta sola dopo l'aggiornamento: ogni dipendente riceve l'elenco delle sue richieste con lo stato

    await upgradeCreds();

    const list = await TurniCloud.listRequests();
    const known = new Set((state.requests || []).map((q) => q.rid));

    for (const d of list) {
      if (known.has(d.rid)) continue;
      let x;
      try { x = await TurniCripto.openWith(state.reqKeys.priv, d); } catch (e) { continue; }
      const e = empById(+d.emp);
      if (!e || !x || !x.date) continue;
      const day = T.toDay(x.date), margin = state.config.requestMargin ?? 30, after = state.config.requestAfter ?? 120;
      const q = { id: newId(), rid: d.rid, employeeId: e.id, day, kind: x.kind, note: String(x.note || '').slice(0, 300), status: 'in attesa', createdAt: d.createdAt };
      if (x.kind === 'impegno') { q.time = +x.time; q.until = Math.max(0, q.time - margin); q.after = Math.min(1440, q.time + after); }
      if (x.kind === 'dalle') q.from = +x.from;
      if (x.kind === 'fisso') {
        q.slots = (Array.isArray(x.slots) ? x.slots : []).map((y) => ({ d: +y.d, a: +y.a, b: +y.b })).filter((y) => y.d >= 1 && y.d <= 7 && y.b > y.a).slice(0, 14);
        q.to = x.to ? T.toDay(x.to) : null;
        if (!q.slots.length) continue;

      fresh.push(q);
    }
    if (fresh.length) {

      pushOrari([...new Set(fresh.map((q) => q.employeeId))]).catch(() => null);

}

/** Crea (o rinnova) nome utente e password di un dipendente. La password vecchia smette di funzionare. */
/*
 * Ogni dipendente ha una "chiave dei turni" fissa (k) e un indirizzo fisso del suo orario (oid). Nell'accesso online
 * la chiave è custodita sotto la sua password (kw): così può cambiarsi la password da solo senza che il manager la conosca,
 * e il manager continua a pubblicargli l'orario con la stessa chiave.
 */
const randB64 = (n) => btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(n))));

async function accessFields(e, user, pw, k, oid) {
  const w = await TurniCripto.sealWith(await TurniCripto.personalKey(TurniCloud.uid(), user, pw), { k });

}
async function makeAccess(id, quiet) {
  const e = personById(id); if (!e) return false;
  const old = state.reqCreds[id];
  const user = old ? old.user : newUser(e), pw = newPassword();
  const k = (old && old.k) || randB64(32), oid = (old && old.oid) || randId();
  try {

    await TurniCloud.setAccess(code, await accessFields(e, user, pw, k, oid));
    // via tutti gli altri accessi di questa persona (anche quelli nuovi creati da lei cambiando password)
    for (const a of await TurniCloud.listAccess()) if (String(a.emp) === String(e.id) && a.code !== code) await TurniCloud.deleteAccess(a.code);
    if (old && !old.oid && old.code) await TurniCloud.deleteOrario(old.code); // vecchio formato
    state.reqCreds[id] = { user, pw, code, k, oid }; save();
    pushOrari([id]).catch(() => null); // con la password nuova serve di nuovo il suo orario pubblicato
    if (!quiet) { render(); if (mgrById(id) && modalOpen()) mgrAccess(id); shareAccess(id); }

/** Accessi creati prima del cambio password in autonomia: si aggiungono chiave fissa e indirizzo dell'orario (stessa password). */
async function upgradeCreds() {
  const todo = Object.entries(state.reqCreds).filter(([, c]) => !c.k || !c.oid);
  for (const [id, c] of todo) {
    const e = personById(+id); if (!e) continue;
    const k = randB64(32), oid = randId();
    try {
      await TurniCloud.setAccess(c.code, await accessFields(e, c.user, c.pw, k, oid));
      await TurniCloud.deleteOrario(c.code);

async function doAccept(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  if (q.kind === 'fisso') {
    const f = document.getElementById('acc-from').value, to = document.getElementById('acc-to').value;
    if (f) q.day = T.toDay(f);
    q.to = to ? T.toDay(to) : null;
    if (q.to != null && q.to < q.day) return alert('"Fino al" deve essere dopo "Valido dal".');
  }
  const t = document.getElementById('acc-t');
  if (t && q.kind === 'impegno') { q.until = +t.value; const t2 = document.getElementById('acc-t2'); if (t2) q.after = Math.max(q.until, +t2.value); }
  if (t && q.kind === 'dalle') q.from = +t.value;
  if (t && q.kind === 'turno') { const t2 = document.getElementById('acc-t2'); q.from = +t.value; if (t2) q.until = Math.max(q.from + 60, +t2.value); }
  const how = (document.querySelector('input[name="acc-how"]:checked') || {}).value || 'none';
  const apply = how === 'new';
  let applied = null, swapped = null;
  if (how.startsWith('swap')) {
    const sws = T.proposeSwap(state, { ...q, status: 'accettata' }) || [];
    const sw = sws[+how.slice(4)] || sws[0];
    if (sw) {
      state.shifts = state.shifts.map((x) => (x === sw.from ? sw.theirs : x === sw.with ? sw.mine : x));
      applied = sw.mine; swapped = sw;
    }
  }
  if (apply) {
    const p = T.proposeFor(state, q);
    if (p.proposal) {
      state.shifts = state.shifts.filter((x) => !(x.employeeId === q.employeeId && x.day === q.day && !x.doppio));
      applied = { ...p.proposal, id: newId() }; state.shifts.push(applied);
      // un doppio che non rispetta più la richiesta va tolto
      state.shifts = state.shifts.filter((x) => !(x.employeeId === q.employeeId && x.day === q.day && x.doppio && ((q.until != null && x.end > q.until && !(q.after != null && x.start >= q.after)) || (q.from != null && x.start < q.from))));
    }
  }
  const msg = (document.getElementById('acc-msg').value || '').trim();
  q.status = 'accettata';
  q.reply = msg || (q.kind === 'fisso' ? 'Ok, ne terrò conto nei turni.' : q.kind === 'libero' ? 'Ok, quel giorno sei libero/a.' : applied ? `Ok: il tuo turno è ${T.fmtTime(applied.start)}–${T.fmtTime(applied.end)}.` : `Ok: il turno sarà compatibile (${LIMIT_TXT(q)}).`);
  closeModal(); save(); render();
  if (swapped) {
    const other = empById(swapped.partner);
    showModal(`<h3>✅ Richiesta accettata e turni scambiati</h3><p>${esc(T.fullName(empById(q.employeeId)))}: <b>${shiftTxt(swapped.mine)}</b><br>${esc(T.fullName(other))}: <b>${shiftTxt(swapped.theirs)}</b></p>
      <p class="notice warn">Ricordati di avvisare <b>${esc(T.fullName(other))}</b> che il suo turno di ${T.DOW_LONG[T.dow(q.day)]} ${T.itDate(q.day)} è cambiato.</p><div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
  }
  pushOrari([q.employeeId]).catch(() => null);
  if (q.rid) try { await TurniCloud.answerRequest(q.rid, 'accettata', q.reply); } catch (e) { alert('Accettata qui, ma la risposta al dipendente non è partita (connessione?). Riprova più tardi da "Rimetti in attesa" → Accetta.'); }
}

        ${m.kind === 'dalle' ? `<label class="f">Può iniziare dalle${tSel(m.from, "mrSet('from',this.value)")}</label>` : ''}
        ${m.kind === 'turno' ? `<label class="f">Fino al (vuoto = solo quel giorno)<input type="date" value="${m.to}" onchange="mrSet('to',this.value)"></label>` : ''}</div>
      ${m.kind === 'turno' ? `<div><div class="small" style="font-weight:600;color:var(--muted)">Quale turno</div><div class="row" style="margin-top:6px;flex-wrap:wrap">${TURNI_PRESET.map((x, i) => `<button class="btn ${m.preset === i ? 'primary' : ''}" onclick="mrPreset(${i})">${x[0]}</button>`).join('')}</div>
        <div class="row" style="margin-top:8px"><label class="f">Dalle${tSel(m.tFrom, "mrSet('tFrom',this.value);ui.mr.preset=null")}</label><label class="f">alle${tSel(m.tUntil, "mrSet('tUntil',this.value);ui.mr.preset=null")}</label></div></div>` : ''}
      ${m.kind === 'impegno' ? `<div class="small muted">Il turno dovrà finire almeno ${T.fmtDur(margin)} prima dell'impegno oppure iniziare almeno ${T.fmtDur(after)} dopo (si può cambiare quando la accetti).</div>` : ''}
      ${m.kind === 'fisso' ? `<div><div class="small" style="font-weight:600;color:var(--muted)">Quando è impegnato/a ogni settimana</div>${m.slots.map((sl, i) => `<div class="row" style="margin-top:6px"><select onchange="mrSlot(${i},'d',this.value)">${[1, 2, 3, 4, 5, 6, 7].map((d) => `<option value="${d}" ${sl.d === d ? 'selected' : ''}>${T.DOW_LONG[d]}</option>`).join('')}</select> dalle ${tSel(sl.a, `mrSlot(${i},'a',this.value)`)} alle ${tSel(sl.b, `mrSlot(${i},'b',this.value)`)} ${m.slots.length > 1 ? `<button class="link" onclick="mrSlotDel(${i})">togli</button>` : ''}</div>`).join('')}
        <button class="link" style="margin-top:6px" onclick="mrSlotAdd()">+ aggiungi un altro giorno</button></div>` : ''}
      <label class="f">Nota (facoltativa)<input type="text" maxlength="300" value="${esc(m.note)}" placeholder="es. esame all'università" onchange="mrSet('note',this.value)"></label>
    </div>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn" onclick="saveManualRequest(false)">Salva in attesa</button><button class="btn primary" onclick="saveManualRequest(true)">Salva e accetta…</button></div>`);
}
function saveManualRequest(accept) {
  const m = ui.mr, e = empById(+m.emp);
  if (!e) return alert('Scegli il dipendente.');
  if (!m.date) return alert('Indica il giorno.');
  const q = { id: newId(), manual: true, employeeId: e.id, day: T.toDay(m.date), kind: m.kind, note: String(m.note || '').trim().slice(0, 300), status: 'in attesa', createdAt: new Date().toISOString() };
  if (m.kind === 'impegno') { q.time = m.time; q.until = Math.max(0, m.time - (state.config.requestMargin ?? 30)); q.after = Math.min(1440, m.time + (state.config.requestAfter ?? 120)); }
  if (m.kind === 'dalle') q.from = m.from;
  if (m.kind === 'turno') {
    if (!(m.tUntil > m.tFrom)) return alert('Controlla gli orari del turno: "alle" deve essere dopo "dalle".');
    q.from = m.tFrom; q.until = m.tUntil; q.label = m.preset != null ? TURNI_PRESET[m.preset][0] : 'Turno dalle ' + T.fmtTime(m.tFrom) + ' alle ' + T.fmtTime(m.tUntil);
    q.to = m.to ? T.toDay(m.to) : null;
    if (q.to != null && q.to < q.day) return alert('"Fino al" deve essere dopo il giorno.');
  }
  if (m.kind === 'fisso') {
    q.slots = m.slots.filter((x) => x.b > x.a).map((x) => ({ ...x }));
    if (!q.slots.length) return alert('Controlla gli orari: "alle" deve essere dopo "dalle".');
    q.to = m.to ? T.toDay(m.to) : null;
    if (q.to != null && q.to < q.day) return alert('"Fino al" deve essere dopo "Dal".');
  }
  state.requests = state.requests || [];
  state.requests.push(q); ui.mr = null; save();
  pushOrari([q.employeeId]).catch(() => null);
  closeModal(); render();
  if (accept) askAccept(q.id);
}
/** Turni già pianificati (da oggi in poi) che non rispettano gli impegni fissi della richiesta. */
function fixedConflicts(q) {
  const from = Math.max(q.day, T.todayDay());
  const fake = { ...state, requests: [{ ...q, status: 'accettata' }] };
  const out = [];
  for (const s of state.shifts) {
    if (s.employeeId !== q.employeeId || s.day < from || (q.to != null && s.day > q.to)) continue;
    const ctx = { limits: T.makeCtx(fake, T.mondayOf(s.day)).limits };
    if (!T.fitsLimit(ctx, s)) out.push(s);
  }
  return out.sort((a, b) => a.day - b.day || a.start - b.start);
}
async function deleteRequests(ids) {
  const list = state.requests.filter((q) => ids.includes(q.id));
  if (!list.length) return;
  const acc = list.filter((q) => q.status === 'accettata').length;
  if (!confirm(`Eliminare ${list.length === 1 ? 'questa richiesta' : list.length + ' richieste'}?${acc ? `\n${acc === 1 ? 'È accettata' : acc + ' sono accettate'}: il generatore smetterà di tenerne conto.` : ''}\nIl dipendente la vedrà come "cancellata dal manager".`)) return;
  state.requests = state.requests.filter((q) => !ids.includes(q.id)); save(); render();
  pushOrari([...new Set(list.map((q) => q.employeeId))]).catch(() => null);
  let fail = 0;
  for (const q of list) { if (q.rid) try { await TurniCloud.deleteRequest(q.rid); } catch (e) { fail++; } }
  if (fail) alert(`Eliminate qui, ma ${fail} non sono state cancellate online (connessione?).`);
}
function askReject(id) {
  showModal(`<h3>Rifiuta la richiesta</h3><div class="form"><label class="f">Motivo per il dipendente (facoltativo)<input type="text" id="rej-msg" maxlength="200" placeholder="es. quel giorno siamo scoperti, ne parliamo"></label></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn danger" onclick="doReject(${id})">Rifiuta</button></div>`);
}
async function doReject(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  q.status = 'rifiutata'; q.reply = (document.getElementById('rej-msg').value || '').trim() || 'Non è possibile, parliamone.';
  closeModal(); save(); render(); pushOrari([q.employeeId]).catch(() => null);
  if (q.rid) try { await TurniCloud.answerRequest(q.rid, 'rifiutata', q.reply); } catch (e) { alert('Rifiutata qui, ma la risposta al dipendente non è partita (connessione?).'); }
}
async function reopenRequest(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  q.status = 'in attesa'; q.reply = ''; save(); render(); pushOrari([q.employeeId]).catch(() => null);
  if (q.rid) try { await TurniCloud.answerRequest(q.rid, 'in attesa', ''); } catch (e) { /* riprova alla prossima risposta */ }
}

// --- esporta / importa ---
function exportData() {
  const data = { app: 'pianificatore-turni', exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `turni-${T.toIso(T.todayDay())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { return alert('Il file non è valido.'); }
    const st = data && data.state ? data.state : data;
    if (!st || !Array.isArray(st.employees) || !Array.isArray(st.shifts)) return alert('Questo file non contiene dati di turni.');
    if (!confirm(`Importare ${st.employees.length} dipendenti e ${st.shifts.length} turni? I dati attuali di questo browser verranno sostituiti.`)) return;
    state = TurniData.migrate(st); save(); go('turni');
  };
  r.readAsText(file);
}
function setCovMin(i, k, v) {
  const r = state.coverage[i];
  if (!r.min) r.min = [0, 1, 2, 3, 4, 5, 6].map(() => r.minStaff || 0);
  r.min[k] = Math.max(0, Math.round(+v || 0));
  save();
}
function saveConfig() {
  const keys = ['crewMaxWeekday', 'crewMax', 'hospMax', 'minShift', 'rest11', 'rest36', 'doubleMax', 'doubleGap', 'closeGrace', 'requestMargin', 'requestAfter'];
  const vals = keys.map((k) => T.parseHours(document.getElementById('cfg-' + k).value));
  if (vals.some((v, i) => v == null || (['closeGrace', 'requestMargin', 'requestAfter'].includes(keys[i]) ? v < 0 : v <= 0))) { const e = document.getElementById('cfg-error'); e.style.display = 'block'; e.textContent = 'Valori non validi: usa numeri di ore, es. 4 o 4,5.'; return; }
  keys.forEach((k, i) => (state.config[k] = vals[i]));
  state.config.afternoonStart = +document.getElementById('cfg-aft0').value; state.config.afternoonEnd = +document.getElementById('cfg-aft1').value;
  state.config.dinnerPreStart = +document.getElementById('cfg-pre').value;
  state.config.weekdayLongPerWeek = Math.max(0, Math.min(4, Math.round(+document.getElementById('cfg-longpw').value || 0)));
  save(); render();
  showModal('<h3>Regole salvate</h3><p>I controlli dei turni ora usano i nuovi valori.</p><div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>');
}

saveLocal();
render();
if (TurniCloud.loggedIn()) cloudPull().then(() => checkInbox(true));
else if (ui.locked) { if (storeCode()) loadGateLogin(storeCode()); else { ui.gateLogin = ''; render(); } }
else if (TurniCloud.configured()) { if (!state.employees.length) askCloudLogin(); }
else loadFromSite(false);
// installabile come app (schermata Home del telefono o del computer)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => null);
