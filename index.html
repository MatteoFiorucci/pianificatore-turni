<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pianificatore turni</title>
<link rel="manifest" href="app-manager.webmanifest">
<meta name="theme-color" content="#1e5631">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni Manager">
<link rel="apple-touch-icon" href="icone/manager-180.png">
<link rel="icon" href="icone/manager-192.png">
<style>
  :root {
    --green: #1e5631; --green-soft: #d5eadb; --yellow: #ffc72c; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #d9d9de; --bg: #f6f6f4; --err: #ffd3d6; --err-ink: #b3261e; --warn: #fff0c2; --warn-ink: #8a6100;
    --ok: #dcf0e1; --rest: #1e40af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  header .brand .m { background: var(--yellow); color: var(--green); border-radius: 6px; padding: 2px 8px; font-size: 18px; }
  nav { display: flex; gap: 4px; }
  nav button { background: transparent; border: 0; color: #d9eadf; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav button.active { background: var(--yellow); color: var(--green); }
  main { padding: 16px 20px 40px; }
  h2 { margin: 4px 0 12px; font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button.btn, label.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.btn:hover, label.btn:hover { border-color: #b9b9c0; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.danger { background: var(--err-ink); color: #fff; border-color: var(--err-ink); }
  button.link { background: none; border: 0; color: var(--green); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  button:disabled { opacity: .45; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar .week { font-size: 17px; font-weight: 700; min-width: 210px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; font: inherit; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--green-soft); color: var(--green); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .chip.err { background: var(--err); color: var(--err-ink); }
  .chip.warn { background: var(--warn); color: var(--warn-ink); }
  .chip.ok { background: var(--ok); color: var(--green); }
  .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .gridwrap { overflow: auto; max-height: calc(100vh - 190px); }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
  .grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
  .grid thead th { position: sticky; top: 0; background: #fafafa; z-index: 2; padding: 8px 6px; font-size: 13px; }
  .grid .name { position: sticky; left: 0; background: #fff; z-index: 1; text-align: left; padding: 6px 10px; min-width: 190px; font-weight: 600; white-space: nowrap; }
  .grid thead .name { z-index: 3; background: #fafafa; }
  .grid tr.cov td { background: #fbfbfb; font-size: 12px; }
  .grid tr.cov .name { font-weight: 500; color: var(--muted); background: #fbfbfb; }
  .grid tr.cov .c { text-align: center; font-weight: 700; padding: 4px; }
  .grid tr.cov .c.okc { color: var(--green); background: var(--ok); }
  .grid tr.cov .c.bad { color: var(--err-ink); background: var(--err); }
  .grid tr.cov .c.soft { color: var(--warn-ink); background: var(--warn); }
  td.cell { min-width: 96px; height: 50px; text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 13px; }
  td.cell:hover { outline: 2px solid var(--green); outline-offset: -2px; }
  td.cell.err { background: var(--err); }
  td.cell.warn { background: var(--warn); }
  td.cell .st { font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  td.cell.dbl { box-shadow: inset 3px 0 0 var(--yellow); }
  .rest { color: var(--rest); font-weight: 600; font-size: 12px; }
  .abs { color: #777; font-weight: 700; font-size: 12px; }
  .empty { color: #c8c8cc; }
  td.tot { text-align: center; min-width: 80px; font-weight: 700; font-variant-numeric: tabular-nums; }
  td.tot .sub { font-weight: 400; font-size: 11px; color: var(--muted); }
  td.tot.over { background: var(--err); } td.tot.under { background: var(--warn); } td.tot.exact { background: var(--ok); }
  aside.problems { padding: 14px; max-height: calc(100vh - 190px); overflow: auto; }
  aside h3 { margin: 0 0 8px; font-size: 15px; }
  .prob { display: flex; gap: 8px; padding: 8px; border-radius: 8px; cursor: default; }
  .prob.click { cursor: pointer; } .prob.click:hover { background: #f3f3f5; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
  .dot.ERROR { background: #d32f2f; } .dot.WARNING { background: #f9a825; }
  .prob .r { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  details.help { margin-bottom: 12px; padding: 10px 14px; }
  details.help summary { cursor: pointer; font-weight: 700; }
  details.help ul { margin: 8px 0 0; padding-left: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  table.list { border-collapse: collapse; width: 100%; }
  .list th, .list td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .list th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: #fafafa; }
  .list tr.group td { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .list tr.sel td { background: var(--err); }
  .list tr.clickable { cursor: pointer; } .list tr.clickable:hover td { background: #f6f8f6; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eee; font-size: 12px; margin-right: 4px; }
  .pill.on { background: var(--green-soft); color: var(--green); font-weight: 600; }
  label.tg { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; margin: 2px 4px 2px 0; user-select: none; background: #fff; }
  label.tg.on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
  label.tg input { display: none; }
  .deletebar { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 12px; background: #fff; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
  .form { display: grid; gap: 12px; }
  .form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .form label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input.bad { border-color: var(--err-ink); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 4px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .shiftbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .reqtag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: #e8eefc; color: #1e40af; font-size: 9.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; vertical-align: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  button.ib { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: var(--green); font: 700 12px/1 -apple-system, sans-serif; cursor: pointer; padding: 0; margin-left: 4px; vertical-align: 2px; text-transform: none; letter-spacing: 0; }
  button.ib:hover { background: var(--green); color: #fff; }
  th button.ib { width: 18px; height: 18px; font-size: 11px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: #e5484d; color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 2px; }
  .evtag { display: inline-block; padding: 0 7px; border-radius: 999px; background: #fff4d6; color: #7a5200; font-size: 11px; line-height: 18px; font-weight: 600; white-space: nowrap; }
  .evtag.closed { background: #e2e8f0; color: #334155; }
  .autotag { display: inline-block; padding: 0 6px; border-radius: 999px; background: #e6f0ff; color: #2456b3; font-size: 11px; line-height: 18px; margin-left: 4px; }
  .reqcard { padding: 14px 16px; margin-bottom: 12px; }
  .reqcard .when { font-weight: 700; font-size: 15px; }
  .reqcard .prop { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #f3f6f4; font-size: 13px; }
  /* iPhone ingrandisce da solo la pagina quando si tocca un campo con testo sotto i 16px: su telefono/tablet si usano 16px */
  @media (pointer: coarse), (max-width: 760px) { input, select, textarea { font-size: 16px !important; } }
  @media (max-width: 760px) {
    /* accessi del personale su telefono: una scheda per persona, con i pulsanti sotto */
    .card:has(> table.acc) { max-height: none !important; overflow: visible !important; position: static !important; }
    table.acc thead { display: none; }
    table.acc tr { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    table.acc td { display: inline-block; border: 0 !important; padding: 2px 8px 2px 0 !important; position: static !important; box-shadow: none !important; background: none !important; }
    table.acc td:first-child { display: block; }
    table.acc td:last-child { display: block; text-align: left !important; margin-top: 6px; }
  }
  /* ---- giornaliero: modifica trascinando (tablet) ---- */
  .sheet.editing .lrow:not(.lhead):not(.lcount) { min-height: 38px; }
  .sheet.editing .lrow:not(.lhead):not(.lcount) > div { font-size: 13px; }
  .lbar.drag { top: 4px; bottom: 4px; cursor: grab; touch-action: none; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .lbar.drag .hl, .lbar.drag .hr { position: absolute; top: 0; bottom: 0; width: 16px; cursor: ew-resize; }
  .lbar.drag .hl { left: -4px; } .lbar.drag .hr { right: -4px; }
  .lbar.drag .hl::after, .lbar.drag .hr::after { content: ''; position: absolute; top: 25%; bottom: 25%; left: 6px; width: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .lbar.dragging { opacity: .85; outline: 2px solid #111; z-index: 3; cursor: grabbing; }
  .lsec.droptarget h4 { outline: 3px solid #111; }
  .lrow.swaptarget { background: #fff3c4 !important; outline: 2px dashed #8a6100; outline-offset: -2px; }
  .dropbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 26; display: flex; gap: 6px; background: #1d1d1f; padding: 8px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .dropbar span { padding: 10px 14px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; border: 2px solid transparent; }
  .dropbar span.on { border-color: #fff; transform: scale(1.06); }
  .dragtip { position: fixed; z-index: 30; background: #111; color: #fff; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 8px; pointer-events: none; transform: translate(-50%, -130%); white-space: nowrap; }
  #toast .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; background: #1d1d1f; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 24px); font-size: 14px; }
  #toast .bar button { font: inherit; font-weight: 700; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; background: #fff; color: #111; }
  #toast .bar button.go { background: var(--yellow); }
  .sync { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .sync button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sync button.bad { background: #fde68a; color: #7c2d12; }
  .notice { padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .notice.err { background: var(--err); color: var(--err-ink); } .notice.info { background: #e8eefc; color: var(--rest); } .notice.warn { background: var(--warn); color: var(--warn-ink); }
  .section { padding: 16px; margin-bottom: 16px; }
  /* ---- adattamento a schermi piccoli e finestre ridotte ---- */
  html, body { overflow-x: clip; }
  header { flex-wrap: wrap; height: auto; min-height: 56px; row-gap: 4px; padding-top: 6px; padding-bottom: 6px; }
  header .brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav button { white-space: nowrap; flex: none; }
  .sheet { min-width: 0; }
  .countwrap { overflow-x: auto; max-width: 100%; }
  .countwrap > .lsec { min-width: 640px; }
  .modal { max-width: calc(100vw - 24px); }
  .card:has(> table.list), .card > div:has(> table.list) { overflow-x: auto; }
  @media (max-width: 1180px) {
    header { gap: 4px 12px; }
    nav button { padding: 8px 10px; }
  }
  @media (max-width: 1024px) {
    .grid .name { min-width: 150px; max-width: 170px; white-space: normal; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
  }
  @media (max-width: 760px) {
    header { padding: 6px 10px; }
    header .brand { width: 100%; font-size: 14px; }
    nav { width: 100%; }
    nav button { padding: 6px 10px; font-size: 13px; }
    main { padding: 10px 10px 30px; }
    h2 { font-size: 18px; }
    .toolbar { gap: 6px; }
    .toolbar .week { min-width: 0; flex: 1 1 140px; font-size: 15px; }
    .grid .name { min-width: 112px; max-width: 128px; white-space: normal; font-size: 12px; padding: 4px 6px; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
    .grid thead th { padding: 6px 3px; font-size: 12px; }
    td.cell { min-width: 76px; height: 46px; font-size: 12px; }
    td.tot { min-width: 62px; }
    .gridwrap, aside.problems { max-height: none; }
    .modal-bg { padding: 10px; align-items: flex-start; }
    .modal { padding: 14px; max-height: calc(100vh - 20px); }
    .form .row { gap: 8px; }
    .list th, .list td { padding: 7px 8px; }
    .sheet { padding: 10px 8px; }
    .daily .dayside .card { margin-bottom: 8px; }
  }

  /* ---- lineare giornaliero ---- */
  @media screen and (max-width: 900px) {
    .sheet .lrow { grid-template-columns: 36px 130px 40px 40px minmax(0, 1fr); font-size: 11.5px; }
  }
  @media screen and (max-width: 560px) {
    .sheet .lrow { grid-template-columns: 96px 36px 36px minmax(0, 1fr); font-size: 11px; min-height: 20px; }
    .sheet .lrow > div { padding: 2px 3px; }
    .sheet .lrow .lpos { display: none; }
    .sheet .lhead .ltrack span.odd { display: none; }
    .sheet .countwrap .lrow { grid-template-columns: 96px 72px minmax(0, 1fr); }
  }
  .daily { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .daily { grid-template-columns: minmax(0, 1fr); } }
  .sheet { padding: 12px 14px; }
  .lsec { margin-top: 12px; }
  .lsec h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--green); text-align: center; background: var(--yellow); border-radius: 4px; padding: 2px; }
  .lrow { display: grid; grid-template-columns: 62px 190px 46px 46px minmax(0, 1fr); align-items: stretch; min-height: 22px; border-bottom: 1px solid #eee; font-size: 12px; }
  .lrow > div { padding: 2px 4px; display: flex; align-items: center; }
  .lrow.click { cursor: pointer; } .lrow.click:hover { background: #f4f8f5; }
  .lrow .lpos { font-size: 10px; font-weight: 700; color: var(--muted); justify-content: flex-end; }
  .lrow .lname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .ltime { font-variant-numeric: tabular-nums; justify-content: center; }
  .lrow .ltrack { position: relative; padding: 0; min-height: 20px;
    background-image: linear-gradient(to right, #cfcfd4 1px, transparent 1px), linear-gradient(to right, #ececf0 1px, transparent 1px);
    background-size: var(--hw) 100%, calc(var(--hw) / 4) 100%; }
  .lbar { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; opacity: .9; }
  .lhead { border-bottom: 2px solid var(--line); font-weight: 700; font-size: 11px; color: var(--muted); }
  .lhead .ltrack { background: #fafafa; }
  .lhead .ltrack span { position: absolute; top: 3px; transform: translateX(-50%); font-size: 10px; }
  .lcount .ltrack { display: flex; background: none; }
  .lcount .ltrack span { flex: 1; text-align: center; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .lcount.total { font-weight: 800; background: var(--green-soft); }
  .st-CUCINA { background: #d84a3a; } .st-FRONT { background: #2f80c0; } .st-MCCAFE { background: #7a4a2a; }
  .st-SERVIZIO { background: #8a8a8a; } .st-HOSPITALITY { background: #6c4bb5; }
  .lbar .lbl { display: none; }
  .printhead { display: none; }
  .evimp { font-size: 11px; color: #7a5200; font-weight: 600; margin-top: 2px; }
  .lcount.gcrow { color: var(--green); font-weight: 600; } .lcount.evrow { color: #7a5200; }
  .dayside .card { padding: 12px; margin-bottom: 12px; } .dayside h3 { margin: 0 0 6px; font-size: 14px; }
  .dayside ul { margin: 0; padding-left: 18px; } .dayside li { margin: 2px 0; }
  @media print {
    @page { size: A4 portrait; margin: 8mm; }
    header, .toolbar, .no-print, #modal { display: none !important; }
    body { background: #fff; } main { padding: 0; }
    /* lineare stampato: solo griglia, ore e aree; in testa la previsione, sotto riposi e assenze */
    .daily { display: block; } .card { border: 0; box-shadow: none; }
    .sheet { padding: 0; }
    .printhead { display: block; font-size: 11px; margin: 2px 0 4px; padding: 3px 6px; border: 1px solid #999; border-radius: 4px; }
    .print-hide, .pdot, .reqtag, .evimp { display: none !important; }
    .lsec { margin-top: 5px; break-inside: avoid; }
    .lsec h4 { font-size: 10px; padding: 1px; margin-bottom: 1px; }
    .lrow { grid-template-columns: 28px 150px 32px 32px 1fr; font-size: 9.5px; min-height: 14px; border-bottom: 1px solid #ccc; }
    .lhead .ltrack span.odd { display: none; }
    .lrow > div { padding: 0 3px; }
    .lrow .lname { font-weight: 700; }
    .lrow .ltrack { min-height: 15px; }
    .lbar { top: 1px; bottom: 1px; opacity: 1; border-radius: 2px; display: flex; align-items: center; overflow: hidden; }
    .lbar .lbl { display: block; color: #fff; font-size: 8.5px; font-weight: 800; padding-left: 3px; white-space: nowrap; }
    .lhead { font-size: 9.5px; } .lhead .ltrack span { font-size: 9.5px; font-weight: 700; color: #000; }
    .lcount .ltrack span { font-size: 8px; }
    .lbar, .lrow .ltrack, .lcount.total, .lsec h4, .sw { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .legend { font-size: 9.5px; margin-top: 4px !important; }
    .dayside { display: flex; gap: 8px; margin-top: 6px; break-inside: avoid; }
    .dayside .card { flex: 1; padding: 4px 8px; margin: 0; border: 1px solid #bbb; border-radius: 4px; font-size: 10px; }
    .dayside h3 { font-size: 11px; margin-bottom: 2px; } .dayside ul { columns: 2; }
  }
  /* ---- tabelle: la riga dei titoli resta visibile scorrendo ---- */
  .list thead th { position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -1px 0 var(--line); }
  @media (min-width: 761px) {
    /* su PC scorre la pagina e i titoli si fermano sotto la barra verde */
    .card:has(> table.list), .card > div:has(> table.list) { overflow: visible; }
    .list thead th { top: var(--hdr, 56px); }
    .card:has(> table.list) .list thead th:first-child { border-top-left-radius: 12px; }
    .card:has(> table.list) .list thead th:last-child { border-top-right-radius: 12px; }
  }
  @media (max-width: 760px) {
    /* su telefono la tabella scorre nel suo riquadro: titoli fermi in alto e nomi fermi a sinistra */
    .card:has(> table.list), .card > div:has(> table.list) { overflow: auto; max-height: calc(100dvh - var(--hdr, 100px) - 56px); -webkit-overflow-scrolling: touch; }
    main > .card:last-child:has(> table.list) { position: sticky; top: calc(var(--hdr, 100px) + 8px); }
    .list td:first-child, .list th:first-child { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: inset -1px 0 0 var(--line); }
    .list thead th:first-child { z-index: 3; background: #fafafa; box-shadow: inset -1px -1px 0 var(--line); }
    .list tr.group td:first-child { background: var(--green-soft); } .list tr.sel td:first-child { background: var(--err); }
  }
  @media print { .list thead th { position: static; } }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand">🗓 Orari</div>
  <nav id="nav"></nav>
  <div id="sync" class="sync"></div>
</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="no-print"></div>

<script src="turni-storico.js?v=202610311759"></script>
<script src="turni-core.js?v=202610311759"></script>
<!-- file con i dati reali del personale: esiste solo sul computer del manager, online non c'è (e l'app parte vuota) -->
<script src="privato/turni-privato.js" onerror="this.remove()"></script>
<script src="turni-data.js?v=202610311759"></script>
<script src="turni-cloud-config.js?v=202610311759"></script>
<script src="turni-cloud.js?v=202610311759"></script>
<script src="turni-cripto.js?v=202610311759"></script>
<script src="lineare-ufficiale.js?v=202610311759"></script>
<script>
'use strict';
const T = window.Turni;
const KEY = 'turni-familyfood-v1';
const VIEWS = [['turni', 'Turni'], ['giornaliero', 'Giornaliero'], ['previsioni', 'Previsioni'], ['personale', 'Personale'], ['formazione', 'Formazione'], ['aperture', 'Aperture e chiusure'], ['doppi', 'Doppi'], ['ferie', 'Ferie e malattie'], ['richieste', 'Richieste'], ['regole', 'Regole']];
const TIME_OPTIONS = []; for (let m = 6 * 60; m <= 23 * 60; m += 15) TIME_OPTIONS.push(m);

// ---------- stato (salvato nel browser) ----------
let storageOk = true;
let state = loadState();
const ui = { view: 'turni', ws: T.mondayOf(T.todayDay()), day: T.todayDay(), type: 'CREW', deleteMode: false, selected: new Set(), draft: null };
// Aperta dall'app "Turni" (sezione Manager, ?s = locale) o installata: finché non si entra con la password
// dei manager non si vede niente (né menu né dati), solo la schermata di accesso, che non si può chiudere.
const APP_STORE = new URLSearchParams(location.search).get('s');
const APP_MODE = !!APP_STORE || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
ui.locked = APP_MODE && TurniCloud.configured() && !TurniCloud.loggedIn();

// Se il browser non permette di salvare (es. navigazione privata) l'app funziona lo stesso, ma senza memoria.
function loadState() {
  try { const s = JSON.parse(window.localStorage.getItem(KEY)); if (s && Array.isArray(s.employees)) return TurniData.migrate(s); } catch (e) { storageOk = false; }
  return TurniData.sampleState();
}
function saveLocal() {
  try { window.localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
}
/** Ogni modifica: salva nel browser e (se collegato) anche online, pochi secondi dopo. */
function save() { saveLocal(); cloudTouch(); }
const newId = () => state.nextId++;
const empById = (id) => state.employees.find((e) => e.id === id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeSelect = (value, onchange) =>
  `<select onchange="${onchange}">${TIME_OPTIONS.map((t) => `<option value="${t}" ${t === value ? 'selected' : ''}>${T.fmtTime(t)}</option>`).join('')}</select>`;
const sortByName = (list) => [...list].sort((a, b) => T.fullName(a).localeCompare(T.fullName(b), 'it'));

// ---------- navigazione ----------
const INFO = {
  'previsioni': [`Previsioni`, `Per ogni giorno: vendite previste, clienti (GC) e <b>Ore totali</b>.<br><br><b>Ore totali</b> = le ore di lavoro del giorno come nel totale del lineare (hospitality + crew + doppi turni), <b>senza le ore manager</b>. Corrispondono alle "Crew Hours" aziendali tolte le ore manager.<br><br>Il generatore toglie le ore hospitality tipiche di quel giorno (media delle 4 settimane prima) e distribuisce le ore che restano tra i crew nelle fasce; le hospitality seguono le loro fasce in Regole. I giorni senza Ore totali usano i minimi di Regole.`],
  'prev-auto': [`Previsioni automatiche`, `Vendite e GC segnati <b>auto</b> sono calcolati in automatico dallo storico di SmartBusiness, aggiornato ogni giorno.<br><br>Il calcolo mette insieme più metodi (la previsione di SmartBusiness, la media delle ultime settimane, lo stesso periodo dell'anno scorso) e dà più peso a quelli che nelle ultime 8 settimane hanno sbagliato meno: più giorni di storico ci sono, più diventa preciso.<br><br>Le <b>Ore totali</b> segnate <b>stima</b> sono calcolate dai GC previsti, con il rapporto ore/clienti imparato dai giorni in cui le hai scritte tu (ultime 8 settimane; senza dati: 8,6 ore ogni 100 GC, dal lineare reale). Se cambi i GC a mano, la stima si aggiorna.<br><br>Se cambi un valore a mano, resta il tuo: gli aggiornamenti automatici non lo sovrascrivono. Più settimane correggi, più la stima delle Ore totali diventa precisa.<br><br><b>Settimane già pianificate:</b> quando una settimana ha dei turni, i suoi numeri restano fermi; si aggiornano solo le settimane ancora da fare (e la colonna GC SmartBusiness, solo come confronto).<br><br><b>Per canale:</b> clicca il giorno (▸) per vedere vendite e GC divisi tra Kiosk, McCafé e Front, con le quote medie delle ultime 4 settimane per lo stesso giorno.`],
  'eventi': [`Eventi e chiusure`, `Qui segni i giorni diversi dal solito. Le previsioni di quei giorni si correggono da sole, e di conseguenza le Ore totali e i turni.<br><br><b>🔒 Chiusura totale</b> (festività, inventario): vendite, GC e ore a zero; il generatore non mette turni e conta quel giorno come una giornata di ferie per tutti.<br><b>🕒 Chiusura parziale</b> (manutenzione, chiusura anticipata): le previsioni calano della quota di clienti che di solito entra in quelle ore; niente turni e niente minimi in quegli orari.<br><b>⭐ Evento o ricorrenza</b> (Black Friday, promozioni, festa locale): l'effetto si calcola dallo storico, guardando come sono andate le stesse giornate negli anni passati (date di confronto). Puoi anche scrivere tu la %.<br><b>🏬 Novità in zona</b> (nuovo negozio vicino, cantiere, nuova zona commerciale): indichi tu la % per il periodo; dopo qualche settimana le previsioni la imparano da sole dai dati.<br><br><b>Eventi di più giorni:</b> puoi dare una % diversa a ogni giorno (es. apertura +65% il primo giorno, +20% in settimana, +50% nel weekend) con "Riempi veloce" o giorno per giorno.<br><br><b>Dove si vede l'effetto:</b> sotto vendite e GC in Previsioni (⭐ +434 (+60%)), nel lineare (riquadro Previsione e righe "GC previsti" e "di cui evento" ora per ora) e in testa al lineare stampato.<br><br>Con un evento il calcolo parte dalla previsione "normale" delle ultime settimane, così l'effetto non viene contato due volte. I valori scritti a mano restano i tuoi.<br><br><b>Suggeriti dallo storico</b>: festività in cui il locale è stato chiuso negli ultimi due anni e giorni che l'anno scorso hanno avuto almeno il 30% di clienti in più.`],
  'formazione': [`Formazione`, `Segna in quali postazioni è formato ogni crew e ogni hospitality: il generatore mette le persone solo dove sono formate. Chi può <b>aprire</b> si segna nella sezione <a href="#" onclick="closeModal();go('aperture');return false">Aperture</a>.`],
  'aperture': [`Aperture e chiusure`, `Segna chi è formato per <b>aprire</b> (dalle 7:30) e per <b>chiudere</b> (alle 21:30) ogni postazione. Il generatore sceglie solo tra queste persone, crew o hospitality, e non sposta mai chi ha un orario fisso.`],
  'doppi': [`Doppi`, `Indica chi fa il turno doppio (un secondo turno nello stesso giorno, ore in più rispetto al contratto) e quanti giorni a settimana.
  I numeri di partenza vengono dagli orari reali delle settimane 38–44: controllali. Il generatore mette i doppi solo a queste persone, nei rush di pranzo o cena e preferibilmente sabato e domenica. <b>Chi apre</b> (turno delle 7:30) quel giorno non fa il doppio.`],
  'ferie': [`Ferie e malattie`, `Inserisci ferie, malattie, infortuni e assenze. In quei giorni la persona non può avere turni (il generatore non la usa) e le ore da fare in quella settimana calano della quota giornaliera (18h su 6 giorni lavorativi → 3h per giorno). Una malattia o un infortunio in corso si può inserire anche a settimana già fatta: i suoi turni di quei giorni diventano errori da coprire (usa 🛠 Risolvi problemi).`],
  'fasce': [`Fasce di copertura`, `Numero minimo di persone presenti per tutta la durata della fascia, giorno per giorno (0 = nessun minimo). Nei giorni con le Ore totali (sezione Previsioni), i minimi delle fasce senza postazione (rush, picchi, intermedi) vengono ricavati dalle Ore totali, tolte le ore hospitality. I valori iniziali vengono dagli orari reali delle settimane 39–44. Contano crew e hospitality messe in una postazione crew (non quelle in sala). Con una postazione indicata contano solo i presenti in quella postazione; con "Solo formati apertura" solo chi è segnato nella sezione Aperture.<br><br>Le fasce segnate <b>"consiglio"</b> (es. Postazione MFY) non sono obbligatorie: il generatore cerca di rispettarle, ma se mancano compaiono in <b>giallo</b> tra gli avvisi, non in rosso tra gli errori.`],
  'richieste': [`Richieste del personale`, `I dipendenti, dall'app del personale (con il loro nome utente e password), chiedono un turno compatibile con i loro impegni (es. "concerto alle 21:00"). Per ognuna il generatore propone un turno; tu accetti, modifichi o rifiuti. <b>Niente cambia nei turni finché non accetti.</b> Le accettate vengono rispettate da "Genera turni" e dai controlli.`],
  'cfg-crewMaxWeekday': [`Max ore turno Crew lun–gio`, `Durata massima di un turno normale di un crew da <b>lunedì a giovedì</b> (di solito 4h). Ognuno può fare ogni tanto un turno più lungo: vedi "Turni lunghi lun–gio a testa a settimana". Il doppio non conta: ha il suo limite.`],
  'cfg-crewMax': [`Max ore turno Crew (turni lunghi e ven–dom)`, `Durata massima di un turno di un crew da <b>venerdì a domenica</b> e dei <b>turni lunghi</b> da lunedì a giovedì (di solito 5h). Il doppio non conta: ha il suo limite.`],
  'cfg-hospMax': [`Max ore turno Hospitality`, `Durata massima di un turno di un'hospitality, tutti i giorni.`],
  'cfg-minShift': [`Turno minimo`, `Un turno più corto di così viene segnalato tra gli avvisi (es. 2h: un turno 12:00–13:30 dà un avviso). Il generatore non crea turni più corti.`],
  'cfg-rest11': [`Stacco tra giorni consecutivi`, `Ore minime tra la fine di un turno e l'inizio del turno del <b>giorno dopo</b>. Con 11h: chi chiude alle 21:30 il giorno dopo non può entrare prima delle 8:30, quindi non può aprire alle 7:30.`],
  'cfg-rest36': [`Stacco con riposo in mezzo`, `Se tra due turni c'è un <b>giorno di riposo</b>, tra la fine del primo e l'inizio del secondo servono almeno queste ore. Con 36h: chi chiude martedì alle 21:30 e riposa mercoledì, giovedì può entrare dalle 9:30 (non aprire alle 7:30).`],
  'cfg-longpw': [`Turni lunghi lun–gio a testa a settimana`, `Quanti turni più lunghi del massimo standard (es. 5h invece di 4h) può fare ogni crew da lunedì a giovedì. Vanno <b>a rotazione</b>: il generatore li dà prima a chi ne ha fatti meno nelle 4 settimane precedenti. I turni lunghi devono coprire il picco del pranzo o della cena.`],
  'cfg-doubleMax': [`Durata massima doppio`, `Il doppio è un secondo turno nello stesso giorno (ore in più rispetto al contratto). Questa è la sua durata massima (es. 3h). Chi fa i doppi e quanti si decide nella sezione Doppi.`],
  'cfg-doubleGap': [`Pausa minima turno–doppio`, `Ore minime di pausa tra il turno normale e il doppio dello stesso giorno (es. 2h: turno 7:30–11:00 e doppio non prima delle 13:00). Chi apre non fa il doppio.`],
  'cfg-closeGrace': [`Ultimi minuti non controllati prima della chiusura`, `Negli ultimi minuti prima della chiusura (es. tra le 21:00 e le 21:30) i minimi delle fasce non vengono controllati: in quel momento c'è solo la squadra di chiusura. La squadra di chiusura invece si controlla fino alle 21:30, e chi è in formazione non può restare da solo.`],
  'cfg-requestMargin': [`Richieste: fine turno prima di un impegno`, `Quando un dipendente chiede "ho un impegno alle…", il turno deve finire almeno queste ore prima (es. 2h: concerto alle 21:00 → turno finito entro le 19:00). Quando accetti la richiesta puoi comunque cambiare l'orario.`],
  'cfg-aft': [`Post-rush pomeriggio`, `Fascia del pomeriggio tra i due rush (es. 14:30–19:00). Qui il generatore non mette turni "rigidi" tutti dentro questa fascia (es. 14:30–19:30) né turni "ibridi" a cavallo (es. 15:30–20:30): preferisce turni sfalsati che si agganciano ai rush, per esempio 13:00–17:00 e poi 17:00–21:00.`],
  'cfg-pre': [`Chi fa la cena entra dalle`, `Ora più presto in cui entra chi lavora per la cena (es. 16:30). Così i turni di cena non partono nel mezzo del pomeriggio.`],
  'cfg-orario': [`Orario del locale`, `Apertura e chiusura del locale (es. 7:30–21:30). Il generatore non mette turni fuori da quest'orario.`],
  'col-nome': [`Fascia di copertura`, `Ogni riga è una fascia oraria (es. "Rush pranzo 12:00–15:00") con il numero minimo di persone che devono essere presenti per tutta la sua durata. Puoi cambiarne nome e orari, aggiungerne o eliminarne.`],
  'col-min': [`Minimo per giorno`, `Quante persone servono come minimo, da lunedì a domenica (0 = nessun minimo quel giorno). Si conta il momento più scoperto della fascia. Nei giorni con le Ore totali (sezione Previsioni) i minimi delle fasce <b>senza</b> postazione (rush, picchi, intermedi) vengono ricavati dalle Ore totali, tolte le ore hospitality.`],
  'col-post': [`Postazione`, `<b>Qualsiasi crew</b>: contano tutti i crew presenti, in qualunque postazione.<br><b>Una postazione</b> (MFY, OA, McCafé, Sala, Hospitality): contano solo le persone messe in quella postazione. Per la Sala contano anche le hospitality.`],
  'col-ap': [`Solo formati apertura`, `Se è spuntato, nella fascia contano solo le persone segnate per <b>aprire</b> quella postazione (sezione Aperture e chiusure). Serve per le fasce di apertura (7:30). Si può spuntare solo se hai scelto una postazione.`],
  'col-ch': [`Solo formati chiusura`, `Se è spuntato, nella fascia contano solo le persone che possono <b>chiudere</b> quella postazione (sezione Aperture e chiusure: se per una postazione non hai segnato nessuno, possono chiudere tutti i formati in quella postazione). Serve per le fasce di chiusura. Si può spuntare solo se hai scelto una postazione.`],
  'col-esatta': [`Squadra esatta`, `In un certo momento devono esserci <b>esattamente</b> il numero di persone indicato in quella postazione: né di meno, né di più (nelle altre fasce il numero è solo un minimo).<br><br><b>all'inizio</b>: esatto all'ora d'inizio della fascia. Es. aperture: alle 7:30 esattamente 1 McCafé e 1 MFY, nessun altro.<br><b>alla fine</b>: esatto all'ora di fine. Es. chiusure: alle 21:30 da lunedì a giovedì restano esattamente 1 McCafé, 1 Sala e 2 MFY (ven–dom 1, 2 e 3); se ne restano di più è un errore.<br><b>no</b>: il numero è solo un minimo.<br><br>Si può scegliere solo dopo aver scelto una <b>postazione</b> (con "Qualsiasi crew" il menu è grigio). Chi è in formazione può esserci in più.`],
};
/** Pulsante ⓘ: apre la spiegazione in una finestrella. */
const ib = (key) => (INFO[key] ? `<button type="button" class="ib" title="Spiegazione" aria-label="Spiegazione" onclick="event.preventDefault();event.stopPropagation();showInfo('${key}')">i</button>` : '');
function showInfo(key) { const [t, h] = INFO[key]; showModal(`<h3>ⓘ ${t}</h3><p style="line-height:1.55">${h}</p><div class="actions"><button class="btn primary" onclick="closeModal()">Ho capito</button></div>`); }
function go(view) { ui.view = view; ui.deleteMode = false; ui.selected.clear(); render(); }
// Telefono e tablet (schermo touch, senza mouse): solo il lineare e le richieste; il resto si fa dal PC.
const COMPACT = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
const compactOn = () => COMPACT && !ui.showAll;
const COMPACT_VIEWS = ['giornaliero', 'richieste'];
if (COMPACT) { ui.view = 'giornaliero'; try { ui.showAll = localStorage.getItem('turni-tutto') === '1'; } catch (e) { /* niente */ } }
function setShowAll(v) { ui.showAll = v; try { localStorage.setItem('turni-tutto', v ? '1' : '0'); } catch (e) { /* niente */ } if (!v && !COMPACT_VIEWS.includes(ui.view)) ui.view = 'giornaliero'; render(); window.scrollTo(0, 0); }
function renderBrand() {
  const n = (state.config && state.config.storeName) || '';
  document.getElementById('brand').textContent = n ? `🗓 Orari · ${n}` : '🗓 Orari';
  document.title = n ? `Orari · ${n}` : 'Pianificatore turni';
}
// altezza reale della barra verde (su telefono è più alta): i titoli delle tabelle si fermano subito sotto
function setHeaderHeight() { document.documentElement.style.setProperty('--hdr', document.querySelector('header').offsetHeight + 'px'); }
window.addEventListener('resize', setHeaderHeight);
function render() {
  if (ui.locked) return renderGate();
  renderBrand(); renderSync();
  const pending = (state.requests || []).filter((q) => q.status === 'in attesa').length;
  if (compactOn() && !COMPACT_VIEWS.includes(ui.view)) ui.view = 'giornaliero';
  document.getElementById('nav').innerHTML = VIEWS.filter(([k]) => !compactOn() || COMPACT_VIEWS.includes(k)).map(([k, l]) => `<button class="${ui.view === k ? 'active' : ''}" onclick="go('${k}')">${l}${k === 'richieste' && pending ? ` <span class="badge">${pending}</span>` : ''}</button>`).join('');
  const views = { turni: renderTurni, giornaliero: renderGiornaliero, previsioni: renderPrevisioni, personale: renderPersonale, formazione: renderFormazione, aperture: renderAperture, doppi: renderDoppi, ferie: renderFerie, richieste: renderRichieste, regole: renderRegole };
  document.getElementById('app').innerHTML =
    (storageOk ? '' : '<div class="notice warn" style="margin-bottom:12px">Questo browser non permette di salvare: le modifiche si perdono chiudendo la pagina. Prova ad aprirla con Safari o Chrome, non in navigazione privata.</div>') +
    views[ui.view]() +
    (COMPACT ? `<p class="small muted" style="text-align:center;margin:24px 0 0">${compactOn() ? 'Su telefono e tablet ci sono solo Giornaliero e Richieste: la generazione dei turni e le altre sezioni si usano dal PC. <button class="link" onclick="setShowAll(true)">Mostra comunque tutte le sezioni</button>' : '<button class="link" onclick="setShowAll(false)">Torna alla versione per telefono e tablet</button>'}</p>` : '');
  setHeaderHeight();
}
function showModal(html) { document.getElementById('modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { document.getElementById('modal').innerHTML = ''; ui.draft = null; if (sync.pendingRender) { sync.pendingRender = false; render(); } }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ================= TURNI =================
function renderTurni() {
  const ctx = T.makeCtx(state, ui.ws);
  const vs = T.validate(ctx);
  const cellV = new Map();
  vs.forEach((v) => { if (v.emp != null && v.day != null) { const k = v.emp + '|' + v.day; if (!cellV.has(k)) cellV.set(k, []); cellV.get(k).push(v); } });
  const later = ctx.employees.filter((e) => e.type === ui.type && e.startDate != null && e.startDate > ui.ws + 6);
  const emps = sortByName(ctx.employees.filter((e) => e.type === ui.type && !later.includes(e)));
  const nErr = vs.filter((v) => v.sev === 'ERROR').length, nWarn = vs.length - nErr;
  const cfg = state.config;

  const head = `<tr><th class="name">Dipendente</th>${ctx.days.map((d) => `<th><button class="link" title="Apri il lineare di questo giorno" onclick="openDaily(${d})">${T.shortDate(d)} ↗</button>${evTags(d) ? `<div>${evTags(d)}</div>` : ''}</th>`).join('')}<th>Ore</th></tr>`;
  const covList = state.coverage.filter((r) => (ui.type === 'HOSPITALITY') === (r.station === 'HOSPITALITY'));
  const cov = covList.map((req) => `<tr class="cov"><td class="name">${esc(req.name)}${req.soft ? ' <span class="small">· consiglio</span>' : ''} <span class="small">(${T.fmtTime(req.start)}–${T.fmtTime(req.end)})</span></td>${
    ctx.days.map((d) => { const need = T.reqMin(req, d); if (!need) return '<td class="c">—</td>'; const c = T.coverageMin(ctx, d, req); return `<td class="c ${c >= need ? 'okc' : req.soft ? 'soft' : 'bad'}" title="Presenti nel momento più scoperto / minimo richiesto (gli ultimi minuti prima della chiusura non contano)">${c}/${need}</td>`; }).join('')}<td></td></tr>`).join('');
  const rows = emps.map((e) => {
    const w = T.worked(ctx, e.id), t = T.target(ctx, e), dw = T.doubleWorked(ctx, e.id);
    return `<tr><td class="name" title="${esc(T.TYPES[e.type])} · ${T.fmtDur(e.weeklyMinutes)}/sett.${e.trainee ? ' · in formazione' : ''}">${esc(T.fullName(e))}${ctx.days.some((d) => T.isTrainee(e, d)) ? ' 🎓' : ''}</td>${ctx.days.map((d) => cellHtml(ctx, e, d, cellV.get(e.id + '|' + d))).join('')}
      <td class="tot ${w > t ? 'over' : w < t ? 'under' : 'exact'}">${T.fmtDur(w)}<div class="sub">su ${T.fmtDur(t)}${dw ? ` · +${T.fmtDur(dw)} doppi` : ''}</div></td></tr>`;
  }).join('');

  const probs = vs.map((v, i) => {
    const click = v.emp != null && v.day != null;

  }).join('') || '<p class="muted">Nessun problema: la settimana rispetta tutte le regole. 🎉</p>';

  return `
  <div class="toolbar">
    <button class="btn" onclick="moveWeek(-1)">◀</button>
    <div class="week">${T.weekLabel(ui.ws)}</div>
    <button class="btn" onclick="moveWeek(1)">▶</button>

    <button class="btn" onclick="askClearWeek()">Svuota settimana</button>
    <button class="btn" ${nErr ? '' : 'disabled title="Nessun errore da risolvere"'} style="${nErr ? 'border-color:var(--err-ink);color:var(--err-ink)' : ''}" onclick="solveWeek()">🛠 Risolvi problemi</button>
    <button class="btn primary" onclick="askGenerate()">⚙ Genera turni</button>
  </div>
  ${ctx.forecast ? (() => { const fd = (k) => T.forecastDay((state.forecasts || {})[ui.ws], k) || {};
    return `<div class="notice info" style="margin-bottom:10px">📈 <b>Ore totali</b> <span class="small muted">(senza manager)</span>: ${DAYS7.map((k) => `${T.DOW_SHORT[k + 1]} ${fd(k).crewHours ? `<b>${fd(k).crewHours}h</b>` : '—'}`).join(' · ')} <button class="link" onclick="go('previsioni')">Previsioni</button></div>`; })() : ''}
  <details class="help card">

      <li>Ogni modifica viene controllata subito: le caselle diventano <b style="color:var(--err-ink)">rosse</b> (errore) o <b style="color:var(--warn-ink)">gialle</b> (avviso). Passa il mouse su una casella per leggere il motivo; l'elenco completo è a destra.</li>
      <li>Regole attuali: ore settimanali da contratto esatte (oltre = straordinario) · massimo ${T.fmtDur(cfg.crewMax)} al giorno per i crew e ${T.fmtDur(cfg.hospMax)} per le hospitality, doppi inclusi · turno minimo ${T.fmtDur(cfg.minShift)} · stacco ${T.fmtDur(cfg.rest11)} tra giorni consecutivi · ${T.fmtDur(cfg.rest36)} se in mezzo c'è un riposo · niente turni nei riposi fissi e nelle ferie.</li>

    <div class="card gridwrap"><table class="grid"><thead>${head}</thead><tbody>${cov}${rows || `<tr><td class="name" colspan="9">Nessun dipendente: aggiungili nella sezione Personale, oppure importa un file di dati (Regole → Dati).</td></tr>`}</tbody></table></div>

function cellHtml(ctx, e, d, vlist) {
  const sh = T.shiftsOf(ctx, e.id, d), ab = T.absenceOn(ctx, e.id, d), rest = T.isRest(e, d);
  const sev = vlist ? (vlist.some((v) => v.sev === 'ERROR') ? 'err' : 'warn') : '';
  let inner;
  if (sh.length) {
    inner = sh.slice().sort((a, b) => !!a.doppio - !!b.doppio || a.start - b.start).map((s) => `<div>${T.fmtTime(s.start)} ${T.fmtTime(s.end)}${s.doppio ? ' <b style="color:var(--warn-ink)" title="Doppio">D</b>' : ''}</div>`).join('') +
      (e.type === 'CREW' || sh.some((s) => s.station !== 'HOSPITALITY') ? `<div class="st">${sh.map((s) => T.STATIONS[s.station].short).join(' + ')}</div>` : '');
  } else if (!T.started(e, d)) inner = `<span class="abs" title="Data di inizio: ${T.itDate(e.startDate)}">entra il<br>${T.shortDate(e.startDate).split(' ')[1]}</span>`;
  else if (ab) { const ai = T.absenceInfo(ab.type); inner = `<span class="abs" style="background:${ai.color};color:${ai.ink};padding:2px 6px;border-radius:4px">${ai.label.toUpperCase()}</span>`; }
  else if (rest) inner = '<span class="rest">RIPOSO</span>';
  else inner = '<span class="empty">—</span>';
  const title = vlist ? vlist.map((v) => '• ' + v.msg).join('\n') : 'Clicca per modificare';
  return `<td class="cell ${sev} ${sh.some((s) => s.doppio) ? 'dbl' : ''}" title="${esc(title)}" onclick="openDay(${e.id},${d})">${inner}</td>`;
}

function moveWeek(n) { ui.ws += 7 * n; render(); }
function openFromProblem(empId, day) {
  const e = empById(empId); if (!e) return;
  if (e.type !== ui.type) { ui.type = e.type; render(); }
  openDay(empId, day);
}

// --- modifica giorno ---
function openDay(empId, day) {
  const e = empById(empId);
  const list = state.shifts.filter((s) => s.employeeId === empId && s.day === day).sort((a, b) => !!a.doppio - !!b.doppio || a.start - b.start)
    .map((s) => ({ start: s.start, end: s.end, station: s.station }));
  ui.draft = { empId, day, list };
  renderDayModal();
}
function defaultStation(e) { return e.type === 'HOSPITALITY' ? 'HOSPITALITY' : (T.CREW_STATIONS.find((s) => e.trainings.includes(s)) || 'FRONT'); }
function renderDayModal() {

  showModal(`

      ${!T.started(e, day) ? `<div class="notice err">Entra il ${T.itDate(e.startDate)}: prima di quella data non può avere turni.</div>` : ''}
      ${T.isRest(e, day) ? `<div class="notice info">È il suo giorno di riposo fisso.</div>` : ''}
      ${T.isTrainee(e, day) ? `<div class="notice warn">🎓 In formazione: in apertura e chiusura deve avere accanto un formato nella stessa postazione.</div>` : ''}
      ${boxes || '<div class="muted">Nessun turno in questo giorno.</div>'}
      ${list.length < 2 ? `<div><button class="btn" onclick="addDraftShift()">+ ${list.length ? 'Aggiungi doppio' : 'Aggiungi turno'}</button></div>` : ''}
      <div class="notice ${total > max ? 'err' : 'info'}">Turno: <b>${T.fmtDur(total)}</b> (massimo ${T.fmtDur(max)})${list[1] ? ` · Doppio: <b>${T.fmtDur(list[1].end - list[1].start)}</b> (massimo ${T.fmtDur(dMax)}, almeno ${T.fmtDur(dGap)} di pausa) · ${e.doubleDays ? `fa ${e.doubleDays} doppi a settimana` : 'non ha doppi previsti'}` : ''}</div>
      <div class="small muted">✓ = formato/a in quella postazione · 🔑 = formato/a per l'apertura · 🌙 = formato/a per la chiusura</div>

function addDraftShift() {
  const e = empById(ui.draft.empId), l = ui.draft.list;
  l.push(l.length ? { start: 18 * 60 + 30, end: 21 * 60 + 30, station: defaultStation(e) } : { start: 12 * 60, end: 15 * 60, station: defaultStation(e) });
  renderDayModal();
}
function saveDay() {
  const { empId, day, list } = ui.draft;
  state.shifts = state.shifts.filter((s) => !(s.employeeId === empId && s.day === day));
  list.forEach((s, i) => state.shifts.push({ id: newId(), employeeId: empId, day, start: s.start, end: s.end, station: s.station, doppio: i === 1 }));
  save(); closeModal(); render();
}

// --- generazione ---
function askGenerate() {
  const trained = (st) => state.employees.filter((e) => e.active && (e.openings || []).includes(st)).length;
  const missing = ['MCCAFE', 'CUCINA'].filter((st) => !trained(st)).map((st) => T.STATIONS[st].label);
  const warn = missing.length
    ? `<div class="notice warn" style="margin-top:12px">Nessuno risulta formato per l'apertura ${missing.join(' né ')}: quelle aperture non potranno essere coperte. Segnalo nella sezione <b>Aperture e chiusure</b>.</div>` : '';
  showModal(`
    <h3>Genera turni · ${T.weekLabel(ui.ws)}</h3>
    <p><b>Completa</b>: tiene i turni già inseriti e aggiunge quelli che mancano.<br><b>Da zero</b>: cancella tutti i turni della settimana e li ricrea.</p>
    <p class="muted small">Il generatore rispetta riposi fissi, orari fissi, ferie, massimo giornaliero, stacchi 11h/36h e ore da contratto distribuite su tutti i giorni lavorativi. Mette i doppi solo a chi li fa (sezione Doppi), nei rush e preferibilmente nel weekend.</p>
    ${warn}
    <div class="actions">
      <button class="btn" onclick="closeModal()">Annulla</button>
      <button class="btn" onclick="startGenerate(true)">Da zero</button>
      <button class="btn primary" onclick="startGenerate(false)">Completa</button>
    </div>`);
}
function startGenerate(fromScratch) {
  showModal('<h3>⚙ Sto generando i turni…</h3><p class="muted">Provo alcune varianti e tengo la migliore. Ci vuole qualche secondo.</p>');
  setTimeout(() => runGenerate(fromScratch), 30);
}
function runGenerate(fromScratch) {
  if (fromScratch) state.shifts = state.shifts.filter((s) => s.day < ui.ws || s.day > ui.ws + 6);
  // prova alcune varianti e tiene la migliore (meno errori, poi meno avvisi); ogni "Genera" dà varianti nuove
  ui.genCount = (ui.genCount || 0) + 1;
  let best = null;
  for (let k = 0; k < 4; k++) {
    const res = T.generate(T.makeCtx(state, ui.ws), { seed: ui.ws * 7919 + ui.genCount * 101 + k });
    const sc = scoreWeek(state.shifts.filter((s) => s.day >= ui.ws && s.day <= ui.ws + 6).concat(res.added));
    if (!best || sc.score < best.sc.score) best = { res, sc };
    if (sc.score === 0) break;
  }
  const res = best.res;
  res.added.forEach((s) => state.shifts.push({ ...s, id: newId() }));
  save(); render();
  const notes = best.sc.err ? res.notes : [];
  showModal(`<h3>Generazione completata</h3><p>Aggiunti <b>${res.added.length}</b> turni · <b style="color:${best.sc.err ? 'var(--err-ink)' : 'var(--green)'}">${best.sc.err} errori</b> · ${best.sc.warn} avvisi.</p>
    ${notes.length ? `<ul>${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul><p class="small muted">Prova <b>🛠 Risolvi problemi</b>: cerca altre soluzioni e ti spiega cosa non si può sistemare.</p>` : '<p>✅ Tutte le coperture e le ore sono state assegnate.</p>'}
    <div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
}
// --- risoluzione automatica ---
/** Valuta un insieme di turni per la settimana: meno errori è meglio, poi meno avvisi. */
function scoreWeek(weekShifts) {
  const tmp = { ...state, shifts: state.shifts.filter((s) => s.day < ui.ws || s.day > ui.ws + 6).concat(weekShifts) };
  const vs = T.validate(T.makeCtx(tmp, ui.ws));
  const err = vs.filter((v) => v.sev === 'ERROR').length;
  return { vs, err, warn: vs.length - err, score: err * 1000 + (vs.length - err) };
}
/** Suggerimento su cosa fare quando un problema non si può risolvere da solo. */
function hintFor(v) {
  const m = v.msg;
  if (v.rule === 'COVERAGE' && /apertura/i.test(m)) {
    const st = /McCafé/.test(m) ? 'MCCAFE' : 'CUCINA';
    const n = state.employees.filter((e) => e.active && (e.openings || []).includes(st)).length;
    return n ? `Solo ${n} ${n === 1 ? 'persona è segnata' : 'persone sono segnate'} per l'apertura ${T.STATIONS[st].label}: quel giorno non sono disponibili (riposo, ferie o chiusura la sera prima). Segnane altre in Aperture e chiusure.`
      : `Nessuno è segnato per l'apertura ${T.STATIONS[st].label}: segnalo nella sezione Aperture e chiusure.`;
  }
  if (v.rule === 'COVERAGE' && /Hospitality/.test(m)) return 'Le hospitality disponibili quel giorno non bastano: controlla riposi e ferie, oppure abbassa il minimo in Regole.';
  if (v.rule === 'COVERAGE' && /Chiusura/.test(m)) return 'Mancano persone che possono chiudere quella postazione quel giorno: segnane altre nella sezione Aperture e chiusure (o in Formazione), oppure cambia il minimo in Regole.';
  if (v.rule === 'COVERAGE') {
    const crew = state.employees.filter((e) => e.active && e.type === 'CREW' && !e.fixedShift);
    const resting = v.day != null ? crew.filter((e) => T.isRest(e, v.day)) : [];
    const avgRest = crew.length ? DAYS7.reduce((t, k) => t + crew.filter((e) => e.restDays.includes(k + 1)).length, 0) / 4 : 0; // i riposi sono da lun a gio
    const fc = (state.forecasts || {})[T.mondayOf(v.day ?? ui.ws)];
    if (resting.length > avgRest + 1) return `Quel giorno sono a riposo ${resting.length} crew (${resting.map(T.fullName).slice(0, 8).join(', ')}${resting.length > 8 ? '…' : ''}): sposta qualche riposo su un altro giorno da lunedì a giovedì${fc ? ', oppure rivedi le Ore totali di quel giorno' : ''}.`;
    return `Non ci sono abbastanza persone libere in quella fascia${fc ? ' per le Ore totali di quel giorno' : ''}: ${fc ? 'rivedi le Ore totali, ' : ''}abbassa il minimo in Regole o sposta un riposo.`;
  }
  if (v.rule === 'WEEKLY_HOURS' || v.rule === 'WORK_DAYS') return 'Le ore non entrano nei giorni disponibili con le regole attuali (stacchi, massimo giornaliero).';
  if (v.rule === 'TRAINEE') return 'Serve un formato nella stessa postazione: segna altre persone in Formazione.';
  return 'Va sistemato a mano cliccando la casella.';
}
function solveWeek() {
  showModal('<h3>🛠 Sto cercando la soluzione migliore…</h3><p class="muted">Provo a sistemare la settimana mantenendo i tuoi turni e a rigenerarla da zero in più varianti. Ci vuole qualche secondo.</p>');
  setTimeout(() => {
    const ws = ui.ws, other = (s) => s.day < ws || s.day > ws + 6;
    const current = state.shifts.filter((s) => !other(s));
    const before = scoreWeek(current);
    const tries = [];
    // A) ripara la settimana attuale: tiene i turni, completa e sposta quelli che servono
    for (const seed of [11, 12, 13]) {
      const ctx = T.makeCtx(state, ws);
      const r = T.generate(ctx, { seed: ws * 31 + seed, moveAll: true });
      tries.push({ how: 'Riparata mantenendo i tuoi turni (alcuni spostati di orario)', shifts: r.all.map((x) => ({ ...x })) });
    }
    // B) rigenera da zero in più varianti
    const empty = { ...state, shifts: state.shifts.filter(other) };
    for (let k = 1; k <= 8; k++) {
      const r = T.generate(T.makeCtx(empty, ws), { seed: ws * 7919 + 1000 + k + (ui.genCount || 0) * 17 });
      tries.push({ how: 'Rigenerata da zero', shifts: r.added.map((x) => ({ ...x })) });
    }
    let best = null;
    for (const t of tries) { t.res = scoreWeek(t.shifts); if (!best || t.res.score < best.res.score) best = t; }
    ui.solution = best;
    const better = best.res.score < before.score;

// ================= PREVISIONI =================
const DAYS7 = [0, 1, 2, 3, 4, 5, 6];
function fcOf(ws) {
  const f = (state.forecasts || {})[ws];

}
const parseNum = (v) => (v === '' || v == null ? null : Math.max(0, +String(v).replace(',', '.')) || null);
function setFc(k, field, v) {

  const chWasAuto = d.auto && d.crewHours != null && d.crewHours === d.auto.crewHours;
  d[field] = parseNum(v);
  if (field === 'crewHours') d.senzaManager = true; // scritte come Ore totali senza manager (dal 31/10/2026)
  // GC cambiati a mano: anche la stima delle Ore totali si ricalcola (se non era stata scritta a mano)
  if (field === 'gc' && chWasAuto && d.gc) { d.crewHours = Math.round(d.gc * chRatio()); d.auto.crewHours = d.crewHours; }
  state.forecasts[ui.ws] = f; save(); render();
}
/**
 * Ore totali (senza manager) per cliente, imparate dai giorni in cui il manager ha scritto a mano Ore totali e GC
 * (ultime 8 settimane con dati). Contano solo i valori scritti dopo il cambio di significato (d.senzaManager):
 * prima si scrivevano le Crew Hours aziendali, che comprendono i manager.
 * Senza dati: 0,086 (circa 8,6 ore ogni 100 GC, dal lineare reale: 126 ore − 37 manager per circa 1.030 GC).
 */
function chRatio() {
  let ch = 0, gc = 0, weeks = 0;
  for (const ws of Object.keys(state.forecasts || {}).map(Number).sort((a, b) => b - a)) {
    const days = fcOf(ws).days.filter((d) => d.crewHours > 0 && d.gc > 0 && d.senzaManager && !(d.auto && d.crewHours === d.auto.crewHours));
    if (!days.length) continue;
    days.forEach((d) => { ch += d.crewHours; gc += d.gc; });

/** Copia lo stesso valore su più giorni (es. lun–gio uguali). */
function fillFc(from, to) {

function copyFcPrev() { const p = (state.forecasts || {})[ui.ws - 7]; if (!p) return alert('La settimana precedente non ha previsioni.'); const f = fcOf(ui.ws - 7); f.days.forEach((d) => delete d.auto); state.forecasts[ui.ws] = f; save(); render(); }
/**
 * Previsioni automatiche (calcolate sul Mac dallo storico SmartBusiness): riempie Vendite e GC giorno per giorno
 * e stima le Crew Hours dai GC (rapporto imparato dai valori scritti a mano, vedi chRatio).
 * I valori cambiati a mano restano.

async function applyAutoForecasts(data) {
  if (!data || data.tipo !== 'previsioni-turni' || !data.giorni) throw new Error('Questo non è un file di previsioni automatiche.');
  if (TurniCloud.loggedIn()) await cloudPull(); // parte dai dati online più recenti
  state.forecasts = state.forecasts || {};
  const ratio = chRatio();
  // settimane con turni già fatti: i numeri restano fermi (si aggiornano solo GC SmartBusiness e quote per canale)
  const planned = new Set(state.shifts.map((s) => T.mondayOf(s.day)));
  // storico dei giorni speciali e clienti per ora: servono a stimare l'effetto di eventi e chiusure
  const old = state.autoForecast || {};
  state.autoForecast = { at: data.creato, upTo: data.datiFinoA, err: data.errori || {}, indici: data.indici || old.indici || null, profiloOrario: data.profiloOrario || old.profiloOrario || null };
  let n = 0, manual = 0, locked = 0;

        if (!d.auto.orig) { d.auto.orig = { gc: d.auto.gc ?? null, sales: d.auto.sales ?? null }; d.auto.base = p.base || null; }
      }

  if (e.tipo === 'PARZIALE' && !(e.a > e.da)) return alert('L\'orario di chiusura non è valido.');
  if (e.perGiorno) { for (const k of Object.keys(e.perGiorno)) if (k < e.dal || k > e.al || isNaN(e.perGiorno[k])) delete e.perGiorno[k]; if (!Object.keys(e.perGiorno).length || (e.tipo !== 'EVENTO' && e.tipo !== 'ZONA')) delete e.perGiorno; }
  if (e.tipo === 'ZONA' && (e.effetto == null || isNaN(e.effetto)) && !e.perGiorno) return alert('Indica l\'effetto in % (es. 20, o -10 se il nuovo negozio porterà via clienti), per tutto il periodo o giorno per giorno.');
  e.nome = e.nome.trim();
  delete e.confrontoAuto;
  state.eventi = state.eventi || [];
  if (e.id == null) { e.id = newId(); state.eventi.push(e); } else state.eventi = state.eventi.map((x) => (x.id === e.id ? e : x));
  ui.evDraft = null;
  refreshEvents(); save(); closeModal(); render();
  const shifts = e.tipo === 'CHIUSURA' ? state.shifts.filter((s) => s.day >= T.toDay(e.dal) && s.day <= T.toDay(e.al)).length : 0;
  if (shifts) alert(`Attenzione: in quei giorni ci sono già ${shifts} turni. Toglili dalla pagina Turni (compaiono come errore).`);
}

function saveEmployee(id) {
  const last = document.getElementById('f-last').value.trim();
  const minutes = T.parseHours(document.getElementById('f-hours').value);
  const err = document.getElementById('f-error');
  if (!last || minutes == null || minutes < 0 || minutes > 3600) { err.style.display = 'block'; err.textContent = 'Inserisci almeno il cognome e un numero di ore valido (es. 18 o 18,5).'; return; }
  const data = {
    lastName: last, firstName: document.getElementById('f-first').value.trim(),
    type: document.getElementById('f-type').value, weeklyMinutes: minutes,
    restDays: [...document.querySelectorAll('.f-rest:checked')].map((x) => +x.value),
    active: document.getElementById('f-active').checked,
    fixedShift: null,
    startDate: document.getElementById('f-start').value ? T.toDay(document.getElementById('f-start').value) : null,
  };
  if (document.getElementById('f-fixed').checked) {
    const fs = +document.getElementById('f-fstart').value, fe = +document.getElementById('f-fend').value;
    if (fe <= fs) { err.style.display = 'block'; err.textContent = "L'orario fisso deve finire dopo l'inizio."; return; }
    data.fixedShift = { start: fs, end: fe };
  }
  if (id) Object.assign(empById(id), data);
  else state.employees.push({ id: newId(), trainings: [], doubleDays: 0, ...data });
  save(); closeModal(); render();
}

async function doEncryptedExport() {
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value, err = document.getElementById('pw-err');
  if (a.length < 8) { err.style.display = 'block'; err.textContent = 'Usa almeno 8 caratteri.'; return; }
  if (a !== b) { err.style.display = 'block'; err.textContent = 'Le due password non coincidono.'; return; }
  const box = await TurniCripto.encrypt({ state, exportedAt: new Date().toISOString() }, a);
  const blob = new Blob([JSON.stringify(box)], { type: 'application/json' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'dati-cifrati.json';
  document.body.appendChild(link); link.click(); link.remove();
  showModal(`<h3>✅ File creato</h3><p>È stato scaricato <b>dati-cifrati.json</b> con ${state.employees.length} dipendenti e ${state.shifts.length} turni, cifrato con la tua password.</p>

}
/** Sul sito: se esiste dati-cifrati.json chiede la password e carica i dati. force = anche se ci sono già dati. */
async function loadFromSite(force) {

  ui.siteBox = box;
  showModal(`<h3>🔒 Dati del locale</h3>

// ================= SALVATAGGIO ONLINE =================
const sync = { status: 'off', msg: '', timer: null, busy: false, seq: 0, pendingRender: false };
const modalOpen = () => !!document.getElementById('modal').innerHTML;
const fmtWhen = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) + ' alle ' + d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }); };
function setSync(status, msg) { sync.status = status; sync.msg = msg || ''; renderSync(); }
// codice del locale per tornare all'app dei dipendenti (anche dall'app installata, dove non c'è il tasto "indietro")
const storeCode = () => APP_STORE || TurniCloud.uid() || (() => { try { return localStorage.getItem('turni-locale'); } catch (e) { return null; } })();
function renderSync() {
  const el = document.getElementById('sync'); if (!el) return;
  const back = APP_MODE && storeCode() ? `<button onclick="location.href='richieste.html?s=' + encodeURIComponent(storeCode())" title="Torna all'app dei dipendenti">← Dipendenti</button>` : '';
  if (!TurniCloud.loggedIn()) { el.innerHTML = back; return; }
  const t = { ok: '☁️ Salvato online', saving: '⏳ Salvataggio…', offline: '⚠️ Offline: salvo appena torna la rete', error: '⚠️ Non salvato online', conflict: '⚠️ Scegli quali dati tenere' }[sync.status] || '☁️ Online';
  el.innerHTML = `${back}<button class="${/offline|error|conflict/.test(sync.status) ? 'bad' : ''}" onclick="go('regole')" title="${esc(sync.msg || 'Salvataggio online')}">${t}</button><button onclick="cloudLogout()" title="Esci dall'area manager su questo dispositivo">Esci</button>`;
}
function cloudTouch() {
  if (!TurniCloud.loggedIn()) return;
  sync.seq++; TurniCloud.setDirty(true); setSync('saving');
  clearTimeout(sync.timer); sync.timer = setTimeout(() => cloudPush(), 1500);
}
/** Invia i dati online. base: vedi TurniCloud.push (undefined = ultima versione nota). */
async function cloudPush(base) {
  if (!TurniCloud.loggedIn()) return;
  clearTimeout(sync.timer);
  if (sync.busy) { sync.timer = setTimeout(() => cloudPush(base), 800); return; }
  if (base === undefined && !TurniCloud.session().dirty) { setSync('ok'); return; }
  sync.busy = true; const seq = sync.seq; setSync('saving');
  try {
    await TurniCloud.push(state, base);
    if (seq === sync.seq) { TurniCloud.setDirty(false); setSync('ok'); }
    else sync.timer = setTimeout(() => cloudPush(), 800); // altre modifiche nel frattempo
  } catch (e) { cloudError(e); } finally { sync.busy = false; }
}
function cloudError(e) {
  if (e.code === 'OFFLINE') { setSync('offline', e.message); if (TurniCloud.session() && TurniCloud.session().dirty) sync.timer = setTimeout(() => cloudPush(), 30000); }
  else if (e.code === 'CONFLICT') cloudConflict();
  else if (e.code === 'LOGGED_OUT') { setSync('off'); if (APP_MODE) { ui.locked = true; if (APP_STORE) loadGateLogin(APP_STORE); else { ui.gateLogin = ''; render(); } return; } render(); askCloudLogin(e.message); }
  else setSync('error', e.message);
}
/** Prende i dati online se sono cambiati (salvati da un altro dispositivo). */
async function cloudPull() {
  if (!TurniCloud.loggedIn() || sync.busy) return;
  if (TurniCloud.session().dirty) return cloudPush();
  sync.busy = true;
  try {
    const r = await TurniCloud.pull();
    if (r.changed) applyRemote(r.state, r.doc.updateTime);
    else if (!r.doc) { TurniCloud.setLastUpdate(null); TurniCloud.setDirty(true); sync.busy = false; return cloudPush(null); }
    setSync('ok');
  } catch (e) { cloudError(e); } finally { sync.busy = false; }
}
function applyRemote(st, updateTime) {
  state = TurniData.migrate(st); saveLocal();
  TurniCloud.setLastUpdate(updateTime); TurniCloud.setDirty(false);
  if (modalOpen()) sync.pendingRender = true; else render();
}
async function cloudConflict() {
  setSync('conflict');
  let r;
  try { r = await TurniCloud.pull(); } catch (e) { return cloudError(e); }
  if (!r.doc) return cloudPush(null);
  if (!r.changed) return cloudPush();
  ui.conflict = r;
  showModal(`<h3>⚠️ Dati modificati anche da un altro dispositivo</h3>
    <p>Mentre lavoravi qui, online sono stati salvati altri dati (da <b>${esc(r.doc.device || 'un altro dispositivo')}</b>, ${fmtWhen(r.doc.savedAt)}). Le due versioni non si possono unire: scegli quale tenere.</p>
    <p class="small muted">Online: ${r.state.employees.length} dipendenti, ${r.state.shifts.length} turni · Questo dispositivo: ${state.employees.length} dipendenti, ${state.shifts.length} turni.</p>
    <div class="actions"><button class="btn" onclick="conflictKeepLocal()">Tieni quelli di questo dispositivo</button><button class="btn primary" onclick="conflictKeepOnline()">Tieni quelli online</button></div>`);
}
function conflictKeepOnline() { const r = ui.conflict; ui.conflict = null; closeModal(); applyRemote(r.state, r.doc.updateTime); setSync('ok'); render(); }
function conflictKeepLocal() { const r = ui.conflict; ui.conflict = null; closeModal(); TurniCloud.setDirty(true); cloudPush(r.doc.updateTime); }

// ================= GIORNALIERO: MODIFICA TRASCINANDO (tablet, dito o mouse) =================
let drag = null;
const SNAP = 15;
function dragStart(ev) {
  const bar = ev.currentTarget, sid = +bar.dataset.sid, s = state.shifts.find((x) => x.id === sid);
  if (!s) return;
  ev.preventDefault(); bar.setPointerCapture(ev.pointerId);
  const track = bar.parentElement, row = track.parentElement;
  const mode = ev.target.classList.contains('hl') ? 'left' : ev.target.classList.contains('hr') ? 'right' : 'move';
  drag = { s, bar, row, mode, x0: ev.clientX, y0: ev.clientY, a: s.start, b: s.end, st: s.station, moved: false,
    pxPerMin: track.getBoundingClientRect().width / ui.dragGeo.span, tip: document.createElement('div'), target: null, swap: null, bar2: null };
  drag.tip.className = 'dragtip'; document.body.appendChild(drag.tip);
  bar.classList.add('dragging');
  bar.addEventListener('pointermove', dragMove); bar.addEventListener('pointerup', dragEnd); bar.addEventListener('pointercancel', dragEnd);
  dragMove(ev);
}
function dragMove(ev) {
  if (!drag) return;
  const cfg = state.config, OPEN = cfg.open ?? 450, CLOSE = cfg.close ?? 1290;
  const dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.moved = true;
  const dm = Math.round(dx / drag.pxPerMin / SNAP) * SNAP, len = drag.s.end - drag.s.start;
  let a = drag.s.start, b = drag.s.end;
  if (drag.mode === 'move') { a = Math.min(Math.max(OPEN, drag.s.start + dm), CLOSE - len); b = a + len; }
  if (drag.mode === 'left') a = Math.min(Math.max(OPEN, drag.s.start + dm), drag.s.end - 30);
  if (drag.mode === 'right') b = Math.max(Math.min(CLOSE, drag.s.end + dm), drag.s.start + 30);
  drag.a = a; drag.b = b;
  const { H0, span } = ui.dragGeo;
  drag.bar.style.left = (((a - H0 * 60) / span) * 100).toFixed(3) + '%';
  drag.bar.style.width = (((b - a) / span) * 100).toFixed(3) + '%';
  const ta = drag.row.querySelector('[data-t="a"]'), tb = drag.row.querySelector('[data-t="b"]');
  if (ta) ta.textContent = T.fmtTime(a); if (tb) tb.textContent = T.fmtTime(b);
  const vertical = drag.mode === 'move' && Math.abs(dy) > 18;
  // spostandosi in verticale: niente cambio d'orario, si sceglie una persona (scambio) o un'area
  if (vertical) { drag.a = drag.s.start; drag.b = drag.s.end; a = drag.a; b = drag.b; }
  // vicino al bordo alto/basso dello schermo la pagina scorre da sola (per raggiungere le altre righe e fasce)
  if (vertical) {
    const edge = 70;
    if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 18); else if (ev.clientY < edge) window.scrollBy(0, -18);
  }
  if (vertical) {
    drag.bar.style.left = (((a - ui.dragGeo.H0 * 60) / ui.dragGeo.span) * 100).toFixed(3) + '%';
    const ta2 = drag.row.querySelector('[data-t="a"]'), tb2 = drag.row.querySelector('[data-t="b"]');
    if (ta2) ta2.textContent = T.fmtTime(a); if (tb2) tb2.textContent = T.fmtTime(b);
  }
  // in verticale: striscia delle aree in alto + righe delle altre persone (scambio) + fasce (vista per area)
  document.querySelectorAll('.lsec.droptarget, .lrow.swaptarget, .dropbar span.on').forEach((x) => x.classList.remove('droptarget', 'swaptarget', 'on'));
  drag.target = null; drag.swap = null;
  if (vertical) {
    if (!drag.bar2) drag.bar2 = areaBar(drag.s);
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const chip = el && el.closest('.dropbar span'), row = el && el.closest('.lrow[data-rsid]'), sec = el && el.closest('.lsec[data-st]');
    if (chip) { if (chip.dataset.st !== drag.s.station) { chip.classList.add('on'); drag.target = chip.dataset.st; } }
    else if (row && +row.dataset.rsid !== drag.s.id) {
      const o = state.shifts.find((x) => x.id === +row.dataset.rsid);
      if (o && o.employeeId !== drag.s.employeeId && !o.doppio && !drag.s.doppio && !empById(o.employeeId).fixedShift && !empById(drag.s.employeeId).fixedShift) { row.classList.add('swaptarget'); drag.swap = o; } // chi ha l'orario fisso non si scambia
    } else if (sec && ui.groupBy === 'area' && sec.dataset.st !== drag.s.station) { sec.classList.add('droptarget'); drag.target = sec.dataset.st; }
  } else if (drag.bar2) { drag.bar2.remove(); drag.bar2 = null; }
  drag.tip.textContent = drag.swap ? `↔ scambia con ${T.fullName(empById(drag.swap.employeeId))}` : `${T.fmtTime(a)}–${T.fmtTime(b)}${drag.target ? ' → ' + T.STATIONS[drag.target].short : ''}`;
  drag.tip.style.left = ev.clientX + 'px'; drag.tip.style.top = ev.clientY + 'px';
}
function dragEnd() {
  if (!drag) return;
  const d = drag; drag = null;
  d.tip.remove(); d.bar.classList.remove('dragging'); if (d.bar2) d.bar2.remove();
  document.querySelectorAll('.lsec.droptarget, .lrow.swaptarget').forEach((x) => x.classList.remove('droptarget', 'swaptarget'));
  const s = d.s;
  if (!d.moved) return openDay(s.employeeId, s.day); // tocco senza trascinare: apre il turno
  if (d.swap) { // scambio del turno tra due persone (ognuno prende orario e area dell'altro)
    const o = d.swap, ea = s.employeeId, eb = o.employeeId;
    s.employeeId = eb; o.employeeId = ea; save(); render();
    return swapToast(s, o);
  }
  const st = d.target || s.station;
  if (d.a === s.start && d.b === s.end && st === s.station) return render();
  const before = { start: s.start, end: s.end, station: s.station };
  s.start = d.a; s.end = d.b; s.station = st;
  save(); render();
  shiftToast(s, before);

/** Barra in basso dopo una modifica: annulla, e (se la settimana è pubblicata) aggiorna subito l'app del dipendente. */
function shiftToast(s, before) {

function areaBar(s) {

// ================= ORARIO PUBBLICATO PER IL PERSONALE =================
// "Pubblica settimana": si fissa una copia dell'orario della settimana (quella che vedono i dipendenti) e per ogni
// dipendente con un accesso si manda online il suo orario, cifrato con la sua chiave personale (nome utente + password).
// Se dopo si modificano i turni, i dipendenti vedono la versione nuova solo quando si ripubblica.
function weekSnapshot(ws) {
  const ctx = T.makeCtx(state, ws), out = {};
  for (const e of ctx.employees) {
    const days = ctx.days.map((d) => {
      const sh = T.shiftsOf(ctx, e.id, d).map((s) => ({ a: s.start, b: s.end, st: s.station, dbl: !!s.doppio }));
      const ab = T.absenceOn(ctx, e.id, d), lim = T.limitOf(ctx, e.id, d);
      const tag = sh.length ? '' : !T.started(e, d) ? 'Non ancora in servizio' : ab ? T.absenceInfo(ab.type).label : T.isRest(e, d) ? 'Riposo' : 'Libero';
      return { d, sh, tag, note: lim ? 'Richiesta accettata: ' + lim.label : '' };
    });
    out[e.id] = { days, hours: T.worked(ctx, e.id) + T.doubleWorked(ctx, e.id), target: T.target(ctx, e) };
  }
  return out;
}
const pubOf = (ws) => (state.publishedWeeks || {})[ws];
const changedSincePublish = (ws) => { const p = pubOf(ws); return !!p && JSON.stringify(p.emp) !== JSON.stringify(weekSnapshot(ws)); };

  if (!TurniCloud.loggedIn()) return res;
  const weeks = Object.entries(state.publishedWeeks || {}).map(([k, w]) => [+k, w]).sort((a, b) => b[0] - a[0]).slice(0, 12);
  for (const e of state.employees.filter((x) => x.active && state.reqCreds[x.id] && (!ids || ids.includes(x.id)))) {
    const c = state.reqCreds[e.id];
    const mine = weeks.filter(([, w]) => w.emp[e.id]).map(([ws, w]) => ({ ws, at: w.at, note: w.note || '', ...w.emp[e.id],
      days: w.emp[e.id].days.map((x) => ((w.marks || {})[e.id + '|' + x.d] ? { ...x, mod: w.marks[e.id + '|' + x.d] } : x)) }));
    // le sue richieste con lo stato: così le vede da qualunque telefono o browser entri
    const reqs = (state.requests || []).filter((q) => q.employeeId === e.id).sort((a, b) => b.day - a.day).slice(0, 30)
      .map((q) => ({ rid: q.rid, kind: q.kind, date: T.toIso(q.day), to: q.to != null ? T.toIso(q.to) : undefined, time: q.time, from: q.from, slots: q.slots, note: q.note || '', status: q.status, risposta: q.reply || '' }));

  }
  return res;
}

      let x;

    state.reqCreds[id] = { user, pw, code, k, oid }; save();
