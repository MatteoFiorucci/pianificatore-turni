<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pianificatore turni</title>
<link rel="manifest" href="app-manager.webmanifest">
<meta name="theme-color" content="#1e5631">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni Manager">
<link rel="apple-touch-icon" href="icone/manager-180.png">
<link rel="icon" href="icone/manager-192.png">
<style>
  :root {
    --green: #1e5631; --green-soft: #d5eadb; --yellow: #ffc72c; --ink: #1d1d1f; --muted: #6b6b70;
    --line: #d9d9de; --bg: #f6f6f4; --err: #ffd3d6; --err-ink: #b3261e; --warn: #fff0c2; --warn-ink: #8a6100;
    --ok: #dcf0e1; --rest: #1e40af;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--green); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 5; }
  header .brand { font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  header .brand .m { background: var(--yellow); color: var(--green); border-radius: 6px; padding: 2px 8px; font-size: 18px; }
  nav { display: flex; gap: 4px; }
  nav button { background: transparent; border: 0; color: #d9eadf; font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.1); }
  nav button.active { background: var(--yellow); color: var(--green); }
  main { padding: 16px 20px 40px; }
  h2 { margin: 4px 0 12px; font-size: 20px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  button.btn, label.btn { font: inherit; font-weight: 600; border-radius: 8px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--ink); }
  button.btn:hover, label.btn:hover { border-color: #b9b9c0; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.danger { background: var(--err-ink); color: #fff; border-color: var(--err-ink); }
  button.link { background: none; border: 0; color: var(--green); font: inherit; font-weight: 600; cursor: pointer; padding: 0; }
  button:disabled { opacity: .45; cursor: default; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar .week { font-size: 17px; font-weight: 700; min-width: 210px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; font: inherit; padding: 7px 14px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--green-soft); color: var(--green); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; }
  .chip.err { background: var(--err); color: var(--err-ink); }
  .chip.warn { background: var(--warn); color: var(--warn-ink); }
  .chip.ok { background: var(--ok); color: var(--green); }
  .spacer { flex: 1; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .layout { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .gridwrap { overflow: auto; max-height: calc(100vh - 190px); }
  table.grid { border-collapse: separate; border-spacing: 0; width: 100%; }
  .grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; }
  .grid thead th { position: sticky; top: 0; background: #fafafa; z-index: 2; padding: 8px 6px; font-size: 13px; }
  .grid .name { position: sticky; left: 0; background: #fff; z-index: 1; text-align: left; padding: 6px 10px; min-width: 190px; font-weight: 600; white-space: nowrap; }
  .grid thead .name { z-index: 3; background: #fafafa; }
  .grid tr.cov td { background: #fbfbfb; font-size: 12px; }
  .grid tr.cov .name { font-weight: 500; color: var(--muted); background: #fbfbfb; }
  .grid tr.cov .c { text-align: center; font-weight: 700; padding: 4px; }
  .grid tr.cov .c.okc { color: var(--green); background: var(--ok); }
  .grid tr.cov .c.bad { color: var(--err-ink); background: var(--err); }
  .grid tr.cov .c.soft { color: var(--warn-ink); background: var(--warn); }
  td.cell { min-width: 96px; height: 50px; text-align: center; cursor: pointer; font-variant-numeric: tabular-nums; font-size: 13px; }
  td.cell:hover { outline: 2px solid var(--green); outline-offset: -2px; }
  td.cell.err { background: var(--err); }
  td.cell.warn { background: var(--warn); }
  td.cell .st { font-size: 10px; color: var(--muted); letter-spacing: .3px; }
  td.cell.dbl { box-shadow: inset 3px 0 0 var(--yellow); }
  .rest { color: var(--rest); font-weight: 600; font-size: 12px; }
  .abs { color: #777; font-weight: 700; font-size: 12px; }
  .empty { color: #c8c8cc; }
  td.tot { text-align: center; min-width: 80px; font-weight: 700; font-variant-numeric: tabular-nums; }
  td.tot .sub { font-weight: 400; font-size: 11px; color: var(--muted); }
  td.tot.over { background: var(--err); } td.tot.under { background: var(--warn); } td.tot.exact { background: var(--ok); }
  aside.problems { padding: 14px; max-height: calc(100vh - 190px); overflow: auto; }
  aside h3 { margin: 0 0 8px; font-size: 15px; }
  .prob { display: flex; gap: 8px; padding: 8px; border-radius: 8px; cursor: default; }
  .prob.click { cursor: pointer; } .prob.click:hover { background: #f3f3f5; }
  .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; flex: none; }
  .dot.ERROR { background: #d32f2f; } .dot.WARNING { background: #f9a825; }
  .prob .r { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  details.help { margin-bottom: 12px; padding: 10px 14px; }
  details.help summary { cursor: pointer; font-weight: 700; }
  details.help ul { margin: 8px 0 0; padding-left: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0 0; font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
  table.list { border-collapse: collapse; width: 100%; }
  .list th, .list td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .list th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: #fafafa; }
  .list tr.group td { background: var(--green-soft); color: var(--green); font-weight: 700; }
  .list tr.sel td { background: var(--err); }
  .list tr.clickable { cursor: pointer; } .list tr.clickable:hover td { background: #f6f8f6; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eee; font-size: 12px; margin-right: 4px; }
  .pill.on { background: var(--green-soft); color: var(--green); font-weight: 600; }
  label.tg { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; margin: 2px 4px 2px 0; user-select: none; background: #fff; }
  label.tg.on { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
  label.tg input { display: none; }
  .deletebar { position: sticky; bottom: 0; display: flex; gap: 8px; justify-content: flex-end; padding: 12px; background: #fff; border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
  .form { display: grid; gap: 12px; }
  .form .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .form label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  input.bad { border-color: var(--err-ink); }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .modal { background: #fff; border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 4px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .shiftbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .reqtag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: #e8eefc; color: #1e40af; font-size: 9.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; vertical-align: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  button.ib { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; background: none; color: var(--green); font: 700 12px/1 -apple-system, sans-serif; cursor: pointer; padding: 0; margin-left: 4px; vertical-align: 2px; text-transform: none; letter-spacing: 0; }
  button.ib:hover { background: var(--green); color: #fff; }
  th button.ib { width: 18px; height: 18px; font-size: 11px; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 999px; background: #e5484d; color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 2px; }
  .evtag { display: inline-block; padding: 0 7px; border-radius: 999px; background: #fff4d6; color: #7a5200; font-size: 11px; line-height: 18px; font-weight: 600; white-space: nowrap; }
  .evtag.closed { background: #e2e8f0; color: #334155; }
  .autotag { display: inline-block; padding: 0 6px; border-radius: 999px; background: #e6f0ff; color: #2456b3; font-size: 11px; line-height: 18px; margin-left: 4px; }
  .reqcard { padding: 14px 16px; margin-bottom: 12px; }
  .reqcard .when { font-weight: 700; font-size: 15px; }
  .reqcard .prop { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #f3f6f4; font-size: 13px; }
  /* iPhone ingrandisce da solo la pagina quando si tocca un campo con testo sotto i 16px: su telefono/tablet si usano 16px */
  @media (pointer: coarse), (max-width: 760px) { input, select, textarea { font-size: 16px !important; } }
  @media (max-width: 760px) {
    /* accessi del personale su telefono: una scheda per persona, con i pulsanti sotto */
    .card:has(> table.acc) { max-height: none !important; overflow: visible !important; position: static !important; }
    table.acc thead { display: none; }
    table.acc tr { display: block; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    table.acc td { display: inline-block; border: 0 !important; padding: 2px 8px 2px 0 !important; position: static !important; box-shadow: none !important; background: none !important; }
    table.acc td:first-child { display: block; }
    table.acc td:last-child { display: block; text-align: left !important; margin-top: 6px; }
  }
  /* ---- giornaliero: modifica trascinando (tablet) ---- */
  .sheet.editing .lrow:not(.lhead):not(.lcount) { min-height: 38px; }
  .sheet.editing .lrow:not(.lhead):not(.lcount) > div { font-size: 13px; }
  .lbar.drag { top: 4px; bottom: 4px; cursor: grab; touch-action: none; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .lbar.drag .hl, .lbar.drag .hr { position: absolute; top: 0; bottom: 0; width: 16px; cursor: ew-resize; }
  .lbar.drag .hl { left: -4px; } .lbar.drag .hr { right: -4px; }
  .lbar.drag .hl::after, .lbar.drag .hr::after { content: ''; position: absolute; top: 25%; bottom: 25%; left: 6px; width: 3px; border-radius: 2px; background: rgba(255,255,255,.85); }
  .lbar.dragging { opacity: .85; outline: 2px solid #111; z-index: 3; cursor: grabbing; }
  .lsec.droptarget h4 { outline: 3px solid #111; }
  .lrow.swaptarget { background: #fff3c4 !important; outline: 2px dashed #8a6100; outline-offset: -2px; }
  .dropbar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 26; display: flex; gap: 6px; background: #1d1d1f; padding: 8px; border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .dropbar span { padding: 10px 14px; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; border: 2px solid transparent; }
  .dropbar span.on { border-color: #fff; transform: scale(1.06); }
  .dragtip { position: fixed; z-index: 30; background: #111; color: #fff; font-weight: 700; font-size: 14px; padding: 4px 10px; border-radius: 8px; pointer-events: none; transform: translate(-50%, -130%); white-space: nowrap; }
  #toast .bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; background: #1d1d1f; color: #fff; border-radius: 14px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: calc(100vw - 24px); font-size: 14px; }
  #toast .bar button { font: inherit; font-weight: 700; border: 0; border-radius: 9px; padding: 7px 12px; cursor: pointer; background: #fff; color: #111; }
  #toast .bar button.go { background: var(--yellow); }
  .sync { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .sync button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .sync button.bad { background: #fde68a; color: #7c2d12; }
  .notice { padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .notice.err { background: var(--err); color: var(--err-ink); } .notice.info { background: #e8eefc; color: var(--rest); } .notice.warn { background: var(--warn); color: var(--warn-ink); }
  .section { padding: 16px; margin-bottom: 16px; }
  /* ---- adattamento a schermi piccoli e finestre ridotte ---- */
  html, body { overflow-x: clip; }
  header { flex-wrap: wrap; height: auto; min-height: 56px; row-gap: 4px; padding-top: 6px; padding-bottom: 6px; }
  header .brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  nav { overflow-x: auto; flex-wrap: nowrap; max-width: 100%; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  nav::-webkit-scrollbar { display: none; }
  nav button { white-space: nowrap; flex: none; }
  .sheet { min-width: 0; }
  .countwrap { overflow-x: auto; max-width: 100%; }
  .countwrap > .lsec { min-width: 640px; }
  .modal { max-width: calc(100vw - 24px); }
  .card:has(> table.list), .card > div:has(> table.list) { overflow-x: auto; }
  @media (max-width: 1180px) {
    header { gap: 4px 12px; }
    nav button { padding: 8px 10px; }
  }
  @media (max-width: 1024px) {
    .grid .name { min-width: 150px; max-width: 170px; white-space: normal; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
  }
  @media (max-width: 760px) {
    header { padding: 6px 10px; }
    header .brand { width: 100%; font-size: 14px; }
    nav { width: 100%; }
    nav button { padding: 6px 10px; font-size: 13px; }
    main { padding: 10px 10px 30px; }
    h2 { font-size: 18px; }
    .toolbar { gap: 6px; }
    .toolbar .week { min-width: 0; flex: 1 1 140px; font-size: 15px; }
    .grid .name { min-width: 112px; max-width: 128px; white-space: normal; font-size: 12px; padding: 4px 6px; line-height: 1.25; }
    .grid tr.cov .name .small { display: none; }
    .grid thead th { padding: 6px 3px; font-size: 12px; }
    td.cell { min-width: 76px; height: 46px; font-size: 12px; }
    td.tot { min-width: 62px; }
    .gridwrap, aside.problems { max-height: none; }
    .modal-bg { padding: 10px; align-items: flex-start; }
    .modal { padding: 14px; max-height: calc(100vh - 20px); }
    .form .row { gap: 8px; }
    .list th, .list td { padding: 7px 8px; }
    .sheet { padding: 10px 8px; }
    .daily .dayside .card { margin-bottom: 8px; }
  }

  /* ---- lineare giornaliero ---- */
  @media screen and (max-width: 900px) {
    .sheet .lrow { grid-template-columns: 36px 130px 40px 40px minmax(0, 1fr); font-size: 11.5px; }
  }
  @media screen and (max-width: 560px) {
    .sheet .lrow { grid-template-columns: 96px 36px 36px minmax(0, 1fr); font-size: 11px; min-height: 20px; }
    .sheet .lrow > div { padding: 2px 3px; }
    .sheet .lrow .lpos { display: none; }
    .sheet .lhead .ltrack span.odd { display: none; }
    .sheet .countwrap .lrow { grid-template-columns: 96px 72px minmax(0, 1fr); }
  }
  .daily { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .daily { grid-template-columns: minmax(0, 1fr); } }
  .sheet { padding: 12px 14px; }
  .lsec { margin-top: 12px; }
  .lsec h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .6px; text-transform: uppercase; color: var(--green); text-align: center; background: var(--yellow); border-radius: 4px; padding: 2px; }
  .lrow { display: grid; grid-template-columns: 62px 190px 46px 46px minmax(0, 1fr); align-items: stretch; min-height: 22px; border-bottom: 1px solid #eee; font-size: 12px; }
  .lrow > div { padding: 2px 4px; display: flex; align-items: center; }
  .lrow.click { cursor: pointer; } .lrow.click:hover { background: #f4f8f5; }
  .lrow .lpos { font-size: 10px; font-weight: 700; color: var(--muted); justify-content: flex-end; }
  .lrow .lname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lrow .ltime { font-variant-numeric: tabular-nums; justify-content: center; }
  .lrow .ltrack { position: relative; padding: 0; min-height: 20px;
    background-image: linear-gradient(to right, #cfcfd4 1px, transparent 1px), linear-gradient(to right, #ececf0 1px, transparent 1px);
    background-size: var(--hw) 100%, calc(var(--hw) / 4) 100%; }
  .lbar { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; opacity: .9; }
  .lhead { border-bottom: 2px solid var(--line); font-weight: 700; font-size: 11px; color: var(--muted); }
  .lhead .ltrack { background: #fafafa; }
  .lhead .ltrack span { position: absolute; top: 3px; transform: translateX(-50%); font-size: 10px; }
  .lcount .ltrack { display: flex; background: none; }
  .lcount .ltrack span { flex: 1; text-align: center; border-left: 1px solid var(--line); font-variant-numeric: tabular-nums; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .lcount.total { font-weight: 800; background: var(--green-soft); }
  .st-CUCINA { background: #d84a3a; } .st-FRONT { background: #2f80c0; } .st-MCCAFE { background: #7a4a2a; }
  .st-SERVIZIO { background: #8a8a8a; } .st-HOSPITALITY { background: #6c4bb5; } .st-MANAGER { background: #1f5f46; }
  .lbar .lbl { display: none; }
  .printhead { display: none; }
  .evimp { font-size: 11px; color: #7a5200; font-weight: 600; margin-top: 2px; }
  .lcount.gcrow { color: var(--green); font-weight: 600; } .lcount.evrow { color: #7a5200; }
  .dayside .card { padding: 12px; margin-bottom: 12px; } .dayside h3 { margin: 0 0 6px; font-size: 14px; }
  .dayside ul { margin: 0; padding-left: 18px; } .dayside li { margin: 2px 0; }
  @media print {
    /* margine della pagina a zero: così il browser non stampa intestazione e piè di pagina (titolo, indirizzo, data, numero di pagina) */
    @page { size: A4 portrait; margin: 0; }
    header, .toolbar, .no-print, #modal { display: none !important; }
    body { background: #fff; margin: 0; } main { padding: 8mm; }
    /* lineare stampato: solo griglia, ore e aree; in testa la previsione, sotto riposi e assenze */
    .daily { display: block; } .card { border: 0; box-shadow: none; }
    .sheet { padding: 0; }
    .printhead { display: block; font-size: 11px; margin: 2px 0 4px; padding: 3px 6px; border: 1px solid #999; border-radius: 4px; }
    .print-hide, .pdot, .reqtag, .evimp { display: none !important; }
    .lsec { margin-top: 3px; break-inside: avoid; }
    .lsec h4 { font-size: 9px; padding: 0; margin-bottom: 1px; }
    .lrow { grid-template-columns: 26px 140px 30px 30px 1fr; font-size: 8.5px; min-height: 11px; border-bottom: 1px solid #ccc; }
    .lhead .ltrack span.odd { display: inline; }
    .lrow > div { padding: 0 3px; }
    .lrow .lname { font-weight: 700; }
    .lrow .ltrack { min-height: 11px; }
    .lbar { top: 1px; bottom: 1px; opacity: 1; border-radius: 2px; display: flex; align-items: center; overflow: hidden; }
    .lbar .lbl { display: block; color: #fff; font-size: 7px; font-weight: 800; padding-left: 3px; white-space: nowrap; }
    .lhead { font-size: 8px; } .lhead .ltrack span { font-size: 8px; font-weight: 700; color: #000; top: 1px; }
    .lcount .ltrack span { font-size: 7.5px; }
    .lbar, .lrow .ltrack, .lcount.total, .lsec h4, .sw { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .legend { font-size: 9.5px; margin-top: 4px !important; }
    .dayside { display: flex; gap: 8px; margin-top: 6px; break-inside: avoid; }
    .dayside .card { flex: 1; padding: 4px 8px; margin: 0; border: 1px solid #bbb; border-radius: 4px; font-size: 10px; }
    .dayside h3 { font-size: 11px; margin-bottom: 2px; } .dayside ul { columns: 2; }
  }

  /* ---- VLH: come il foglio aziendale ---- */
  .vlhsheet { margin-bottom: 16px; max-width: 980px; padding: 10px; }
  table.vlh { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 12px; font-family: Calibri, Arial, sans-serif; }
  table.vlh td { border: 1px solid #555; padding: 1px 4px; vertical-align: top; overflow: hidden; }
  table.vlh tr.ttl td { font-weight: 800; font-size: 15px; border: 1px solid #000; padding: 3px 6px; }
  table.vlh .blk, table.vlh tr.blk td { background: #111; color: #fff; font-weight: 700; }
  table.vlh td.lab { font-weight: 700; font-size: 11.5px; vertical-align: middle; }
  table.vlh td.c { text-align: center; vertical-align: middle; } table.vlh td.sm { font-size: 11px; } table.vlh td.hr { font-weight: 800; font-size: 14px; }
  table.vlh tr.area td { font-weight: 800; font-size: 17px; padding: 2px 8px; }
  table.vlh tr.area.FC td, table.vlh td.bar.FC { background: #f59b94; } table.vlh tr.area.PR td, table.vlh td.bar.PR { background: #94b6de; }
  table.vlh tr.area.MC td, table.vlh td.bar.MC { background: #c8262c; color: #fff; }
  table.vlh tr.slot td { height: 46px; } table.vlh tr.sec td { height: 12px; font-size: 9px; padding: 0 4px; }
  table.vlh td.rn { text-align: right; vertical-align: bottom; font-weight: 700; font-size: 11px; }
  table.vlh .pos { font-size: 9.5px; line-height: 1.1; color: #222; } table.vlh .pos.new { text-decoration: underline; font-weight: 700; font-style: italic; }
  table.vlh .who { font-weight: 700; font-size: 16px; margin-top: 2px; white-space: nowrap; letter-spacing: .3px; }
  table.vlh tr.gap td { border: 0; height: 10px; }
  table.vlh tr.tot td { height: 28px; vertical-align: middle; } table.vlh td.num { text-align: right; font-weight: 700; font-size: 14px; }
  table.vlh td.short { background: var(--err); color: var(--err-ink); }
  table.vlh tr.nx td { height: 34px; } table.vlh td.next { font-size: 11px; vertical-align: top; } table.vlh td.next .pos { font-size: 9.5px; }
  table.vlh input { width: 100%; box-sizing: border-box; text-align: center; font-weight: 700; font-size: 13px; padding: 1px; border: 1px solid #ccc; border-radius: 3px; }
  table.vlh input.man { background: #fff4d6; }
  /* telefono: il foglio resta largo come quello di carta e si scorre di lato */
  .vlhscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media screen and (max-width: 760px) { .vlhscroll table.vlh { min-width: 720px; } .vlhsheet { padding: 6px; } table.vlh tr.slot td { height: 40px; } table.vlh .who { font-size: 14px; } }
  table.vlh .who[data-id] { cursor: grab; touch-action: none; user-select: none; border-radius: 3px; }
  table.vlh .who[data-id]:hover { background: #eef3fb; } table.vlh .who.man { color: #1d4ed8; }
  table.vlh .who.dragging { opacity: .4; }
  table.vlh td.droptarget { outline: 3px solid #2563eb; outline-offset: -3px; background: #e8f0ff; }
  table.vlh td.fuori { background: #fde7c8; }
  table.vlh tr.free td { vertical-align: top; background: #f7f7f5; } table.vlh tr.free td.lab { vertical-align: middle; }
  table.vlh .who.chip { font-size: 12px; font-weight: 600; margin: 1px 0; padding: 1px 3px; background: #fff; border: 1px solid #ccc; white-space: nowrap; }
  @media print {
    .vlhsheet { break-after: page; border: 0; box-shadow: none; padding: 0; max-width: none; } .vlhsheet:last-child { break-after: auto; }
    .vlhscroll { overflow: visible; } table.vlh { min-width: 0 !important; }
    table.vlh { font-size: 10px; } table.vlh input { border: 0; background: none !important; font-size: 11px; }
    table.vlh tr.slot td { height: 9mm; } table.vlh tr.sec td { height: 2.6mm; } table.vlh tr.tot td, table.vlh tr.nx td { height: 6mm; }
    table.vlh .who { font-size: 13px; }
    table.vlh td, table.vlh tr td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* ---- tabelle: la riga dei titoli resta visibile scorrendo ---- */
  .list thead th { position: sticky; top: 0; z-index: 2; box-shadow: inset 0 -1px 0 var(--line); }
  @media (min-width: 761px) {
    /* su PC scorre la pagina e i titoli si fermano sotto la barra verde */
    .card:has(> table.list), .card > div:has(> table.list) { overflow: visible; }
    .list thead th { top: var(--hdr, 56px); }
    .card:has(> table.list) .list thead th:first-child { border-top-left-radius: 12px; }
    .card:has(> table.list) .list thead th:last-child { border-top-right-radius: 12px; }
  }
  @media (max-width: 760px) {
    /* su telefono la tabella scorre nel suo riquadro: titoli fermi in alto e nomi fermi a sinistra */
    .card:has(> table.list), .card > div:has(> table.list) { overflow: auto; max-height: calc(100dvh - var(--hdr, 100px) - 56px); -webkit-overflow-scrolling: touch; }
    main > .card:last-child:has(> table.list) { position: sticky; top: calc(var(--hdr, 100px) + 8px); }
    .list td:first-child, .list th:first-child { position: sticky; left: 0; z-index: 1; background: #fff; box-shadow: inset -1px 0 0 var(--line); }
    .list thead th:first-child { z-index: 3; background: #fafafa; box-shadow: inset -1px -1px 0 var(--line); }
    .list tr.group td:first-child { background: var(--green-soft); } .list tr.sel td:first-child { background: var(--err); }
  }
  @media print { .list thead th { position: static; } }
</style>

<body>
<header>
  <div class="brand" id="brand">🗓 Orari</div>
  <nav id="nav"></nav>

</header>
<main id="app"></main>
<div id="modal"></div>
<div id="toast" class="no-print"></div>

<script src="turni-storico.js?v=202611092330"></script>
<script src="turni-core.js?v=202611092330"></script>
<script src="turni-manager.js?v=202611092330"></script>
<script src="turni-vlh.js?v=202611092330"></script>
<!-- file con i dati reali del personale: esiste solo sul computer del manager, online non c'è (e l'app parte vuota) -->
<script src="privato/turni-privato.js" onerror="this.remove()"></script>
<script src="turni-data.js?v=202611092330"></script>
<script src="turni-cloud-config.js?v=202611092330"></script>
<script src="turni-cloud.js?v=202611092330"></script>

<script>
'use strict';
const T = window.Turni;
const KEY = 'turni-familyfood-v1';
const VIEWS = [['turni', 'Turni'], ['giornaliero', 'Giornaliero'], ['vlh', 'VLH'], ['previsioni', 'Previsioni'], ['personale', 'Personale'], ['formazione', 'Formazione'], ['aperture', 'Aperture e chiusure'], ['doppi', 'Doppi'], ['ferie', 'Ferie e malattie'], ['richieste', 'Richieste'], ['regole', 'Regole'], ['store', 'Store']];
const TIME_OPTIONS = []; for (let m = 6 * 60; m <= 23 * 60; m += 15) TIME_OPTIONS.push(m);

// ---------- stato (salvato nel browser) ----------
let storageOk = true;
let state = loadState();
const ui = { view: 'turni', ws: T.mondayOf(T.todayDay()), day: T.todayDay(), type: 'CREW', deleteMode: false, selected: new Set(), draft: null };
// Aperta dall'app "Turni" (sezione Manager, ?s = locale) o installata: finché non si entra con la password
// dei manager non si vede niente (né menu né dati), solo la schermata di accesso, che non si può chiudere.
const APP_STORE = new URLSearchParams(location.search).get('s');
const APP_MODE = !!APP_STORE || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
ui.locked = APP_MODE && TurniCloud.configured() && !TurniCloud.loggedIn();

// Se il browser non permette di salvare (es. navigazione privata) l'app funziona lo stesso, ma senza memoria.
function loadState() {
  try { const s = JSON.parse(window.localStorage.getItem(KEY)); if (s && Array.isArray(s.employees)) return TurniData.migrate(s); } catch (e) { storageOk = false; }
  return TurniData.sampleState();
}
function saveLocal() {
  try { window.localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch (e) { storageOk = false; }
}
/** Ogni modifica: salva nel browser e (se collegato) anche online, pochi secondi dopo. */
function save() { saveLocal(); cloudTouch(); }
const newId = () => state.nextId++;
const empById = (id) => state.employees.find((e) => e.id === id);
const mgrById = (id) => (state.managers || []).find((m) => m.id === id);
/** Dipendente o manager (hanno numeri diversi): serve per gli accessi all'app del personale. */
const personById = (id) => empById(id) || mgrById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const timeSelect = (value, onchange) =>
  `<select onchange="${onchange}">${TIME_OPTIONS.map((t) => `<option value="${t}" ${t === value ? 'selected' : ''}>${T.fmtTime(t)}</option>`).join('')}</select>`;
const sortByName = (list) => [...list].sort((a, b) => T.fullName(a).localeCompare(T.fullName(b), 'it'));

// ---------- navigazione ----------
const INFO = {
  'previsioni': [`Previsioni`, `Per ogni giorno: vendite previste, clienti (GC) e <b>Ore totali</b>.<br><br><b>Ore totali</b> = le ore di lavoro del giorno come nel totale del lineare (hospitality + crew + doppi turni), <b>senza le ore manager</b>.<br><br>Il generatore toglie le ore hospitality tipiche di quel giorno (media delle 4 settimane prima) e distribuisce le ore che restano tra i crew nelle fasce; le hospitality seguono le loro fasce in Regole. I giorni senza Ore totali usano i minimi di Regole.`],
  'prev-auto': [`Previsioni automatiche`, `Vendite e GC segnati <b>auto</b> sono calcolati in automatico dallo storico delle vendite, aggiornato ogni giorno.<br><br>Il calcolo mette insieme più metodi (la previsione del sistema di cassa, la media delle ultime settimane, lo stesso periodo dell'anno scorso) e dà più peso a quelli che nelle ultime 8 settimane hanno sbagliato meno: più giorni di storico ci sono, più diventa preciso.<br><br>Le <b>Ore totali</b> segnate <b>stima</b> sono calcolate dai GC previsti, con il rapporto ore/clienti imparato dai giorni in cui le hai scritte tu (ultime 8 settimane; senza dati si usa un valore di partenza). Se cambi i GC a mano, la stima si aggiorna.<br><br>Se cambi un valore a mano, resta il tuo: gli aggiornamenti automatici non lo sovrascrivono. Più settimane correggi, più la stima delle Ore totali diventa precisa.<br><br><b>Settimane già pianificate:</b> quando una settimana ha dei turni, i suoi numeri restano fermi; si aggiornano solo le settimane ancora da fare (e la previsione del sistema di cassa, solo come confronto).<br><br><b>Per canale:</b> clicca il giorno (▸) per vedere vendite e GC divisi per canale, con le quote medie delle ultime 4 settimane per lo stesso giorno.`],
  'eventi': [`Eventi e chiusure`, `Qui segni i giorni diversi dal solito. Le previsioni di quei giorni si correggono da sole, e di conseguenza le Ore totali e i turni.<br><br><b>🔒 Chiusura totale</b> (festività, inventario): vendite, GC e ore a zero; il generatore non mette turni e conta quel giorno come una giornata di ferie per tutti.<br><b>🕒 Chiusura parziale</b> (manutenzione, chiusura anticipata): le previsioni calano della quota di clienti che di solito entra in quelle ore; niente turni e niente minimi in quegli orari.<br><b>⭐ Evento o ricorrenza</b> (promozioni, ricorrenze, feste locali): l'effetto si calcola dallo storico, guardando come sono andate le stesse giornate negli anni passati (date di confronto). Puoi anche scrivere tu la %.<br><b>🏬 Novità in zona</b> (nuovo negozio vicino, cantiere, nuova zona commerciale): indichi tu la % per il periodo; dopo qualche settimana le previsioni la imparano da sole dai dati.<br><br><b>Eventi di più giorni:</b> puoi dare una % diversa a ogni giorno con "Riempi veloce" o giorno per giorno.<br><br><b>Dove si vede l'effetto:</b> sotto vendite e GC in Previsioni, nel lineare (riquadro Previsione e righe "GC previsti" e "di cui evento" ora per ora) e in testa al lineare stampato.<br><br>Con un evento il calcolo parte dalla previsione "normale" delle ultime settimane, così l'effetto non viene contato due volte. I valori scritti a mano restano i tuoi.<br><br><b>Suggeriti dallo storico</b>: festività in cui il locale è stato chiuso negli ultimi due anni e giorni che l'anno scorso hanno avuto molti più clienti del solito.`],
  'mgr': [`Squadra manager`, `I manager hanno un calendario a parte (non entrano nelle Ore totali e nei rush dei crew).<br><br><b>Ruolo e ore</b>: ore da contratto di ognuno, su 6 giorni; i giorni in cui possono riposare si scelgono nella sezione <b>Store</b>.<br><b>Giorni ordine</b>: giorni in cui quella persona fa l'ordine: entra entro l'orario impostato nella sezione Store (o in apertura), non riposa e il giorno prima non fa la sera.<br><b>Orario flessibile</b>: giorni in cui può fare un orario a metà giornata invece di apertura o chiusura.<br><b>1 centrale</b>: una volta a settimana, nei primi giorni della settimana, un turno centrale (es. per controllare gli orari).<br><br>Ogni giorno: un manager in apertura e uno in chiusura. Nei giorni di <b>delivery</b> c'è un secondo manager in apertura. <b>Carpigiani</b> (ogni 2 settimane, qualsiasi manager): il giorno dello smontaggio due manager la sera, il giorno del rimontaggio due manager in apertura. Stacchi, durate dei turni e manager minimi al giorno: sezione <b>Store</b>. Il weekend gira tra aperture, centrali e chiusure.`],
  'mgr-weekend': [`Weekend dei manager`, `Quante aperture, centrali e cene ha fatto ognuno nel fine settimana nelle ultime 4 settimane (questa compresa). Il generatore le fa a rotazione, così in un mese ognuno fa almeno un'apertura, un centrale e una cena.`],
  'affiancamenti': [`Affiancamenti in apertura e chiusura`, `Qui programmi chi deve imparare ad <b>aprire</b> la cucina (MFY) o il McCafé, oppure a <b>chiudere</b> il McCafé. Per ogni persona scegli quante volte in tutto (es. 4), quante al massimo a settimana (es. 3) e, se vuoi, in quali giorni.<br><br>Quando generi i turni, il programma la mette in apertura (o in chiusura) in quella postazione <b>in più</b> rispetto alla squadra, solo nei giorni in cui c'è un formato che apre (o chiude) accanto a lei. Nel lineare questi turni hanno il segno 🎓.<br><br>Finiti gli affiancamenti, la persona diventa <b>autonoma</b>: viene segnata da sola in Aperture e chiusure e da lì in poi apre (o chiude) senza affiancamento. Puoi anche segnarla autonoma prima, con il pulsante ✅.<br><br>La chiusura della cucina non ha affiancamenti da programmare: in chiusura in cucina ci sono sempre più persone.`],
  'vlhGen': [`Turni creati in base alla VLH`, `Quando è attivo, il generatore guarda i clienti previsti ora per ora e le tabelle VLH: in ogni ora mette le persone che servono per le posizioni da aprire, area per area (MFY, OA, McCafé, sala). Restano valide squadre di apertura e chiusura, presidi delle postazioni, ore da contratto e riposi.<br><br>Se le persone non bastano, le posizioni restano <b>scoperte</b> e le trovi tra i problemi della settimana. Se nella sezione Previsioni hai scritto a mano le <b>Ore totali</b> del giorno, la VLH non le supera: toglie prima le posizioni aperte per pochi clienti (mai le prime tre). Le Ore totali stimate in automatico non fanno da limite.`],
  'formazione': [`Formazione`, `Segna in quali postazioni è formato ogni crew e ogni hospitality: il generatore mette le persone solo dove sono formate. Le postazioni del locale si impostano nella sezione Store. Chi può <b>aprire</b> si segna nella sezione <a href="#" onclick="closeModal();go('aperture');return false">Aperture</a>.`],
  'aperture': [`Aperture e chiusure`, `Segna chi è formato per <b>aprire</b> e per <b>chiudere</b> ogni postazione. Il generatore sceglie solo tra queste persone, crew o hospitality, e non sposta mai chi ha un orario fisso.`],
  'doppi': [`Doppi`, `Indica chi fa il turno doppio (un secondo turno nello stesso giorno, ore in più rispetto al contratto) e quanti giorni a settimana. In <b>Ore massime per doppio</b> puoi abbassare la durata per chi non può fare il doppio standard: il generatore e i controlli ne tengono conto.
  Il generatore mette i doppi solo a queste persone, nei rush di pranzo o cena e preferibilmente nel fine settimana. <b>Chi apre</b> quel giorno non fa il doppio.`],
  'ferie': [`Ferie e malattie`, `Inserisci ferie, malattie, infortuni e assenze. In quei giorni la persona non può avere turni (il generatore non la usa) e le ore da fare in quella settimana calano della quota giornaliera (le ore del contratto divise per i giorni lavorativi). Una malattia o un infortunio in corso si può inserire anche a settimana già fatta: i suoi turni di quei giorni diventano errori da coprire (usa 🛠 Risolvi problemi).`],
  'fasce': [`Fasce di copertura`, `Numero minimo di persone presenti per tutta la durata della fascia, giorno per giorno (0 = nessun minimo). Nei giorni con le Ore totali (sezione Previsioni), i minimi delle fasce senza postazione (rush, picchi, intermedi) vengono ricavati dalle Ore totali, tolte le ore hospitality. Contano crew e hospitality messe in una postazione crew (non quelle in sala). Con una postazione indicata contano solo i presenti in quella postazione; con "Solo formati apertura" solo chi è segnato nella sezione Aperture.<br><br>Le fasce segnate <b>"consiglio"</b> non sono obbligatorie: il generatore cerca di rispettarle, ma se mancano compaiono in <b>giallo</b> tra gli avvisi, non in rosso tra gli errori.`],
  'richieste': [`Richieste del personale`, `I dipendenti, dall'app del personale (con il loro nome utente e password), chiedono un turno compatibile con i loro impegni (es. un concerto la sera). Le richieste arrivate a voce o per messaggio le puoi inserire tu con <b>✍️ Aggiungi richiesta</b>: poi funzionano come le altre (proposte di turno, accetta o rifiuta). Per ognuna il generatore propone un turno; tu accetti, modifichi o rifiuti. <b>Niente cambia nei turni finché non accetti.</b> Le accettate vengono rispettate da "Genera turni" e dai controlli.`],
  'cfg-crewMaxWeekday': [`Max ore turno Crew in settimana`, `Durata massima di un turno normale di un crew nei giorni infrasettimanali. Ognuno può fare ogni tanto un turno più lungo: vedi "Turni lunghi a testa a settimana". Il doppio non conta: ha il suo limite.`],
  'cfg-crewMax': [`Max ore turno Crew (turni lunghi e fine settimana)`, `Durata massima di un turno di un crew nel fine settimana e dei <b>turni lunghi</b> in settimana. Il doppio non conta: ha il suo limite.`],
  'cfg-hospMax': [`Max ore turno Hospitality`, `Durata massima di un turno di un'hospitality, tutti i giorni.`],
  'cfg-minShift': [`Turno minimo`, `Un turno più corto di così viene segnalato tra gli avvisi. Il generatore non crea turni più corti.`],
  'cfg-rest11': [`Stacco tra giorni consecutivi`, `Ore minime tra la fine di un turno e l'inizio del turno del <b>giorno dopo</b>. Per esempio chi chiude la sera può non poter aprire la mattina dopo.`],
  'cfg-rest36': [`Stacco con riposo in mezzo`, `Se tra due turni c'è un <b>giorno di riposo</b>, tra la fine del primo e l'inizio del secondo servono almeno queste ore.`],
  'cfg-longpw': [`Turni lunghi a testa a settimana`, `Quanti turni più lunghi del massimo standard può fare ogni crew nei giorni infrasettimanali. Vanno <b>a rotazione</b>: il generatore li dà prima a chi ne ha fatti meno nelle 4 settimane precedenti. I turni lunghi devono coprire il picco del pranzo o della cena.`],
  'cfg-doubleMax': [`Durata massima doppio`, `Il doppio è un secondo turno nello stesso giorno (ore in più rispetto al contratto). Questa è la sua durata massima. Chi fa i doppi e quanti si decide nella sezione Doppi.`],
  'cfg-doubleGap': [`Pausa minima turno–doppio`, `Ore minime di pausa tra il turno normale e il doppio dello stesso giorno. Chi apre non fa il doppio.`],
  'cfg-closeGrace': [`Ultimi minuti non controllati prima della chiusura`, `Negli ultimi minuti prima della chiusura i minimi delle fasce non vengono controllati: in quel momento c'è solo la squadra di chiusura. La squadra di chiusura invece si controlla fino alla chiusura, e chi è in formazione non può restare da solo.`],
  'cfg-requestMargin': [`Richieste: fine turno prima di un impegno`, `Quando un dipendente chiede "ho un impegno alle…", il turno deve finire almeno queste ore prima, oppure iniziare dopo l'impegno (vedi "inizio turno dopo un impegno"). Quando accetti la richiesta puoi comunque cambiare gli orari.`],
  'cfg-aft': [`Post-rush pomeriggio`, `Fascia del pomeriggio tra i due rush. Qui il generatore non mette turni "rigidi" tutti dentro questa fascia né turni "ibridi" a cavallo: preferisce turni sfalsati che si agganciano ai rush (uno che finisce quando l'altro inizia).`],
  'cfg-pre': [`Chi fa la cena entra dalle`, `Ora più presto in cui entra chi lavora per la cena. Così i turni di cena non partono nel mezzo del pomeriggio.`],
  'cfg-orario': [`Orario del locale`, `Apertura e chiusura del locale, giorno per giorno (anche 24 ore): sezione Store. Il generatore non mette turni fuori da quest'orario.`],
  'col-nome': [`Fascia di copertura`, `Ogni riga è una fascia oraria (es. il rush del pranzo) con il numero minimo di persone che devono essere presenti per tutta la sua durata. Puoi cambiarne nome e orari, aggiungerne o eliminarne.`],
  'col-min': [`Minimo per giorno`, `Quante persone servono come minimo, da lunedì a domenica (0 = nessun minimo quel giorno). Si conta il momento più scoperto della fascia. Nei giorni con le Ore totali (sezione Previsioni) i minimi delle fasce <b>senza</b> postazione (rush, picchi, intermedi) vengono ricavati dalle Ore totali, tolte le ore hospitality.`],
  'col-post': [`Postazione`, `<b>Qualsiasi crew</b>: contano tutti i crew presenti, in qualunque postazione.<br><b>Una postazione</b> (quelle del locale, impostate nella sezione Store): contano solo le persone messe in quella postazione. Per la Sala contano anche le hospitality, se nella sezione Store è attiva la regola.`],
  'col-ap': [`Solo formati apertura`, `Se è spuntato, nella fascia contano solo le persone segnate per <b>aprire</b> quella postazione (sezione Aperture e chiusure). Serve per le fasce di apertura. Si può spuntare solo se hai scelto una postazione.`],
  'col-ch': [`Solo formati chiusura`, `Se è spuntato, nella fascia contano solo le persone che possono <b>chiudere</b> quella postazione (sezione Aperture e chiusure: se per una postazione non hai segnato nessuno, possono chiudere tutti i formati in quella postazione). Serve per le fasce di chiusura. Si può spuntare solo se hai scelto una postazione.`],
  'col-esatta': [`Squadra esatta`, `In un certo momento devono esserci <b>esattamente</b> il numero di persone indicato in quella postazione: né di meno, né di più (nelle altre fasce il numero è solo un minimo).<br><br><b>all'inizio</b>: esatto all'ora d'inizio della fascia (es. la squadra di apertura).<br><b>alla fine</b>: esatto all'ora di fine (es. la squadra di chiusura); se ne restano di più è un errore.<br><b>no</b>: il numero è solo un minimo.<br><br>Si può scegliere solo dopo aver scelto una <b>postazione</b> (con "Qualsiasi crew" il menu è grigio). Chi è in formazione può esserci in più.`],
};

/**

 * Aperture e chiusure e il piano si chiude. Gira a ogni aggiornamento della pagina (salva solo se cambia qualcosa).
 */
function syncFormazioni() {
  if (!T.affDone || !(state.formazioni || []).length) return;
  const today = T.todayDay();
  let changed = false;
  for (const p of state.formazioni) {
    if (p.fine != null || T.affDone(state, p, today) < (p.volte || 1)) continue;
    const last = Math.max(...state.shifts.filter((x) => x.aff === p.id && x.day < today).map((x) => x.day));
    p.fine = last + 1;
    const e = empById(p.empId);
    if (e) { const k = p.tipo === 'CHIUSURA' ? 'closings' : 'openings'; e[k] = [...new Set([...(e[k] || []), p.station])]; }
    changed = true;
  }
  if (changed) save();
}

function renderTurni() {
  if (ui.type === 'MANAGER') return renderMgrTurni();
  const ctx = T.makeCtx(state, ui.ws);
  const vs = T.validate(ctx).filter((v) => v.rule !== 'VLH'); // le posizioni VLH scoperte sono nella riga riassuntiva della tabella
  const cellV = new Map();
  vs.forEach((v) => { if (v.emp != null && v.day != null) { const k = v.emp + '|' + v.day; if (!cellV.has(k)) cellV.set(k, []); cellV.get(k).push(v); } });
  const later = ctx.employees.filter((e) => e.type === ui.type && e.startDate != null && e.startDate > ui.ws + 6);
  const emps = sortByName(ctx.employees.filter((e) => e.type === ui.type && !later.includes(e)));
  const nErr = vs.filter((v) => v.sev === 'ERROR').length, nWarn = vs.length - nErr;
  const cfg = state.config;

  const head = `<tr><th class="name">Dipendente</th>${ctx.days.map((d) => `<th><button class="link" title="Apri il lineare di questo giorno" onclick="openDaily(${d})">${T.shortDate(d)} ↗</button>${dayTags(d)}</th>`).join('')}<th>Ore</th></tr>`;
  // stessi minimi usati dai controlli (con le previsioni i rush e i picchi chiedono più persone di quelli in Regole)
  // per non allungare la tabella: le posizioni VLH sono riassunte in una riga, e delle altre fasce si vedono solo
  // quelle con un problema nella settimana (con "Mostra tutte le fasce" si vedono tutte quelle che chiedono qualcuno)
  const covAll = ctx.coverage.filter((r) => !r.vlh && (ui.type === 'HOSPITALITY') === (r.station === 'HOSPITALITY') && ctx.days.some((d) => T.reqMin(r, d)));
  const hasProblem = (r) => ctx.days.some((d) => { const need = T.reqMin(r, d); return need && T.coverageMin(ctx, d, r) < need; });
  const covList = ui.covAll ? covAll : covAll.filter(hasProblem);
  const cov = covList.map((req) => `<tr class="cov"><td class="name">${esc(req.name)}${req.soft ? ' <span class="small">· consiglio</span>' : ''} <span class="small">(${T.fmtTime(req.start)}–${T.fmtTime(req.end)})</span></td>${
    ctx.days.map((d) => { const need = T.reqMin(req, d); if (!need) return '<td class="c">—</td>'; const c = T.coverageMin(ctx, d, req); return `<td class="c ${c >= need ? 'okc' : req.soft ? 'soft' : 'bad'}" title="Presenti nel momento più scoperto / minimo richiesto${req.fromForecast ? ' (minimo calcolato dalle Ore totali previste)' : ''} (gli ultimi minuti prima della chiusura non contano)">${c}/${need}</td>`; }).join('')}<td></td></tr>`).join('');
  // riga riassuntiva della VLH: ore di posizioni scoperte per giorno (somma sulle ore)
  const vlhBands = ui.type === 'HOSPITALITY' ? [] : ctx.coverage.filter((r) => r.vlh);
  const vlhRow = !vlhBands.length ? '' : `<tr class="cov"><td class="name">VLH · ore di posizioni scoperte ${ib('vlhGen')}</td>${ctx.days.map((d) => {
    if (!ctx.vlh || !ctx.vlh[d - ctx.ws]) return '<td class="c">—</td>';
    const holes = [];
    for (const r of vlhBands) {
      const need = T.reqMin(r, d);
      if (!need) continue;
      const miss = need - T.coverageMin(ctx, d, r);
      if (miss > 0) holes.push({ h: r.start, n: miss * (r.end - r.start) / 60, txt: `${T.fmtTime(r.start)} ${r.name.replace('VLH ', '')}: ${miss}` });
    }
    const tot = Math.round(holes.reduce((t, x) => t + x.n, 0) * 2) / 2;
    return `<td class="c ${tot ? 'soft' : 'okc'}" title="${esc(tot ? 'Posizioni VLH scoperte:\n' + holes.sort((a, b) => a.h - b.h).map((x) => x.txt).join('\n') : 'Tutte le posizioni VLH coperte')}">${tot ? String(tot).replace('.', ',') : '✓'}</td>`;
  }).join('')}<td></td></tr>`;
  const hidden = covAll.length - covList.length;
  const covToggle = covAll.length ? `<tr class="cov"><td class="name" colspan="${ctx.days.length + 2}">${!covList.length && !ui.covAll ? '✅ Tutte le fasce di copertura sono a posto · ' : ''}<button class="link" onclick="ui.covAll=!ui.covAll;render()">${ui.covAll ? 'Mostra solo le fasce con problemi' : `Mostra tutte le fasce (${hidden} a posto)`}</button></td></tr>` : '';
  const covBlock = cov + vlhRow + covToggle;
  const rows = emps.map((e) => {
    const w = T.worked(ctx, e.id), t = T.target(ctx, e), dw = T.doubleWorked(ctx, e.id);
    return `<tr><td class="name" title="${esc(T.TYPES[e.type])} · ${T.fmtDur(e.weeklyMinutes)}/sett.">${esc(T.fullName(e))}${ctx.shifts.some((x) => x.aff && x.employeeId === e.id && x.day >= ctx.ws && x.day <= ctx.ws + 6) ? ' 🎓' : ''}</td>${ctx.days.map((d) => cellHtml(ctx, e, d, cellV.get(e.id + '|' + d))).join('')}
      <td class="tot ${w > t ? 'over' : w < t ? 'under' : 'exact'}">${T.fmtDur(w)}<div class="sub">su ${T.fmtDur(t)}${dw ? ` · +${T.fmtDur(dw)} doppi` : ''}</div></td></tr>`;
  }).join('');

  const probs = vs.map((v, i) => {
    const click = v.emp != null && v.day != null;
    return `<div class="prob ${click ? 'click' : ''}" ${click ? `onclick="openFromProblem(${v.emp},${v.day})"` : ''}><span class="dot ${v.sev}"></span><div><div class="r">${T.RULES[v.rule]}</div>${esc(v.msg)}</div></div>`;
  }).join('') || '<p class="muted">Nessun problema: la settimana rispetta tutte le regole. 🎉</p>';

  return `
  <div class="toolbar">
    <button class="btn" onclick="moveWeek(-1)">◀</button>
    <div class="week">${T.weekLabel(ui.ws)}</div>
    <button class="btn" onclick="moveWeek(1)">▶</button>
    <button class="btn" onclick="ui.ws=T.mondayOf(T.todayDay());render()">Oggi</button>
    ${typeSeg(ctx)}
    <div class="spacer"></div>
    <span class="chip ${nErr ? 'err' : nWarn ? 'warn' : 'ok'}">${nErr} errori · ${nWarn} avvisi</span>
    ${publishChip()}
    <button class="btn" onclick="askClearWeek()">Svuota settimana</button>
    <button class="btn" ${nErr ? '' : 'disabled title="Nessun errore da risolvere"'} style="${nErr ? 'border-color:var(--err-ink);color:var(--err-ink)' : ''}" onclick="solveWeek()">🛠 Risolvi problemi</button>
    <button class="btn primary" onclick="askGenerate()">⚙ Genera turni</button>
  </div>
  ${ctx.forecast ? (() => { const fd = (k) => T.forecastDay((state.forecasts || {})[ui.ws], k) || {};
    return `<div class="notice info" style="margin-bottom:10px">📈 <b>Ore totali</b> <span class="small muted">(senza manager)</span>: ${DAYS7.map((k) => `${T.DOW_SHORT[k + 1]} ${fd(k).crewHours ? `<b>${fd(k).crewHours}h</b>` : '—'}`).join(' · ')} <button class="link" onclick="go('previsioni')">Previsioni</button></div>`; })() : ''}
  <details class="help card">
    <summary>Come funziona (clicca per aprire)</summary>
    <ul>
      <li><b>Clicca una casella</b> per inserire o modificare il turno di quel giorno; puoi aggiungere un secondo turno (doppio).</li>
      <li>Ogni modifica viene controllata subito: le caselle diventano <b style="color:var(--err-ink)">rosse</b> (errore) o <b style="color:var(--warn-ink)">gialle</b> (avviso). Passa il mouse su una casella per leggere il motivo; l'elenco completo è a destra.</li>
      <li>Regole attuali: ore settimanali da contratto esatte (oltre = straordinario) · massimo ${T.fmtDur(cfg.crewMax)} al giorno per i crew e ${T.fmtDur(cfg.hospMax)} per le hospitality, doppi inclusi · turno minimo ${T.fmtDur(cfg.minShift)} · stacco ${T.fmtDur(cfg.rest11)} tra giorni consecutivi · ${T.fmtDur(cfg.rest36)} se in mezzo c'è un riposo · niente turni nei riposi fissi e nelle ferie.</li>
      <li>Le hospitality hanno le loro fasce (impostate in Regole): le vedi in cima alla scheda Hospitality.</li>
      <li><b>Squadra di chiusura</b>: alla chiusura restano esattamente le persone indicate nelle fasce di chiusura in Regole. Nessun altro, tranne chi è in formazione e affiancato.</li>
      <li><b>Aree</b>: le postazioni del locale, impostate nella sezione Store (più Hospitality).</li>
      <li>In settimana il turno normale dei crew ha una durata massima più corta; i <b>turni lunghi</b> li fanno tutti <b>a rotazione</b>, al massimo il numero impostato a testa a settimana, prima chi ne ha fatti meno nelle ultime settimane. Nel fine settimana sono tutti a disposizione e i turni possono essere più lunghi. Le durate si impostano in Regole.</li>
      <li><b>Pomeriggio post-rush</b>: niente turni lunghi tutti lì dentro né turni ibridi a cavallo; si copre con turni sfalsati, uno che arriva dal pranzo e uno che entra per la cena. I turni più lunghi servono solo a coprire un rush più preparazione o recupero. Gli orari si impostano in Regole.</li>
      <li>Orari del locale: sezione Store. Le righe in alto (solo Crew) mostrano la copertura di ogni fascia: quanti crew ci sono nel momento più scoperto, rispetto al minimo richiesto (rush pranzo e cena compresi). Le fasce si cambiano in Regole.</li>
      <li>Chi ha un <b>orario fisso</b> nei suoi giorni viene messo sempre e solo in quell'orario.</li>
      <li>Le ore di ognuno vanno distribuite su <b>tutti i giorni che non sono di riposo</b> (6 su 7): se manca un giorno compare un avviso.</li>
      <li><b>Spostare un riposo solo per una settimana</b>: clicca la casella del giorno in cui la persona deve riposare e premi <b>↔ Metti il riposo in questo giorno</b>. Le settimane dopo resta il riposo fisso; nella casella compare <b>RIPOSO ↔</b>.</li>
      <li><b>Pranzo e cena bilanciati</b>, per i crew e per le hospitality: il generatore aggiunge le persone a turno nella fascia più scoperta, così se le persone non bastano mancano un po' in tutte e due, non tutte nello stesso servizio. Anche le ore in più e i doppi delle hospitality vanno dove ce ne sono meno.</li>
      <li><b>Cambi turno proposti</b> (Richieste): solo tra persone dello stesso ruolo e formate nella postazione del turno che prendono; per aperture e chiusure solo chi è formato per aprire o chiudere.</li>
      <li><b>Aperture e chiusure sempre coperte</b>: se alla fine mancano ancora, il generatore le copre comunque, anche con ore in più per qualcuno o spostando il suo turno di quel giorno. Restano scoperte solo se nessun formato è disponibile (riposo, ferie, richiesta o stacco di 11 ore): lo trovi scritto nel riepilogo della generazione.</li>
      <li>I <b>doppi</b> (segnati con <b style="color:var(--warn-ink)">D</b>) sono ore in più rispetto al contratto. Nella colonna Ore sono indicati a parte.</li>
      <li>I minimi delle fasce possono cambiare in base al giorno: li trovi e li cambi in Regole.</li>
      <li>Aperture e chiusure le fa solo chi è segnato nella sezione <b>Aperture e chiusure</b> (crew o hospitality). Le <b>aperture vanno a rotazione</b>: sulle ultime 4 settimane apre prima chi ha aperto meno, e nella stessa settimana nessuno ne fa molte più degli altri, sempre se le altre regole lo permettono.</li>
      <li><b>Squadra di apertura</b>: all'apertura ci sono esattamente le persone indicate nelle fasce di apertura in Regole, nessun altro. Chi arriva dopo va bene.</li>
      <li><b>Data di inizio</b> (Personale): prima di quel giorno la persona non ha turni e le sue ore della settimana si riducono in proporzione.</li>
      <li>🎓 = <b>affiancamento</b> (sezione Formazione): impara ad aprire o chiudere, in più rispetto alla squadra e accanto a un formato.</li>
      <li><b>Genera turni</b> crea una bozza che rispetta le regole: prima aperture e chiusure (chi è segnato in Aperture e chiusure), poi rush e picchi, poi completa le ore di ognuno con orari vari, come negli orari passati del locale.</li>
      <li>I dati restano salvati in questo browser. Per portarli su un altro dispositivo o farne un backup usa <b>Esporta dati</b> / <b>Importa dati</b> in Regole.</li>
    </ul>
    <div class="legend">
      <span><i class="sw" style="background:var(--err)"></i>errore</span><span><i class="sw" style="background:var(--warn)"></i>avviso / ore mancanti</span>
      <span><i class="sw" style="background:var(--ok)"></i>ore esatte</span><span><i class="sw" style="box-shadow:inset 3px 0 0 var(--yellow)"></i>turno doppio</span>
      <span class="rest">RIPOSO</span> = riposo fisso
    </div>
  </details>
  <div class="layout">
    ${later.length ? `<div class="small muted" style="grid-column:1/-1;margin-bottom:-8px">Non mostrati perché entrano più avanti: ${later.map((e) => `${esc(T.fullName(e))} (dal ${T.itDate(e.startDate)})`).join(', ')}</div>` : ''}
    <div class="card gridwrap"><table class="grid"><thead>${head}</thead><tbody>${covBlock}${rows || `<tr><td class="name" colspan="9">Nessun dipendente: aggiungili nella sezione Personale, oppure importa un file di dati (Regole → Dati).</td></tr>`}</tbody></table></div>
    <aside class="card problems"><h3 style="display:flex;justify-content:space-between;align-items:center">Controlli della settimana ${nErr ? '<button class="btn" style="padding:4px 10px;font-size:12px" onclick="solveWeek()">🛠 Risolvi</button>' : ''}</h3>${probs}</aside>
  </div>`;
}

function cellHtml(ctx, e, d, vlist) {
  const sh = T.shiftsOf(ctx, e.id, d), ab = T.absenceOn(ctx, e.id, d), rest = T.isRest(e, d);
  const sev = vlist ? (vlist.some((v) => v.sev === 'ERROR') ? 'err' : 'warn') : '';
  let inner;
  if (sh.length) {
    inner = sh.slice().sort((a, b) => !!a.doppio - !!b.doppio || a.start - b.start).map((s) => `<div>${T.fmtTime(s.start)} ${T.fmtTime(s.end)}${s.doppio ? ' <b style="color:var(--warn-ink)" title="Doppio">D</b>' : ''}</div>`).join('') +
      (e.type === 'CREW' || sh.some((s) => s.station !== 'HOSPITALITY') ? `<div class="st">${sh.map((s) => T.STATIONS[s.station].short).join(' + ')}</div>` : '');
  } else if (!T.started(e, d)) inner = `<span class="abs" title="Data di inizio: ${T.itDate(e.startDate)}">entra il<br>${T.shortDate(e.startDate).split(' ')[1]}</span>`;
  else if (ab) { const ai = T.absenceInfo(ab.type); inner = `<span class="abs" style="background:${ai.color};color:${ai.ink};padding:2px 6px;border-radius:4px">${ai.label.toUpperCase()}</span>`; }
  else if (rest) inner = `<span class="rest"${e.restMoved ? ' title="Riposo spostato solo per questa settimana"' : ''}>RIPOSO${e.restMoved ? ' ↔' : ''}</span>`;
  else inner = '<span class="empty">—</span>';
  const title = vlist ? vlist.map((v) => '• ' + v.msg).join('\n') : 'Clicca per modificare';
  return `<td class="cell ${sev} ${sh.some((s) => s.doppio) ? 'dbl' : ''}" title="${esc(title)}" onclick="openDay(${e.id},${d})">${inner}</td>`;
}

function moveWeek(n) { ui.ws += 7 * n; render(); }
function openFromProblem(empId, day) {
  const e = empById(empId); if (!e) return;
  if (e.type !== ui.type) { ui.type = e.type; render(); }
  openDay(empId, day);
}

// --- modifica giorno ---
function openDay(empId, day) {
  const list = state.shifts.filter((s) => s.employeeId === empId && s.day === day).sort((a, b) => !!a.doppio - !!b.doppio || a.start - b.start)
    .map((s) => ({ start: s.start, end: s.end, station: s.station }));
  ui.draft = { empId, day, list };
  renderDayModal();
}
function defaultStation(e) { return e.type === 'HOSPITALITY' ? 'HOSPITALITY' : (T.CREW_STATIONS.find((s) => e.trainings.includes(s)) || 'FRONT'); }
function renderDayModal() {

/**

function genMgrForWeek(fromScratch) {

  const inWeek = (x) => x.day >= ws && x.day <= ws + 6;

    const err = r.problems.filter((p) => p.sev === 'ERROR').length, sc = err * 100 + r.problems.length;

/** Valuta un insieme di turni per la settimana: meno errori è meglio, poi meno avvisi. */
function scoreWeek(weekShifts) {

  const vs = T.validate(T.makeCtx(tmp, ui.ws));

    return `Non ci sono abbastanza persone libere in quella fascia${fc ? ' per le Ore totali di quel giorno' : ''}: ${fc ? 'rivedi le Ore totali, ' : ''}abbassa il minimo in Regole o sposta un riposo.`;

function solveWeek() {
  showModal('<h3>🛠 Sto cercando la soluzione migliore…</h3><p class="muted">Provo a sistemare la settimana mantenendo i tuoi turni e a rigenerarla da zero in più varianti. Ci vuole qualche secondo.</p>');
  setTimeout(() => {
    const ws = ui.ws, other = (s) => s.day < ws || s.day > ws + 6;
    const current = state.shifts.filter((s) => !other(s));
    const before = scoreWeek(current);
    const tries = [];
    // A) ripara la settimana attuale: tiene i turni, completa e sposta quelli che servono
    for (const seed of [11, 12, 13]) {
      const ctx = T.makeCtx(state, ws);
      const r = T.generate(ctx, { seed: ws * 31 + seed, moveAll: true });
      tries.push({ how: 'Riparata mantenendo i tuoi turni (alcuni spostati di orario)', shifts: r.all.map((x) => ({ ...x })) });
    }
    // B) rigenera da zero in più varianti
    const empty = { ...state, shifts: state.shifts.filter(other) };
    for (let k = 1; k <= 8; k++) {
      const r = T.generate(T.makeCtx(empty, ws), { seed: ws * 7919 + 1000 + k + (ui.genCount || 0) * 17 });
      tries.push({ how: 'Rigenerata da zero', shifts: r.added.map((x) => ({ ...x })) });
    }
    let best = null;
    for (const t of tries) { t.res = scoreWeek(t.shifts); if (!best || t.res.score < best.res.score) best = t; }

    const left = best.res.vs.filter((v) => v.sev === 'ERROR');
    const changed = best.shifts.length;
    showModal(`
      <h3>🛠 Risolvi problemi · ${T.weekLabel(ws)}</h3>
      <p>Adesso: <b style="color:var(--err-ink)">${before.err} errori</b> · ${before.warn} avvisi<br>
      Soluzione migliore trovata: <b style="color:${best.res.err ? 'var(--err-ink)' : 'var(--green)'}">${best.res.err} errori</b> · ${best.res.warn} avvisi

      ${better ? '' : '<div class="notice warn">Non ho trovato niente di meglio della settimana attuale.</div>'}

        <ul style="max-height:260px;overflow:auto;padding-left:18px">${left.map((v) => `<li style="margin-bottom:6px">${esc(v.msg)}<br><span class="small muted">→ ${esc(hintFor(v))}</span></li>`).join('')}</ul>` : '<p>✅ Tutti gli errori risolti.</p>'}

        <button class="btn" onclick="closeModal()">Annulla</button>

}

// ================= GIORNALIERO (lineare) =================
function openDaily(day) { ui.day = day; go('giornaliero'); }
function moveDay(n) { ui.day += n; render(); }
function renderGiornaliero() {
  const day = ui.day, cfg = state.config;
  const ctx = T.makeCtx(state, T.mondayOf(day));
  const dh = T.dayHours(cfg, day); // orario del locale di quel giorno (anche 24h)
  const H0 = Math.max(0, Math.floor((dh.open - 30) / 60)), H1 = Math.min(24, Math.ceil((dh.close + 60) / 60));
  const hours = []; for (let h = H0; h < H1; h++) hours.push(h);
  const span = (H1 - H0) * 60, pct = (m) => (((m - H0 * 60) / span) * 100).toFixed(3) + '%';
  const hw = `calc(100% / ${hours.length})`;
  // griglia disegnata linea per linea nella posizione esatta (un motivo ripetuto si sposta di frazioni di pixel):
  // linea marcata a ogni ora, linee chiare ogni 15 minuti (4 quadratini per ora)
  const gx = (m) => (((m - H0 * 60) / span) * 100).toFixed(4);
  let gl = '';
  for (let m = H0 * 60; m <= H1 * 60; m += 15) gl += `<line x1='${gx(m)}%25' x2='${gx(m)}%25' y1='0' y2='100%25' stroke='${m % 60 ? '%23d0d0d8' : '%238c8c96'}' stroke-width='1' shape-rendering='crispEdges'/>`;
  const grid = `background-image:url(&quot;data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100%25' height='100%25'>${gl}</svg>&quot;);background-size:100% 100%;background-repeat:no-repeat`;
  const day_ = ctx.shifts.filter((s) => s.day === day && ctx.byId.has(s.employeeId));
  const typeOf = (s) => ctx.byId.get(s.employeeId).type;
  const sections = [
    ['Hospitality', day_.filter((s) => !s.doppio && typeOf(s) === 'HOSPITALITY')],
    ['Crew', day_.filter((s) => !s.doppio && typeOf(s) === 'CREW')],
    ['Doppi turni', day_.filter((s) => s.doppio)],
  ];
  const editing = !!ui.dragEdit, byArea = ui.groupBy === 'area';
  if (editing) day_.forEach((s) => { if (s.id == null) s.id = newId(); });
  // vista per area: una fascia per postazione (trascinando una barra in un'altra fascia si cambia area)
  const AREAS = [...T.CREW_STATIONS.map((st) => [st, T.STATIONS[st].label]), ['HOSPITALITY', 'Hospitality']];
  const shown = byArea ? AREAS.map(([st, t]) => [t, day_.filter((s) => s.station === st), st]) : sections;
  const vs = T.validate(ctx).filter((v) => v.day === day && v.rule !== 'VLH');
  const bad = new Set(vs.filter((v) => v.emp != null).map((v) => v.emp));
  const row = (s) => {
    const e = ctx.byId.get(s.employeeId);
    const lim = T.limitOf(ctx, e.id, day);
    const tip = `${T.fullName(e)} · ${T.fmtTime(s.start)}–${T.fmtTime(s.end)} · ${T.STATIONS[s.station].label}${s.doppio ? ' · doppio' : ''}${s.aff ? ' · affiancamento (formazione)' : ''}${lim ? ` · richiesta accettata: ${lim.label}` : ''}`;
    return `<div class="lrow ${editing ? '' : 'click'}" ${editing ? `data-rsid="${s.id}"` : `onclick="openDay(${e.id},${day})"`} title="${esc(tip)}">
      <div class="lpos">${T.STATIONS[s.station].short}</div>
      <div class="lname">${bad.has(e.id) ? '<span class="pdot" style="color:var(--err-ink)" title="Ha un problema: vedi a destra">● </span>' : ''}${esc(T.fullName(e))}${T.isTrainee(e, day) || s.aff ? ' 🎓' : ''}${lim ? ` <span class="reqtag" title="Richiesta accettata: ${esc(lim.label)}">richiesta</span>` : ''}</div>
      <div class="ltime" data-t="a">${T.fmtTime(s.start)}</div><div class="ltime" data-t="b">${T.fmtTime(s.end)}</div>
      <div class="ltrack" style="${grid}"><div class="lbar st-${s.station}${editing ? ' drag' : ''}" ${editing ? `data-sid="${s.id}" onpointerdown="dragStart(event)"` : ''} style="left:${pct(s.start)};width:${(((s.end - s.start) / span) * 100).toFixed(3)}%"><span class="lbl">${T.STATIONS[s.station].short}</span>${editing ? '<span class="hl"></span><span class="hr"></span>' : ''}</div></div>
    </div>`;
  };
  const head = `<div class="lrow lhead"><div class="lpos">Post.</div><div class="lname">Nome</div><div class="ltime">Dalle</div><div class="ltime">Alle</div>
    <div class="ltrack" style="${grid};background-color:#fafafa">${hours.map((h) => `<span class="${h % 2 ? 'odd' : ''}" style="left:${pct(h * 60)}">${h}</span>`).join('')}</div></div>`;
  ui.dragGeo = { H0, span };
  // manager (calendario a parte): sempre in cima
  const mDay = (state.mgrShifts || []).filter((x) => x.day === day && mgrById(x.managerId)).sort((a, b) => a.start - b.start || a.end - b.end);
  const mRow = (x) => { const m = mgrById(x.managerId); return `<div class="lrow click" onclick="openMgrDay(${m.id},${day})" title="${esc(T.fullName(m))} · ${T.fmtTime(x.start)}–${T.fmtTime(x.end)}">
      <div class="lpos">${MROLE[mRoleOf(x)]}</div><div class="lname">${esc(T.fullName(m))}</div>
      <div class="ltime">${T.fmtTime(x.start)}</div><div class="ltime">${T.fmtTime(x.end)}</div>
      <div class="ltrack" style="${grid}"><div class="lbar st-MANAGER" style="left:${pct(x.start)};width:${(((x.end - x.start) / span) * 100).toFixed(3)}%"><span class="lbl">${MROLE[mRoleOf(x)]}</span></div></div></div>`; };
  const mgrSec = mDay.length ? `<div class="lsec"><h4>Manager (${mDay.length})</h4>${head}${mDay.map(mRow).join('')}</div>` : '';
  const body = mgrSec + shown.map(([title, list, st]) => `<div class="lsec" ${st ? `data-st="${st}"` : ''}><h4>${title} (${list.length})</h4>${head}${
    list.sort((a, b) => a.start - b.start || a.end - b.end).map(row).join('') || '<div class="lrow"><div></div><div class="lname muted">nessuno</div></div>'}</div>`).join('');

  // ore per fascia oraria (persone × ore) come nel lineare
  const hoursIn = (list, h) => list.reduce((t, s) => t + Math.max(0, Math.min(s.end, (h + 1) * 60) - Math.max(s.start, h * 60)), 0) / 60;
  const fmtN = (x) => (Math.round(x * 100) / 100).toString().replace('.', ',');
  const countRow = (label, list, cls = '') => {
    const tot = list.reduce((t, s) => t + s.end - s.start, 0) / 60;
    return `<div class="lrow lcount ${cls}"><div></div><div class="lname">${label}</div><div class="ltime" style="grid-column: span 2">${fmtN(tot)}</div>

  };
  // clienti previsti per ora (profilo orario del locale) e quanti in più/meno per l'evento

  const ef = dayEffect(iso), clo = T.closureOf(state.eventi, day);

  const openShare = prof ? hours.reduce((t, h) => t + (shut(h) ? 0 : prof[(h - 5 + 24) % 24] || 0), 0) : 0;
  const gcAt = (h) => (fd && fd.gc && prof && openShare && !shut(h) ? (fd.gc * (prof[(h - 5 + 24) % 24] || 0)) / openShare : 0);
  const gcRows = fd && fd.gc && prof && openShare ? `<div class="lrow lcount gcrow"><div></div><div class="lname">GC previsti</div><div class="ltime" style="grid-column: span 2">${fd.gc}</div><div class="ltrack">${hours.map((h) => `<span>${gcAt(h) >= 0.5 ? Math.round(gcAt(h)) : ''}</span>`).join('')}</div></div>
    ${ef && ef.g > 0 && Math.abs(ef.g - 1) > 0.005 ? `<div class="lrow lcount evrow"><div></div><div class="lname">di cui evento ⭐</div><div class="ltime" style="grid-column: span 2">${sgn(fd.gc - fd.gc / ef.g)}</div><div class="ltrack">${hours.map((h) => { const x = gcAt(h) - gcAt(h) / ef.g; return `<span>${Math.abs(x) >= 0.5 ? sgn(x) : ''}</span>`; }).join('')}</div></div>` : ''}` : '';
  const crewPresent = (h) => { let mx = 0; for (let m = h * 60; m < (h + 1) * 60; m += 15) mx = Math.max(mx, day_.filter((s) => typeOf(s) === 'CREW' && s.start <= m && s.end >= m + 15).length); return mx; };
  const counts = `<div class="countwrap"><div class="lsec"><h4>Ore per fascia oraria</h4>${head}
    ${mDay.length ? countRow('Ore manager', mDay) : ''}${countRow('Ore hospitality', sections[0][1])}${countRow('Ore crew', sections[1][1])}${countRow('Ore doppi turni', sections[2][1])}${countRow(mDay.length ? 'Totale (senza manager)' : 'Totale', day_, 'total')}
    <div class="lrow lcount"><div></div><div class="lname">Crew presenti (max)</div><div class="ltime" style="grid-column: span 2"></div><div class="ltrack">${hours.map((h) => `<span>${crewPresent(h)}</span>`).join('')}</div></div>${gcRows}</div></div>`;
  // riga di previsione in testa (in stampa sostituisce la colonna di destra)

// ================= PREVISIONI =================
const DAYS7 = [0, 1, 2, 3, 4, 5, 6];
function fcOf(ws) {
  const f = (state.forecasts || {})[ws];
  return { days: DAYS7.map((k) => ({ ...(T.forecastDay(f, k) || {}) })) };
}
const parseNum = (v) => (v === '' || v == null ? null : Math.max(0, +String(v).replace(',', '.')) || null);
function setFc(k, field, v) {
  state.forecasts = state.forecasts || {};
  const f = fcOf(ui.ws), d = f.days[k];
  const chWasAuto = d.auto && d.crewHours != null && d.crewHours === d.auto.crewHours;
  d[field] = parseNum(v);
  if (field === 'crewHours') d.senzaManager = true; // scritte come Ore totali senza manager (dal 31/10/2026)
  // GC cambiati a mano: anche la stima delle Ore totali si ricalcola (se non era stata scritta a mano)
  if (field === 'gc' && chWasAuto && d.gc) { d.crewHours = Math.round(d.gc * chRatio()); d.auto.crewHours = d.crewHours; }
  state.forecasts[ui.ws] = f; save(); render();
}
/**
 * Ore totali (senza manager) per cliente, imparate dai giorni in cui il manager ha scritto a mano Ore totali e GC
 * (ultime 8 settimane con dati). Contano solo i valori scritti dopo il cambio di significato (d.senzaManager):
 * prima si scrivevano le Crew Hours aziendali, che comprendono i manager.
 * Senza dati: 0,086 (circa 8,6 ore ogni 100 GC, dal lineare reale: 126 ore − 37 manager per circa 1.030 GC).
 */
function chRatio() {
  let ch = 0, gc = 0, weeks = 0;
  for (const ws of Object.keys(state.forecasts || {}).map(Number).sort((a, b) => b - a)) {
    const days = fcOf(ws).days.filter((d) => d.crewHours > 0 && d.gc > 0 && d.senzaManager && !(d.auto && d.crewHours === d.auto.crewHours));
    if (!days.length) continue;
    days.forEach((d) => { ch += d.crewHours; gc += d.gc; });
    if (++weeks >= 8) break;
  }
  return gc ? ch / gc : 0.086;
}
/** Copia lo stesso valore su più giorni (es. lun–gio uguali). */
function fillFc(from, to) {
  const f = fcOf(ui.ws);
  for (let k = to[0]; k <= to[1]; k++) { f.days[k] = { ...f.days[from] }; delete f.days[k].auto; }
  state.forecasts = state.forecasts || {}; state.forecasts[ui.ws] = f; save(); render();
}
function copyFcPrev() { const p = (state.forecasts || {})[ui.ws - 7]; if (!p) return alert('La settimana precedente non ha previsioni.'); const f = fcOf(ui.ws - 7); f.days.forEach((d) => delete d.auto); state.forecasts[ui.ws] = f; save(); render(); }
/**
 * Previsioni automatiche (calcolate sul Mac dallo storico SmartBusiness): riempie Vendite e GC giorno per giorno
 * e stima le Crew Hours dai GC (rapporto imparato dai valori scritti a mano, vedi chRatio).
 * I valori cambiati a mano restano.
 * data = { tipo: 'previsioni-turni', creato, errori, giorni: { 'AAAA-MM-GG': { sales, gc, gcSB } } }
 */
async function applyAutoForecasts(data) {
  if (!data || data.tipo !== 'previsioni-turni' || !data.giorni) throw new Error('Questo non è un file di previsioni automatiche.');
  if (TurniCloud.loggedIn()) await cloudPull(); // parte dai dati online più recenti

/** Evento di più giorni: % diversa per ogni giorno (es. apertura +65%, poi in settimana meno, nel weekend +50%). */
function evDaysHtml(e) {
  const rows = [];
  for (let d = T.toDay(e.dal); d <= T.toDay(e.al); d++) {
    const iso = T.toIso(d), v = e.perGiorno && e.perGiorno[iso];
    const def = eventEffect({ ...e, perGiorno: null }, iso);
    rows.push(`<tr><td>${T.DOW_SHORT[T.dow(d)]} ${itIso(iso).slice(0, 5)}</td><td><input type="number" step="1" style="width:80px" value="${v ?? ''}" placeholder="${Math.round((def.g - 1) * 100)}" onchange="evDay('${iso}',this.value)"> %</td></tr>`);
  }
  return `<div><div class="small" style="font-weight:600;color:var(--muted)">Effetto giorno per giorno <span style="font-weight:400">(vuoto = ${e.tipo === 'EVENTO' ? 'effetto generale o storico' : 'effetto generale'}, in grigio)</span></div>
    <div class="row small" style="margin:6px 0">Riempi veloce: <span style="white-space:nowrap">primo giorno <input id="q1" type="number" style="width:60px"> %</span> <span style="white-space:nowrap">in settimana <input id="q2" type="number" style="width:60px"> %</span> <span style="white-space:nowrap">fine settimana <input id="q3" type="number" style="width:60px"> %</span> <button class="btn" onclick="evQuick()">Applica</button></div>
    <div style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table class="list small"><tbody>${rows.join('')}</tbody></table></div></div>`;
}
function evDay(iso, v) { const e = ui.evDraft; e.perGiorno = { ...(e.perGiorno || {}) }; if (v === '') delete e.perGiorno[iso]; else e.perGiorno[iso] = +String(v).replace(',', '.'); showEventModal(); }
function evQuick() {
  const e = ui.evDraft, val = (id) => { const x = document.getElementById(id).value; return x === '' ? null : +x; };
  const first = val('q1'), wk = val('q2'), we = val('q3');
  e.perGiorno = { ...(e.perGiorno || {}) };
  for (let d = T.toDay(e.dal); d <= T.toDay(e.al); d++) {
    const iso = T.toIso(d), v = d === T.toDay(e.dal) && first != null ? first : T.dow(d) >= 5 ? we : wk;
    if (v != null) e.perGiorno[iso] = v;
  }
  showEventModal();
}
function saveEvent() {
  const e = ui.evDraft;
  if (!e.nome || !e.nome.trim()) return alert('Scrivi il nome dell\'evento.');
  if (!e.dal) return alert('Indica la data.');
  if (!e.al || T.toDay(e.al) < T.toDay(e.dal)) e.al = e.dal;
  if (e.tipo === 'PARZIALE' && !(e.a > e.da)) return alert('L\'orario di chiusura non è valido.');
  if (e.perGiorno) { for (const k of Object.keys(e.perGiorno)) if (k < e.dal || k > e.al || isNaN(e.perGiorno[k])) delete e.perGiorno[k]; if (!Object.keys(e.perGiorno).length || (e.tipo !== 'EVENTO' && e.tipo !== 'ZONA')) delete e.perGiorno; }
  if (e.tipo === 'ZONA' && (e.effetto == null || isNaN(e.effetto)) && !e.perGiorno) return alert('Indica l\'effetto in % (es. 20, o -10 se il nuovo negozio porterà via clienti), per tutto il periodo o giorno per giorno.');
  e.nome = e.nome.trim();
  delete e.confrontoAuto;
  state.eventi = state.eventi || [];
  if (e.id == null) { e.id = newId(); state.eventi.push(e); } else state.eventi = state.eventi.map((x) => (x.id === e.id ? e : x));
  ui.evDraft = null;
  refreshEvents(); save(); closeModal(); render();
  const shifts = e.tipo === 'CHIUSURA' ? state.shifts.filter((s) => s.day >= T.toDay(e.dal) && s.day <= T.toDay(e.al)).length : 0;
  if (shifts) alert(`Attenzione: in quei giorni ci sono già ${shifts} turni. Toglili dalla pagina Turni (compaiono come errore).`);
}
function deleteEvent(id) {
  if (!confirm('Eliminare questo evento?')) return;

}

function saveEmployee(id) {
  const last = document.getElementById('f-last').value.trim();
  const minutes = T.parseHours(document.getElementById('f-hours').value);
  const err = document.getElementById('f-error');
  if (!last || minutes == null || minutes < 0 || minutes > 3600) { err.style.display = 'block'; err.textContent = 'Inserisci almeno il cognome e un numero di ore valido (es. 18 o 18,5).'; return; }
  const data = {
    lastName: last, firstName: document.getElementById('f-first').value.trim(),
    type: document.getElementById('f-type').value, weeklyMinutes: minutes,
    restDays: [...document.querySelectorAll('.f-rest:checked')].map((x) => +x.value),
    active: document.getElementById('f-active').checked,
    fixedShift: null,
    startDate: document.getElementById('f-start').value ? T.toDay(document.getElementById('f-start').value) : null,
  };
  if (document.getElementById('f-fixed').checked) {
    const fs = +document.getElementById('f-fstart').value, fe = +document.getElementById('f-fend').value;
    if (fe <= fs) { err.style.display = 'block'; err.textContent = "L'orario fisso deve finire dopo l'inizio."; return; }
    data.fixedShift = { start: fs, end: fe };
  }
  if (id) Object.assign(empById(id), data);
  else state.employees.push({ id: newId(), trainings: [], doubleDays: 0, ...data });
  save(); closeModal(); render();
}

function renderAffiancamenti() {
  if (!T.AFF_TIPI) return '';
  const today = T.todayDay(), plans = state.formazioni || [];
  const giorni = (p) => ((p.giorni || []).length ? p.giorni.map((g) => T.DOW_SHORT[g]).join(', ') : 'tutti');
