  ${done.length ? `<details style="margin-top:18px" ${ui.showDone ? 'open' : ''} ontoggle="ui.showDone=this.open"><summary style="cursor:pointer;font-weight:700;font-size:15px;margin-bottom:8px">Già decise (${reqs.length - pend.length})</summary>
    <div style="margin:4px 0 10px"><button class="btn" style="color:var(--err-ink)" onclick="deleteRequests(state.requests.filter((q)=>q.status!=='in attesa').map((q)=>q.id))">🗑 Elimina tutte le decise</button></div>
    ${done.map(card).join('')}</details>` : ''}
  ${logged && state.reqKeys ? `<h3 style="margin:22px 0 8px">App del personale e accessi</h3>
  <div class="card section"><p style="margin-top:0"><b>1. Un solo link per tutti</b> (es. nel gruppo WhatsApp): da lì scaricano l'app sul telefono.</p>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><code style="background:#f3f3f5;padding:6px 8px;border-radius:6px;font-size:12px;word-break:break-all">${esc(appLink())}</code><button class="btn primary" onclick="shareAppLink()">📤 Invia il link a tutti</button></div>
    <p style="margin-bottom:0"><b>2. Nome utente e password personali</b>: li crea l'app; mandali a ciascuno in privato (pulsante 📤). Se qualcuno perde la password o la dà ad altri, premi "Nuova password": la vecchia smette di funzionare.</p></div>
  <div class="toolbar">${people.some((e) => !state.reqCreds[e.id]) ? '<button class="btn" onclick="makeAllAccess()">Crea gli accessi per tutti</button>' : ''}</div>
  <div class="card"><table class="list acc"><thead><tr><th>Nome</th><th>Nome utente</th><th>Password</th><th></th></tr></thead><tbody>
    ${people.map((e) => { const c = state.reqCreds[e.id]; return `<tr><td><b>${esc(T.fullName(e))}</b></td><td>${c ? `<code>${esc(c.user)}</code>` : '<span class="muted small">non ancora</span>'}</td><td>${c ? (c.changed ? '<span class="muted small">cambiata dal dipendente</span>' : `<code>${esc(c.pw)}</code>`) : ''}</td>
      <td style="text-align:right;white-space:nowrap">${c ? `${c.changed ? '' : `<button class="btn" onclick="shareAccess(${e.id})">📤 Invia</button> `}<button class="link" onclick="if(confirm('Creare una password nuova? Quella vecchia non funzionerà più.'))makeAccess(${e.id})">Nuova password</button>` : `<button class="btn" onclick="makeAccess(${e.id})">Crea accesso</button>`}</td></tr>`; }).join('')}
  </tbody></table></div>` : ''}`;
}
function askAccept(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  if (q.kind === 'fisso') {
    const c = fixedConflicts(q);
    return showModal(`<h3>Accetta gli impegni fissi</h3>
      <p><b>${esc(T.fullName(empById(q.employeeId)))}</b>: ${esc(SLOTS_TXT(q))}${q.note ? ` <span class="muted">("${esc(q.note)}")</span>` : ''}</p>
      <div class="form"><div class="row"><label class="f">Valido dal<input type="date" id="acc-from" value="${T.toIso(q.day)}"></label><label class="f">Fino al (vuoto = senza fine)<input type="date" id="acc-to" value="${q.to != null ? T.toIso(q.to) : ''}"></label></div>
      ${c.length ? `<p class="notice warn" style="margin:0">${c.length} turni già pianificati vanno in conflitto: dopo l'accettazione usa 🛠 Risolvi problemi in quelle settimane.</p>` : ''}
      <label class="f">Messaggio per il dipendente (facoltativo)<input type="text" id="acc-msg" maxlength="200" placeholder="es. ok, ne tengo conto nei turni"></label></div>
      <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="doAccept(${id})">Accetta</button></div>`);
  }
  const p = q.kind === 'libero' ? null : proposalOf(q);
  const weekHas = state.shifts.some((x) => x.day >= T.mondayOf(q.day) && x.day <= T.mondayOf(q.day) + 6);
  const timeSel = (idn, v, from, to) => `<select id="${idn}">${TIME_OPTIONS.filter((t) => t >= from && t <= to).map((t) => `<option value="${t}" ${t === v ? 'selected' : ''}>${T.fmtTime(t)}</option>`).join('')}</select>`;
  showModal(`<h3>Accetta la richiesta</h3>
    <p><b>${esc(T.fullName(empById(q.employeeId)))}</b> · ${T.DOW_LONG[T.dow(q.day)]} ${T.itDate(q.day)}: ${esc(KIND_TXT(q))}${q.note ? ` <span class="muted">("${esc(q.note)}")</span>` : ''}</p>
    <div class="form">
      ${q.kind === 'impegno' ? `<label class="f">Deve finire il turno entro le${timeSel('acc-t', q.until, 360, 1380)}</label>` : ''}
      ${q.kind === 'dalle' ? `<label class="f">Può iniziare dalle${timeSel('acc-t', q.from, state.config.open ?? 450, (state.config.close ?? 1290) - (state.config.minShift ?? 120))}</label>` : ''}
      ${q.kind === 'libero' ? '<p style="margin:0">Quel giorno non avrà turni.</p>' : ''}
      ${weekHas && p && !p.currentOk ? `<div><b style="font-size:13px">Cosa fare con i turni di quel giorno?</b>
        ${(p.swaps || []).map((sw, i) => `<label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;cursor:pointer"><input type="radio" name="acc-how" value="swap${i}" ${i === 0 ? 'checked' : ''} style="margin-top:3px"><span>🔄 ${i === 0 ? '<b>Consigliato:</b> ' : ''}${swapTxt(q, sw)}<br><span class="small">${newsTxt(sw)}</span></span></label>`).join('')}
        ${p.proposal ? `<label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;cursor:pointer"><input type="radio" name="acc-how" value="new" ${p.swaps ? '' : 'checked'} style="margin-top:3px"><span>Solo nuovo turno per lui/lei: <b>${shiftTxt(p.proposal)}</b><br><span class="small" style="color:var(--warn-ink)">⚠️ il turno di ora (${p.current.filter((x) => !x.doppio).map(shiftTxt).join(', ')}) resta da coprire</span></span></label>` : ''}
        <label style="display:flex;gap:8px;align-items:flex-start;margin-top:8px;cursor:pointer"><input type="radio" name="acc-how" value="none" ${!p.swaps && !p.proposal ? 'checked' : ''} style="margin-top:3px"><span>Non toccare i turni adesso (li sistemo io; i controlli segnaleranno il turno non compatibile)</span></label></div>` : ''}
      ${weekHas && p && p.currentOk ? '<p class="small muted" style="margin:0">Il turno attuale è già compatibile: non cambia niente.</p>' : ''}
      ${!weekHas ? '<p class="small muted" style="margin:0">La settimana non è ancora pianificata: "Genera turni" terrà conto della richiesta.</p>' : ''}
      <label class="f">Messaggio per il dipendente (facoltativo)<input type="text" id="acc-msg" maxlength="200" placeholder="es. ok, ti metto in apertura"></label>
    </div>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn primary" onclick="doAccept(${id})">Accetta</button></div>`);
}
async function doAccept(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  if (q.kind === 'fisso') {
    const f = document.getElementById('acc-from').value, to = document.getElementById('acc-to').value;
    if (f) q.day = T.toDay(f);
    q.to = to ? T.toDay(to) : null;
    if (q.to != null && q.to < q.day) return alert('"Fino al" deve essere dopo "Valido dal".');
  }
  const t = document.getElementById('acc-t');
  if (t && q.kind === 'impegno') q.until = +t.value;
  if (t && q.kind === 'dalle') q.from = +t.value;
  const how = (document.querySelector('input[name="acc-how"]:checked') || {}).value || 'none';
  const apply = how === 'new';
  let applied = null, swapped = null;
  if (how.startsWith('swap')) {
    const sws = T.proposeSwap(state, { ...q, status: 'accettata' }) || [];
    const sw = sws[+how.slice(4)] || sws[0];
    if (sw) {
      state.shifts = state.shifts.map((x) => (x === sw.from ? sw.theirs : x === sw.with ? sw.mine : x));
      applied = sw.mine; swapped = sw;
    }
  }
  if (apply) {
    const p = T.proposeFor(state, q);
    if (p.proposal) {
      state.shifts = state.shifts.filter((x) => !(x.employeeId === q.employeeId && x.day === q.day && !x.doppio));
      applied = { ...p.proposal, id: newId() }; state.shifts.push(applied);
      // un doppio che non rispetta più la richiesta va tolto
      state.shifts = state.shifts.filter((x) => !(x.employeeId === q.employeeId && x.day === q.day && x.doppio && ((q.until != null && x.end > q.until) || (q.from != null && x.start < q.from))));
    }
  }
  const msg = (document.getElementById('acc-msg').value || '').trim();
  q.status = 'accettata';
  q.reply = msg || (q.kind === 'fisso' ? 'Ok, ne terrò conto nei turni.' : q.kind === 'libero' ? 'Ok, quel giorno sei libero/a.' : applied ? `Ok: il tuo turno è ${T.fmtTime(applied.start)}–${T.fmtTime(applied.end)}.` : `Ok: il turno sarà compatibile (${LIMIT_TXT(q)}).`);
  closeModal(); save(); render();
  if (swapped) {
    const other = empById(swapped.partner);
    showModal(`<h3>✅ Richiesta accettata e turni scambiati</h3><p>${esc(T.fullName(empById(q.employeeId)))}: <b>${shiftTxt(swapped.mine)}</b><br>${esc(T.fullName(other))}: <b>${shiftTxt(swapped.theirs)}</b></p>
      <p class="notice warn">Ricordati di avvisare <b>${esc(T.fullName(other))}</b> che il suo turno di ${T.DOW_LONG[T.dow(q.day)]} ${T.itDate(q.day)} è cambiato.</p><div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
  }
  pushOrari([q.employeeId]).catch(() => null);
  try { await TurniCloud.answerRequest(q.rid, 'accettata', q.reply); } catch (e) { alert('Accettata qui, ma la risposta al dipendente non è partita (connessione?). Riprova più tardi da "Rimetti in attesa" → Accetta.'); }
}
/** Turni già pianificati (da oggi in poi) che non rispettano gli impegni fissi della richiesta. */
function fixedConflicts(q) {
  const from = Math.max(q.day, T.todayDay());
  const fake = { ...state, requests: [{ ...q, status: 'accettata' }] };
  const out = [];
  for (const s of state.shifts) {
    if (s.employeeId !== q.employeeId || s.day < from || (q.to != null && s.day > q.to)) continue;
    const ctx = { limits: T.makeCtx(fake, T.mondayOf(s.day)).limits };
    if (!T.fitsLimit(ctx, s)) out.push(s);
  }
  return out.sort((a, b) => a.day - b.day || a.start - b.start);
}
async function deleteRequests(ids) {
  const list = state.requests.filter((q) => ids.includes(q.id));
  if (!list.length) return;
  const acc = list.filter((q) => q.status === 'accettata').length;
  if (!confirm(`Eliminare ${list.length === 1 ? 'questa richiesta' : list.length + ' richieste'}?${acc ? `\n${acc === 1 ? 'È accettata' : acc + ' sono accettate'}: il generatore smetterà di tenerne conto.` : ''}\nIl dipendente la vedrà come "cancellata dal manager".`)) return;
  state.requests = state.requests.filter((q) => !ids.includes(q.id)); save(); render();
  pushOrari([...new Set(list.map((q) => q.employeeId))]).catch(() => null);
  let fail = 0;
  for (const q of list) { try { await TurniCloud.deleteRequest(q.rid); } catch (e) { fail++; } }
  if (fail) alert(`Eliminate qui, ma ${fail} non sono state cancellate online (connessione?).`);
}
function askReject(id) {
  showModal(`<h3>Rifiuta la richiesta</h3><div class="form"><label class="f">Motivo per il dipendente (facoltativo)<input type="text" id="rej-msg" maxlength="200" placeholder="es. quel giorno siamo scoperti, ne parliamo"></label></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn danger" onclick="doReject(${id})">Rifiuta</button></div>`);
}
async function doReject(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  q.status = 'rifiutata'; q.reply = (document.getElementById('rej-msg').value || '').trim() || 'Non è possibile, parliamone.';
  closeModal(); save(); render(); pushOrari([q.employeeId]).catch(() => null);
  try { await TurniCloud.answerRequest(q.rid, 'rifiutata', q.reply); } catch (e) { alert('Rifiutata qui, ma la risposta al dipendente non è partita (connessione?).'); }
}
async function reopenRequest(id) {
  const q = state.requests.find((x) => x.id === id); if (!q) return;
  q.status = 'in attesa'; q.reply = ''; save(); render(); pushOrari([q.employeeId]).catch(() => null);
  try { await TurniCloud.answerRequest(q.rid, 'in attesa', ''); } catch (e) { /* riprova alla prossima risposta */ }
}

// --- esporta / importa ---
function exportData() {
  const data = { app: 'pianificatore-turni', exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `turni-${T.toIso(T.todayDay())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { return alert('Il file non è valido.'); }
    const st = data && data.state ? data.state : data;
    if (!st || !Array.isArray(st.employees) || !Array.isArray(st.shifts)) return alert('Questo file non contiene dati di turni.');
    if (!confirm(`Importare ${st.employees.length} dipendenti e ${st.shifts.length} turni? I dati attuali di questo browser verranno sostituiti.`)) return;
    state = TurniData.migrate(st); save(); go('turni');
  };
  r.readAsText(file);
}
function setCovMin(i, k, v) {
  const r = state.coverage[i];
  if (!r.min) r.min = [0, 1, 2, 3, 4, 5, 6].map(() => r.minStaff || 0);
  r.min[k] = Math.max(0, Math.round(+v || 0));
  save();
}
function saveConfig() {
  const keys = ['crewMaxWeekday', 'crewMax', 'hospMax', 'minShift', 'rest11', 'rest36', 'doubleMax', 'doubleGap', 'closeGrace', 'requestMargin'];
  const vals = keys.map((k) => T.parseHours(document.getElementById('cfg-' + k).value));
  if (vals.some((v, i) => v == null || (['closeGrace', 'requestMargin'].includes(keys[i]) ? v < 0 : v <= 0))) { const e = document.getElementById('cfg-error'); e.style.display = 'block'; e.textContent = 'Valori non validi: usa numeri di ore, es. 4 o 4,5.'; return; }
  const open = +document.getElementById('cfg-open').value, close = +document.getElementById('cfg-close').value;
  if (close <= open) { const e = document.getElementById('cfg-error'); e.style.display = 'block'; e.textContent = "La chiusura deve essere dopo l'apertura."; return; }
  keys.forEach((k, i) => (state.config[k] = vals[i]));
  state.config.open = open; state.config.close = close;
  state.config.afternoonStart = +document.getElementById('cfg-aft0').value; state.config.afternoonEnd = +document.getElementById('cfg-aft1').value;
  state.config.dinnerPreStart = +document.getElementById('cfg-pre').value;
  state.config.weekdayLongPerWeek = Math.max(0, Math.min(4, Math.round(+document.getElementById('cfg-longpw').value || 0)));
  save(); render();
  showModal('<h3>Regole salvate</h3><p>I controlli dei turni ora usano i nuovi valori.</p><div class="actions"><button class="btn primary" onclick="closeModal()">OK</button></div>');
}

saveLocal();
render();
if (TurniCloud.loggedIn()) cloudPull().then(() => checkInbox(true));
else if (ui.locked) { if (storeCode()) loadGateLogin(storeCode()); else { ui.gateLogin = ''; render(); } }
else if (TurniCloud.configured()) { if (!state.employees.length) askCloudLogin(); }
else loadFromSite(false);
// installabile come app (schermata Home del telefono o del computer)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => null);
</script>
