<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Turni</title>
<link rel="manifest" href="app-personale.webmanifest">
<meta name="theme-color" content="#1e5631">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<link rel="icon" href="icone/icona-192.png">
<style>
  :root { --green: #1e5631; --green-soft: #d5eadb; --yellow: #ffc72c; --ink: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --bg: #f6f6f4; --err: #ffd3d6; --err-ink: #b3261e; --warn: #fff0c2; --warn-ink: #8a6100; --ok: #dcf0e1; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  header { background: var(--green); color: #fff; padding: 16px 18px calc(16px + env(safe-area-inset-top, 0px)); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
  main { padding: 14px 14px 40px; max-width: 560px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  label.f { display: grid; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
  input, select, textarea { font: inherit; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  .kinds { display: grid; gap: 8px; margin-bottom: 14px; }
  .kinds label { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 600; }
  .kinds label.on { border-color: var(--green); background: var(--green-soft); color: var(--green); }
  .kinds input { width: auto; margin: 0; accent-color: var(--green); }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 14px; width: 100%; cursor: pointer; }
  button.primary { background: var(--green); color: #fff; }
  button.light { background: #fff; border: 1px solid var(--line); color: var(--ink); padding: 10px; width: auto; }
  button:disabled { opacity: .5; }
  .notice { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .notice.err { background: var(--err); color: var(--err-ink); } .notice.ok { background: var(--ok); color: var(--green); } .notice.info { background: #e8eefc; color: #1e40af; }
  .req { border-top: 1px solid var(--line); padding: 12px 0; }
  .req:first-child { border-top: 0; padding-top: 0; }
  .req b { display: block; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-top: 4px; }
  .pill.wait { background: var(--warn); color: var(--warn-ink); } .pill.yes { background: var(--ok); color: var(--green); } .pill.no { background: var(--err); color: var(--err-ink); }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
</style>
</head>
<body>
<header><div class="row" style="margin:0"><h1>📅 Turni</h1><button id="logout" class="light" style="display:none;padding:6px 10px;font-size:13px" onclick="logout()">Esci</button></div><p id="hello"></p></header>
<main id="app"></main>
<script src="turni-cloud-config.js?v=202610301323"></script>
<script src="turni-cripto.js?v=202610301323"></script>
<script>
'use strict';
/*
 * App del personale (installabile sul telefono): ci si entra con nome utente e password dati dal manager
 * e si inviano richieste sui turni. Le richieste sono cifrate sul telefono con la chiave pubblica del locale:
 * le può leggere solo il manager. Da qui non si vede niente dei dati del locale.
 * Il link (uguale per tutti) contiene solo ?s = codice del locale.
 */
const cfg = window.TURNI_CLOUD_CONFIG || {};
const STORE = new URLSearchParams(location.search).get('s') || Object.fromEntries(new URLSearchParams(location.hash.slice(1))).s || localStorage.getItem('turni-locale') || '';
if (STORE) try { localStorage.setItem('turni-locale', STORE); } catch (e) { /* niente */ }
const BASE = `https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents/negozi/${STORE}`;
const SESS = `turni-accesso-${STORE}`;
let session = (() => { try { return JSON.parse(localStorage.getItem(SESS)) || null; } catch (e) { return null; } })();
const MINE = () => `richieste-mie-${STORE}-${session ? session.emp : ''}`;
const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const DOW = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const dateLabel = (iso) => { const d = new Date(iso + 'T12:00:00'); return `${DOW[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };
const times = (from, to, sel) => { let o = ''; for (let m = from; m <= to; m += 15) o += `<option value="${m}" ${m === sel ? 'selected' : ''}>${fmt(m)}</option>`; return o; };
const mine = () => { try { return JSON.parse(localStorage.getItem(MINE())) || []; } catch (e) { return []; } };
const saveMine = (l) => { try { localStorage.setItem(MINE(), JSON.stringify(l)); } catch (e) { /* niente */ } };
let kind = 'impegno', pub = null, ntfy = null, msg = '';
// impegni fissi ogni settimana: righe giorno + dalle + alle (d: 1 = lunedì … 7 = domenica)
let slots = [{ d: 1, a: 660, b: 960 }];
const DAYS = ['', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato', 'Domenica'];
const shortDate = (iso) => { const d = new Date(iso + 'T12:00:00'); return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`; };

function describe(q) {
  if (q.kind === 'fisso') return `Impegni fissi ogni settimana: ${(q.slots || []).map((x) => `${DAYS[x.d].toLowerCase()} ${fmt(x.a)}–${fmt(x.b)}`).join(', ')}${q.to ? ` (fino al ${shortDate(q.to)})` : ''}`;
  return q.kind === 'impegno' ? `Ho un impegno alle ${fmt(q.time)}` : q.kind === 'dalle' ? `Posso lavorare solo dalle ${fmt(q.from)}` : 'Non posso lavorare';
}
const setSlot = (i, k, v) => { slots[i][k] = +v; };
function slotRows() {
  return slots.map((x, i) => `<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:8px">
      <select onchange="setSlot(${i},'d',this.value)">${DAYS.slice(1).map((n, k) => `<option value="${k + 1}" ${x.d === k + 1 ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <select onchange="setSlot(${i},'a',this.value)" aria-label="dalle">${times(360, 1410, x.a)}</select>
      <select onchange="setSlot(${i},'b',this.value)" aria-label="alle">${times(390, 1440, x.b)}</select>
      ${slots.length > 1 ? `<button class="light" style="padding:8px 10px" onclick="keep();slots.splice(${i},1);render()" aria-label="togli">✕</button>` : '<span></span>'}
    </div>`).join('');
}
// ---- installazione come app ----
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; render(); });
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isIos = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
// Istruzioni per mettere l'app sulla schermata Home, a seconda del telefono e del browser
const INSTALL = {
  android: [
    ['Chrome', 'tocca i tre puntini <b>⋮</b> in alto a destra → <b>"Installa app"</b> (o "Aggiungi a schermata Home")'],
    ['Samsung Internet', 'tocca il menu <b>≡</b> in basso a destra → <b>"Aggiungi pagina a"</b> → <b>"Schermata Home"</b> (oppure l\'icona di installazione nella barra dell\'indirizzo)'],
    ['Firefox', 'tocca i tre puntini <b>⋮</b> → <b>"Installa"</b> (o "Aggiungi alla schermata principale")'],
    ['Edge', 'tocca i tre puntini <b>…</b> in basso → <b>"Aggiungi al telefono"</b> (o "Installa app")'],
    ['Opera', 'tocca i tre puntini <b>⋮</b> → <b>"Schermata Home"</b> (o "Aggiungi a…" → "Schermata Home")'],
    ['Brave', 'tocca i tre puntini <b>⋮</b> → <b>"Installa app"</b> (o "Aggiungi a schermata Home")'],
  ],
  ios: [
    ['Safari', 'tocca <b>Condividi</b> (il quadrato con la freccia in su) → <b>"Aggiungi alla schermata Home"</b>'],
    ['Chrome', 'tocca <b>Condividi</b> (il quadrato con la freccia, in alto a destra nella barra) → <b>"Aggiungi alla schermata Home"</b>'],
    ['Firefox', 'tocca il menu <b>≡</b> → <b>Condividi</b> → <b>"Aggiungi alla schermata Home"</b>'],
    ['Edge', 'tocca i tre puntini <b>…</b> → <b>Condividi</b> → <b>"Aggiungi alla schermata Home"</b>'],
  ],
};
function whichBrowser() {
  const ua = navigator.userAgent;
  if (/FBAN|FBAV|Instagram|Telegram|Line\//i.test(ua)) return 'app';
  if (isIos()) return /CriOS/.test(ua) ? 'Chrome' : /FxiOS/.test(ua) ? 'Firefox' : /EdgiOS/.test(ua) ? 'Edge' : 'Safari';
  return /SamsungBrowser/.test(ua) ? 'Samsung Internet' : /Firefox/.test(ua) ? 'Firefox' : /EdgA/.test(ua) ? 'Edge' : /OPR|OPT\//.test(ua) ? 'Opera' : /Brave/.test(ua) ? 'Brave' : 'Chrome';
}
function installBox() {
  if (standalone()) return '';
  const android = /android/i.test(navigator.userAgent), ios = isIos();
  const button = installEvt ? '<button class="primary" style="margin:8px 0 4px" onclick="installApp()">Installa l\'app</button>' : '';
  if (!android && !ios) return button ? `<div class="card"><b>📲 Installa l'app</b>${button}</div>` : '';
  const list = INSTALL[ios ? 'ios' : 'android'], b = whichBrowser();
  const mine = list.find(([n]) => n === b);
  const fromApp = '<p class="muted" style="margin:6px 0 0">Se hai aperto il link da <b>WhatsApp, Instagram, Facebook o Telegram</b>, prima aprilo nel browser: tocca i tre puntini (o "…") e scegli <b>"Apri nel browser"</b> / <b>"Apri in Chrome"</b>' + (ios ? ' / <b>"Apri in Safari"</b>' : '') + '.</p>';
  return `<div class="card"><b>📲 Metti l'app "Turni" sulla schermata Home</b>
    ${button}
    ${b === 'app' ? fromApp : mine ? `<p class="muted" style="margin:6px 0 0">Stai usando <b>${b}</b>: ${mine[1]}.</p>${fromApp}` : fromApp}
    <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Usi un altro browser?</summary>
      <ul class="muted" style="margin:6px 0 0;padding-left:18px">${list.map(([n, t]) => `<li style="margin:4px 0"><b>${n}</b>: ${t}</li>`).join('')}</ul></details>
    <p class="muted" style="margin:8px 0 0">Dopo, apri l'app dall'icona verde "Turni" e accedi.</p></div>`;
}
async function installApp() { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* niente */ } installEvt = null; render(); }

// ---- accesso con nome utente e password ----
let role = (() => { try { return localStorage.getItem('turni-ruolo') || ''; } catch (e) { return ''; } })();
const setRole = (r) => { role = r; try { if (r) localStorage.setItem('turni-ruolo', r); else localStorage.removeItem('turni-ruolo'); } catch (e) { /* niente */ } msg = ''; render(); };
function chooseView() {
  return `${installBox()}<div class="card"><h2>Chi sei?</h2>
    <button class="primary" style="margin-bottom:10px" onclick="setRole('dipendente')">👤 Sono un dipendente</button>
    <button class="light" style="width:100%;padding:14px" onclick="location.href='index.html?s=' + encodeURIComponent(STORE)">🔑 Sono un manager</button>
    <p class="muted" style="margin:10px 0 0">I dipendenti entrano con nome utente e password personali; i manager con la password comune dei manager.</p></div>`;
}
function loginView() {
  return `${msg}${installBox()}<div class="card"><h2>Accedi</h2>
    <p class="muted" style="margin-top:-6px">Usa il nome utente e la password che ti ha dato il tuo manager.</p>
    <label class="f">Nome utente<input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="es. mario.r"></label>
    <label class="f">Password<input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label>
    <button class="primary" id="lb" onclick="login()">Entra</button>
    <p style="margin:12px 0 0;text-align:center"><a href="#" onclick="setRole('');return false" style="color:var(--green)">← Torna alla scelta (dipendente o manager)</a></p></div>`;
}
async function login() {
  const user = document.getElementById('lu').value.trim().toLowerCase(), pw = document.getElementById('lp').value.trim();
  const show = (t) => { msg = `<div class="notice err">${t}</div>`; render(); };
  if (!user || !pw) return show('Scrivi nome utente e password.');
  const b = document.getElementById('lb'); b.disabled = true; b.textContent = 'Accesso…';
  try {
    const code = await TurniCripto.codeHash(STORE, user, pw);
    const r = await fetch(`${BASE}/accessi/${code}?key=${cfg.apiKey}`, { cache: 'no-store' });
    if (!r.ok) return show(r.status === 404 || r.status === 403 ? 'Nome utente o password sbagliati.' : 'Accesso non riuscito, riprova tra poco.');
    const f = (await r.json()).fields || {};
    session = { user, code, emp: f.emp && f.emp.stringValue, nome: (f.nome && f.nome.stringValue) || '' };
    try { localStorage.setItem(SESS, JSON.stringify(session)); } catch (e) { /* niente */ }
    msg = ''; render(); if (mine().length) refresh();
  } catch (e) { show(e instanceof TypeError ? 'Nessuna connessione a internet.' : 'Accesso non riuscito.'); }
}
function logout() { if (!confirm('Uscire? Per rientrare servono nome utente e password.')) return; session = null; role = ''; try { localStorage.removeItem(SESS); } catch (e) { /* niente */ } msg = ''; render(); }

function render() {
  const app = document.getElementById('app');
  document.getElementById('logout').style.display = session ? '' : 'none';
  if (!STORE) { app.innerHTML = '<div class="card"><div class="notice err">Manca il codice del locale.</div><p>Apri il link che ti ha mandato il tuo manager.</p></div>'; return; }
  if (!session) { document.getElementById('hello').textContent = role === 'dipendente' ? 'Richieste per i turni al tuo manager.' : 'App dei turni del locale.'; app.innerHTML = role === 'dipendente' ? loginView() : chooseView(); return; }
  document.getElementById('hello').textContent = session.nome ? `Ciao ${session.nome}! Qui chiedi al tuo manager un turno compatibile con i tuoi impegni.` : 'Qui chiedi al tuo manager un turno compatibile con i tuoi impegni.';
  const today = new Date(); const iso = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const list = mine().slice().reverse();
  app.innerHTML = `
  ${msg}
  ${installBox()}
  <div class="card">
    <h2>Nuova richiesta</h2>
    <div class="kinds">
      ${[['impegno', 'Ho un impegno a un\'ora precisa', 'es. concerto alle 21:00: ti serve un turno che finisca prima'], ['dalle', 'Posso lavorare solo da una certa ora', 'es. quel giorno ho lezione la mattina'], ['fisso', 'Ho impegni fissi ogni settimana', 'es. università o allenamenti: lunedì 11–16, martedì 7–12…']].map(([k, t, h]) =>
        `<label class="${kind === k ? 'on' : ''}"><input type="radio" name="k" value="${k}" ${kind === k ? 'checked' : ''} onchange="kind=this.value;keep();render()"><span>${t}${h ? `<br><span class="muted" style="font-weight:400">${h}</span>` : ''}</span></label>`).join('')}
    </div>
    ${kind !== 'fisso' ? `<label class="f">Giorno<input type="date" id="date" min="${iso}"></label>` : `
      <p style="margin:0 0 8px;font-weight:600;color:var(--muted);font-size:14px">Quando sei impegnato/a? <span style="font-weight:400">(giorno · dalle · alle, compreso il tempo per arrivare)</span></p>
      ${slotRows()}
      <button class="light" style="margin-bottom:14px" onclick="keep();slots.push({ d: Math.min(7, (slots[slots.length - 1] || { d: 0 }).d + 1), a: 660, b: 960 });render()">+ Aggiungi un altro giorno</button>
      <label class="f">Valido dal<input type="date" id="date" min="${iso}" value="${iso}"></label>
      <label class="f">Fino al (se non lo sai, lascia vuoto)<input type="date" id="to" min="${iso}"></label>`}
    ${kind === 'impegno' ? `<label class="f">A che ora è l'impegno?<select id="time">${times(480, 1440, 1260)}</select></label>` : ''}
    ${kind === 'dalle' ? `<label class="f">Da che ora puoi lavorare?<select id="from">${times(450, 1170, 900)}</select></label>` : ''}
    <label class="f">Nota (facoltativa)<textarea id="note" maxlength="300" placeholder="es. concerto a Roma"></textarea></label>
    <button class="primary" id="send" onclick="send()">Invia la richiesta</button>
    <p class="muted" style="margin:10px 0 0">La richiesta va al tuo manager, che decide il turno. Finché non risponde resta "in attesa".</p>
  </div>
  <div class="card">
    <div class="row"><h2 style="margin:0">Le mie richieste</h2>${list.length ? '<button class="light" onclick="refresh()">🔄 Aggiorna</button>' : ''}</div>
    ${list.map((q) => `<div class="req"><b>${q.kind === 'fisso' ? `Dal ${shortDate(q.date)}` : dateLabel(q.date)}</b>${esc(describe(q))}${q.note ? ` <span class="muted">· ${esc(q.note)}</span>` : ''}<br>
      <span class="pill ${q.status === 'accettata' ? 'yes' : q.status === 'rifiutata' || q.status === 'cancellata' ? 'no' : 'wait'}">${q.status === 'accettata' ? '✓ Accettata' : q.status === 'rifiutata' ? '✕ Rifiutata' : q.status === 'cancellata' ? 'Cancellata dal manager' : '⏳ In attesa'}</span>
      ${q.risposta ? `<div class="muted" style="margin-top:4px">Risposta: ${esc(q.risposta)}</div>` : ''}</div>`).join('') || '<p class="muted" style="margin:0">Ancora nessuna richiesta da questo telefono.</p>'}
  </div>`;
  restore();
}
// mantiene i campi compilati quando si cambia tipo di richiesta
let draft = {};
function keep() { for (const id of ['date', 'note', 'time', 'from', 'to']) { const el = document.getElementById(id); if (el) draft[id] = el.value; } }
function restore() { for (const [id, v] of Object.entries(draft)) { const el = document.getElementById(id); if (el && v) el.value = v; } }

async function loadPub() {
  if (pub) return pub;
  const r = await fetch(`${BASE}?key=${cfg.apiKey}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('Il tuo locale non ha ancora attivato le richieste: chiedi al manager.');
  const j = await r.json(); pub = j.fields && j.fields.pub && j.fields.pub.stringValue;
  ntfy = j.fields && j.fields.ntfy && j.fields.ntfy.stringValue;
  if (!pub) throw new Error('Il tuo locale non ha ancora attivato le richieste: chiedi al manager.');
  return pub;
}
async function send() {
  keep();
  const date = draft.date, note = (draft.note || '').trim();
  const show = (cls, t) => { msg = `<div class="notice ${cls}">${t}</div>`; render(); window.scrollTo(0, 0); };
  if (!date) return show('err', 'Scegli il giorno.');
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Invio…';
  const q = { date, kind, note };
  if (kind === 'impegno') q.time = +draft.time;
  if (kind === 'dalle') q.from = +draft.from;
  if (kind === 'fisso') {
    if (!slots.length || slots.some((x) => x.b <= x.a)) { const btn2 = document.getElementById('send'); btn2.disabled = false; btn2.textContent = 'Invia la richiesta'; return show('err', 'Controlla gli orari: "alle" deve essere dopo "dalle".'); }
    q.slots = slots.map((x) => ({ ...x })); if (draft.to) q.to = draft.to;
    if (q.to && q.to < date) { const btn2 = document.getElementById('send'); btn2.disabled = false; btn2.textContent = 'Invia la richiesta'; return show('err', '"Fino al" deve essere dopo "Valido dal".'); }
  }
  try {
    const sealed = await TurniCripto.sealFor(await loadPub(), q);
    const rid = Array.from(crypto.getRandomValues(new Uint8Array(15)), (b) => b.toString(36).padStart(2, '0')).join('').slice(0, 24);
    const fields = { emp: String(session.emp), code: session.code, ...sealed, createdAt: new Date().toISOString(), status: 'in attesa' };
    const r = await fetch(`${BASE}/richieste?documentId=${rid}&key=${cfg.apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, { stringValue: v }])) }) });
    if (!r.ok) {
      if (r.status === 403) { session = null; try { localStorage.removeItem(SESS); } catch (e) { /* niente */ } throw new Error('La tua password è stata cambiata dal manager: rientra con quella nuova.'); }
      throw new Error('Invio non riuscito, riprova tra poco.');
    }
    saveMine([...mine(), { rid, ...q, status: 'in attesa', sentAt: new Date().toISOString() }]);
    // avviso sul telefono del manager (app ntfy), senza nomi: il dettaglio si vede solo nell'app
    if (ntfy) fetch(`https://ntfy.sh/${ntfy}?title=${encodeURIComponent('Turni')}&tags=calendar`, { method: 'POST', body: '📩 Nuova richiesta di turno: aprila nell\'app' }).catch(() => null);
    draft = {}; kind = 'impegno'; slots = [{ d: 1, a: 660, b: 960 }];
    show('ok', '✓ Richiesta inviata. Il manager la vedrà e ti risponderà qui.');
  } catch (e) {
    show('err', e instanceof TypeError ? 'Nessuna connessione a internet.' : esc(e.message));
  }
}
async function refresh() {
  const list = mine();
  for (const q of list) {
    try {
      const r = await fetch(`${BASE}/richieste/${q.rid}?key=${cfg.apiKey}`, { cache: 'no-store' });
      if (r.status === 404) { q.status = 'cancellata'; continue; }
      const j = await r.json(); const f = j.fields || {};
      q.status = (f.status && f.status.stringValue) || q.status; q.risposta = (f.risposta && f.risposta.stringValue) || '';
    } catch (e) { /* senza rete: resta com'era */ }
  }
  saveMine(list); msg = ''; render();
}
render();
if (session && mine().length) refresh();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => null);
</script>
